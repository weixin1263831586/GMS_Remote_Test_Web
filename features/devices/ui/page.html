<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备串口</title>
    <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
    <style>{{CONSOLE_CSS}}</style>
</head>
<body>
<main class="page-shell">
    <header class="toolbar">
        <div id="console-view-tabs" class="view-tabs" role="tablist" aria-label="设备串口视图">
            <button id="ports-tab" class="view-tab active" type="button" role="tab" aria-selected="true" aria-controls="ports-section">本机串口</button>
            <!-- 控制台 tab 由 page.js 依据打开的会话动态渲染（支持多个控制台并存）。 -->
        </div>
        <div class="toolbar-actions">
            <span id="refresh-status" class="muted">准备中</span>
            <button id="refresh-ports" type="button">刷新端口</button>
        </div>
    </header>

    <div id="page-notice" class="notice" hidden></div>
    <section id="ports-section" class="view-panel" role="tabpanel">
        <div class="section-heading">
            <div class="heading-main"><h2>本机串口</h2><p>支持 /dev/ttyUSB*、/dev/ttyACM*，优先使用 by-id 稳定标识。</p></div>
        </div>
        <div id="ports-list" class="ports-grid"><div class="empty">正在扫描串口…</div></div>
    </section>

    <!-- 控制台面板与 tab 由 page.js 依据打开的会话动态渲染（支持多个控制台并存）。 -->
    <section id="console-section" class="view-panel console-panel" hidden></section>
</main>

<div id="binding-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="binding-title">
    <form id="binding-form" class="modal" autocomplete="off">
        <div class="modal-head"><h2 id="binding-title">串口绑定</h2><button id="close-binding" type="button" aria-label="关闭">×</button></div>
        <p id="binding-port" class="mono"></p>
        <label>绑定设备<select id="binding-label" required><option value="">正在加载本机设备…</option></select></label>
        <label>备注<textarea id="binding-note" maxlength="500" rows="3" placeholder="串口线连接位置、板卡或故障说明"></textarea></label>
        <label>波特率<input id="binding-baudrate" type="number" min="300" max="4000000" list="baudrate-options" required value="1500000"></label>
        <datalist id="baudrate-options"><option value="115200"></option><option value="921600"></option><option value="1500000"></option></datalist>
        <label>回车发送<select id="binding-newline"><option value="cr">CR (\r)</option><option value="lf">LF (\n)</option><option value="crlf">CRLF</option><option value="none">不追加</option></select></label>
        <label class="switch-row"><input id="binding-capture" type="checkbox"><span>开启常驻日志采集</span></label>
        <div class="modal-actions">
            <button id="delete-binding" class="danger" type="button">删除绑定</button>
            <span class="spacer"></span>
            <button id="cancel-binding" type="button">取消</button>
            <button class="primary" type="submit">保存</button>
        </div>
    </form>
</div>

<script src="/static/js/embedded-workspace.js?v=20260917-arrow-forward-v2"></script>
<script src="/static/vendor/xterm/xterm.min.js"></script>
<script src="/static/vendor/xterm/xterm-addon-fit.min.js"></script>
<script src="/devices-console/page.js"></script>
</body>
</html>
