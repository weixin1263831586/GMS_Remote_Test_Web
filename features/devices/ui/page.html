<!DOCTYPE html>
<html lang="zh-CN" data-ui-type-root="devices">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备串口</title>
    <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
    <link rel="stylesheet" href="/static/css/theme.css?v=20261112-purple-surfaces">
    <style>{{CONSOLE_CSS}}</style>
<link rel="stylesheet" href="/static/css/ui-foundations.css?v=20261128-button-contract">
<link rel="stylesheet" href="/static/css/modal.css?v=20261116-modal-tiers">
<link rel="stylesheet" href="/static/css/modal-tech.css?v=20261128-compact-fields">
<link rel="stylesheet" href="/static/css/modal-tech-dialogs.css?v=20261128-compact-fields">
<link rel="stylesheet" href="/static/css/modal-tech-cases.css?v=20261128-compact-fields">
<link rel="stylesheet" href="/static/css/workspace-tabs.css?v=20261127-tabs-42-110">
<script src="/static/js/workspace-tabs.js?v=20261114-unified-tabs" defer></script>
<script src="/static/js/dialog-prompts.js?v=20261116-aligned-corner-path"></script>
<script src="/static/js/dialog-frame.js?v=20261117-compact-dialogs"></script>
    <link rel="stylesheet" href="/static/css/ui-sizing.css?v=20261128-css-reference-cleanup">
                        <link rel="stylesheet" href="/static/css/typography.css?v=20261128-css-reference-cleanup">
</head>
<body>
<main class="page-shell">
    <header class="toolbar workspace-header">
        <nav id="console-view-tabs" class="view-tabs workspace-tabs" role="tablist" aria-label="设备串口视图">
            <button id="ports-tab" class="view-tab active workspace-tab" type="button" role="tab" aria-selected="true" aria-controls="ports-section">本机串口</button>
            <!-- 控制台 tab 由 page.js 依据打开的会话动态渲染（支持多个控制台并存）。 -->
        </nav>
        <div class="toolbar-actions workspace-actions">
            <span id="refresh-status" class="muted">准备中</span>
            <button id="refresh-ports" type="button">刷新端口</button>
        </div>
        <!-- 控制台操作区（Redmine 同构）：会话打开后填充，随激活 Tab 切换内容。 -->
        <div id="console-toolbar" class="header-toolbar workspace-actions" hidden>
            <span id="console-socket-status" class="socket-status status-pill ui-status is-danger offline">未连接</span>
            <div class="btn-group">
                <button id="console-reconnect" type="button" data-console-action="reconnect">重连</button>
                <button id="console-pause" type="button" data-console-action="pause">暂停</button>
                <button id="console-clear" type="button" data-console-action="clear">清屏</button>
                <button id="console-copy" type="button" data-console-action="copy">复制</button>
                <button id="console-close" type="button" data-console-action="close">关闭</button>
            </div>
        </div>
    </header>

    <div id="page-notice" class="notice" hidden></div>
    <section id="ports-section" class="view-panel ui-page-edge" role="tabpanel" aria-labelledby="ports-tab">
        <div id="ports-list" class="ports-grid"><div class="empty ui-empty-state">正在扫描串口…</div></div>
    </section>

    <!-- 控制台面板与 tab 由 page.js 依据打开的会话动态渲染（支持多个控制台并存）。 -->
    <section id="console-section" class="view-panel console-panel ui-page-edge" hidden></section>
</main>

<div id="binding-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="binding-title">
    <form id="binding-form" class="modal-content modal-s tech-dialog tech-dialog--serial-binding" autocomplete="off"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg><span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
        <div class="modal-head modal-header tech-dialog-header"><div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#plug"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><h2 id="binding-title" class="modal-title">串口绑定</h2></div><span class="tech-header-ticks" aria-hidden="true"></span><button id="close-binding" class="modal-close" type="button" aria-label="关闭">×</button><svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
        <div class="modal-body">
        <p id="binding-port" class="mono"></p>
        <label>绑定设备<select id="binding-label"><option value="">正在加载本机设备…</option></select></label>
        <p class="modal-hint">设备无法开机或未枚举时可不选，直接填备注后保存即可用串口。</p>
        <label>备注<textarea id="binding-note" maxlength="500" rows="3" placeholder="串口线连接位置、板卡或故障说明"></textarea></label>
        <label>波特率<input id="binding-baudrate" type="number" min="300" max="4000000" list="baudrate-options" required value="1500000"></label>
        <datalist id="baudrate-options"><option value="115200"></option><option value="921600"></option><option value="1500000"></option></datalist>
        <label>回车发送<select id="binding-newline"><option value="cr">CR (\r)</option><option value="lf">LF (\n)</option><option value="crlf">CRLF</option><option value="none">不追加</option></select></label>
        <label class="switch-row"><input id="binding-capture" type="checkbox"><span>开启常驻日志采集</span></label>
        </div>
        <div class="modal-actions tech-dialog-actions"><span class="tech-footer-decoration" aria-hidden="true"></span>
            <button id="delete-binding" class="danger" type="button">删除绑定</button>
            <span class="spacer"></span>
            <button id="cancel-binding" type="button">取消</button>
            <button class="primary" type="submit">保存</button>
        </div>
    </form>
</div>

<script src="/static/js/embedded-workspace.js?v=20260917-arrow-forward-v2"></script>
<script src="/static/js/shell/ui-primitives.js?v=20261112-ui-foundations"></script>
<script src="/static/vendor/xterm/xterm.min.js"></script>
<script src="/static/vendor/xterm/xterm-addon-fit.min.js"></script>
<script src="/devices-console/page.js?v=20261128-shared-status"></script>
</body>
</html>
