<!doctype html>
<html lang="zh-CN" data-ui-type-root="update-radar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMS更新雷达</title>
  <link rel="stylesheet" href="/static/css/theme.css?v=20261128-table-header-soft">
  <link rel="stylesheet" href="/static/css/form-controls.css?v=20261128-table-header-soft">
  <link rel="stylesheet" href="/static/css/ui-foundations.css?v=20261128-table-header-soft">
  <link rel="stylesheet" href="/static/css/workspace-tabs.css?v=20261128-table-header-soft">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--page-background);color:var(--text-primary);}
    main{min-width:0}h1{margin:0 0 6px}h2{margin:0 0 12px}p{margin:6px 0}.muted{color:var(--text-secondary)}
    .panel{background:var(--card-bg);border:1px solid var(--border-color);border-radius:8px;padding:16px;margin-top:16px;min-width:0}.scope,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.scope span{border:1px solid var(--border-color);background:var(--light-bg);border-radius:6px;padding:4px 10px}
    .status{white-space:pre-wrap;color:var(--primary-light)}#message{min-height:24px;white-space:pre-wrap}#message[data-error=true],.error{color:var(--danger-color)}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid var(--border-color)}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px}
    form{max-width:850px;display:grid;gap:16px}label{display:grid;gap:5px}label.check{display:flex;align-items:center;gap:8px}input:not([type=checkbox]),select,textarea{width:100%}textarea{min-height:85px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}small{color:var(--text-secondary)}
    .radar-section{margin:12px 0;border:1px solid var(--border-color);border-radius:6px;overflow:auto}.radar-subtitle{margin:18px 0 9px}.radar-section table{font-variant-numeric:tabular-nums}.radar-num{text-align:right}.radar-added{color:#4fd5a0!important;}.radar-modified{color:#ffc46e!important;}.radar-removed{color:#ff8796!important;}.radar-warning{color:#ffc46e!important;}.radar-pill{display:inline-block;padding:2px 8px;border:1px solid currentColor;border-radius:5px}.radar-description{white-space:normal;overflow-wrap:anywhere;min-width:220px;max-width:610px;line-height:1.6}.radar-evidence summary{color:var(--primary-light);cursor:pointer}.radar-evidence .diff{margin-top:6px}.radar-record-title{white-space:normal;overflow-wrap:anywhere}.radar-note{margin:10px 0;color:var(--text-secondary)}#email-preview-html{display:block;width:100%;height:620px;border:1px solid var(--border-color);border-radius:6px;background:white;margin:12px 0}
    details{border:1px solid var(--border-color);border-radius:6px;margin-top:8px;padding:10px}summary{cursor:pointer;overflow-wrap:anywhere}.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--dark-bg);border-radius:6px;padding:12px;max-height:440px;overflow:auto}a{color:var(--primary-light)}[hidden]{display:none!important}
    @media(max-width:700px){.form-row,.diff{grid-template-columns:1fr}.panel{padding:12px}.workspace-actions{overflow-x:auto}.workspace-actions button{flex:none}button,input,select{min-height:var(--ui-touch-target-height)}}
  </style>
  <!-- .modal/.modal-content/.modal-header 基础档位在 modal.css（shell 同源）；
       缺它时关闭弹框移除 .show 后元素仍按默认 display 可见。 -->
  <link rel="stylesheet" href="/static/css/modal.css?v=20261128-table-header-soft">
  <link rel="stylesheet" href="/static/css/update-radar-settings.css?v=20261128-table-header-soft">
  <link rel="stylesheet" href="/static/css/modal-tech.css?v=20261128-table-header-soft">
<link rel="stylesheet" href="/static/css/modal-tech-dialogs.css?v=20261128-table-header-soft">
<link rel="stylesheet" href="/static/css/modal-tech-cases.css?v=20261128-table-header-soft">
  <script src="/static/js/embedded-ui/modal-controller.js?v=20261128-table-header-theme" defer></script>
  <script src="/static/js/update-radar-settings.js?v=20261128-table-header-theme" defer></script>
  <script src="/static/js/workspace-tabs.js?v=20261128-table-header-theme" defer></script>
  <script src="/gms-update-radar/page.js?v=20261124-radar-period-snapshots" defer></script>
<script src="/static/js/dialog-frame.js?v=20261128-table-header-theme" defer></script>
    <link rel="stylesheet" href="/static/css/ui-sizing.css?v=20261128-table-header-soft">
                        <link rel="stylesheet" href="/static/css/typography.css?v=20261128-table-header-soft">
</head>
<body class="ui-standalone-controls">
<header class="workspace-header">
  <nav class="workspace-tabs" role="tablist" aria-label="更新雷达视图">
    <button class="workspace-tab active" role="tab" type="button" id="history-tab" data-view="history" aria-selected="true" aria-controls="history-pane">扫描记录</button>
  </nav>
  <div class="workspace-actions">
    <button id="modify" type="button" disabled title="修改" aria-label="修改">✏️</button>
    <button id="refresh" type="button">刷新</button>
    <button id="scan" class="primary" type="button" title="全量扫描当前选择的监听任务" disabled>立即全量扫描</button>
  </div>
</header>
<main class="ui-page-edge">
  <h1>📡 GMS更新雷达</h1>
  <p class="muted">按所选任务扫描GMS更新，保留每次扫描前后的差异，并通过邮件发送汇总。</p>
  <p id="schedule-status" class="status" aria-live="polite">正在读取扫描计划…</p>
  <div id="message" role="status" aria-live="polite"></div>
  <div class="scope" aria-label="扫描范围"><span data-task="requirements">GMS要求</span><span data-task="packages">GMS包更新</span><span data-task="mainline">Mainline包更新</span><span data-task="artifacts">测试套件更新</span><span data-task="bulletins">Critical_Patch</span><span data-task="exemptions">Mainline包豁免项</span><span data-task="security_patches">安全补丁（CVE）</span></div>
  <section id="history-pane" role="tabpanel" aria-labelledby="history-tab">
    <div class="panel">
      <div class="actions"><h2>扫描历史与周期快照</h2><label>记录类型<select id="radar-history-kind"><option value="daily">每日扫描</option><option value="weekly">每周快照</option><option value="monthly">每月快照</option><option value="all">全部记录</option></select></label></div>
      <p class="muted">分别记录新增、修改和移除。数据源扫描失败时保留原数据，并在结果和邮件中说明。</p>
      <div class="table-wrap"><table><thead><tr><th>批次</th><th>触发方式</th><th>开始时间</th><th>扫描结果</th><th>变更</th><th>邮件</th><th>操作</th></tr></thead><tbody id="runs"></tbody></table></div>
      <div class="pagination"><button id="runs-prev" type="button">上一页</button><span id="runs-page"></span><button id="runs-next" type="button">下一页</button></div>
    </div>
    <section id="detail" class="panel" hidden>
      <h2 id="detail-title"></h2><p id="detail-state" class="muted"></p>
      <h3 class="radar-subtitle">监控项统计</h3><div id="counts" class="radar-section"></div>
      <div id="scan-errors" hidden></div><p id="mail-error" class="error"></p>
      <div class="actions"><button id="preview-mail" type="button" disabled>预览邮件</button><button id="retry-mail" type="button" disabled>重发本次汇总</button></div>
      <iframe id="email-preview-html" sandbox title="HTML邮件预览" referrerpolicy="no-referrer" hidden></iframe>
      <pre id="email-preview" hidden></pre><h3 class="radar-subtitle">变更明细</h3><div id="changes" class="radar-section"></div>
      <div class="pagination"><button id="changes-prev" type="button">上一页</button><span id="changes-page"></span><button id="changes-next" type="button">下一页</button></div>
    </section>
  </section>
</main>
{{RADAR_SETTINGS_DIALOG}}
</body>
</html>
