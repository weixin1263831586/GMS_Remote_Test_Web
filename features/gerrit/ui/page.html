<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerrit 看板</title>
  <script src="/static/js/utils.js?v=20260601-01"></script>
  <style>
    :root { color-scheme: dark; --bg:#0b0d12; --panel:#131720; --panel2:#191f2b; --border:#2b3342; --text:#e8edf7; --muted:#96a1b5; --primary:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    html { scrollbar-gutter:stable; overflow-y:scroll; scroll-padding-top:86px; }
    header { position:sticky; top:0; z-index:1000; min-height:44px; display:flex; align-items:center; gap:16px; padding:0 16px; border-bottom:0; background:var(--panel); box-shadow:0 8px 18px rgba(0,0,0,.22); }
    .header-title { font-size:18px; font-weight:700; white-space:nowrap; margin:0; }
    select,input { height:30px; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:5px; padding:0 8px; font-size:13px; }
    input { min-width:260px; }
    button { height:30px; border:0; border-radius:6px; padding:0 10px; color:white; background:var(--primary); font-weight:650; cursor:pointer; font-size:13px; }
    button.secondary { background:#30394a; }
    main { padding:0; }
    .tabs { display:flex; align-self:stretch; gap:0; }
    /* 页签是原生 <button role="tab">（a11y 契约）：重置按钮外观，保留底部指示条。 */
    .tab { position:relative; flex:0 0 112px; width:112px; height:44px; padding:0 14px; cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:var(--muted); background:none; border:none; border-radius:0; transition:all .15s; white-space:nowrap; }
    .tab:hover { color:var(--text); }
    .tab:focus-visible { outline:0; background:rgb(59 130 246 / 12%); }
    .tab.active { color:var(--primary); }
    .tab.active::after { content:''; position:absolute; right:0; bottom:-1px; left:0; height:2px; background:var(--primary); }
    .btn-group { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; margin-left:auto; }
    .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .select-with-add { position:relative; display:inline-flex; align-items:center; }
    .select-with-add select { padding-right:28px; min-width:180px; }
    .select-add-btn { position:absolute; right:2px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); font-size:15px; padding:0 6px; line-height:1; cursor:pointer; height:24px; min-width:22px; }
    .select-add-btn:hover { color:var(--text); background:transparent; }
    .tab-content { display:none; padding:16px; }
    .tab-content.active { display:block; }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:16px; }
    .stat-card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; text-align:center; }
    .stat-card .value { font-size:28px; font-weight:750; color:var(--primary); }
    .stat-card .label { color:var(--muted); font-size:12px; margin-top:4px; }
    .stat-card.ok .value { color:var(--ok); }
    .stat-card.warn .value { color:var(--warn); }
    .stat-card.bad .value { color:var(--bad); }
    .clickable-stat { cursor:pointer; transition:transform .15s,box-shadow .15s; }
    .clickable-stat:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.3); }
    .dashboard-summary-header { display:flex; align-items:center; margin-bottom:10px; gap:12px; flex-wrap:wrap; min-height:30px; }
    .dashboard-summary-title { margin:0; font-size:15px; line-height:30px; }
    .dashboard-summary-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:30px; margin-left:auto; }
    .dashboard-summary-meta { font-size:12px; min-height:30px; display:flex; align-items:center; }
    .trend-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr)); gap:12px; margin-bottom:18px; }
    .trend-panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; min-height:180px; display:flex; flex-direction:column; }
    .trend-panel h2, .list-section h2 { margin:0 0 10px; font-size:14px; }
    .dept-section-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
    .dept-section-head h2 { margin:0; }
    .dept-hint { font-size:12px; }
    .trend-panel h2 { flex-shrink:0; line-height:30px; }
    .trend-body { overflow-y:auto; max-height:330px; flex:1; }
    .trend-body::-webkit-scrollbar { width:6px; }
    .trend-body::-webkit-scrollbar-track { background:var(--panel2); border-radius:3px; }
    .trend-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    .trend-body::-webkit-scrollbar-thumb:hover { background:var(--muted); }
    .bar-row { display:flex; align-items:center; gap:6px; margin:4px 0; font-size:12px; padding-right:8px; min-height:18px; }
    .bar-label { flex:0 0 auto; min-width:0; max-width:86px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:8px; }
    .bar-track { flex:1; height:8px; background:#202838; border-radius:999px; overflow:hidden; min-width:40px; }
    .bar-fill { height:100%; min-width:3px; background:var(--primary); border-radius:999px; }
    .bar-count { flex-shrink:0; width:28px; text-align:right; color:var(--muted); }
    .list-section { margin-bottom:16px; }
    .list-section[id], .owner-detail[id] { scroll-margin-top:86px; }
    .owner-detail { margin-bottom:16px; }
    .owner-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 8px; }
    .owner-title h2 { margin:0; font-size:15px; }
    table { width:100%; border-collapse:collapse; min-width:820px; }
    th,td { border-bottom:1px solid var(--border); padding:8px 10px; text-align:left; font-size:13px; vertical-align:top; }
    th { color:var(--muted); background:var(--panel2); }
    a { color:#7bb0ff; text-decoration:none; font-weight:700; }
    a.member-link:hover { text-decoration:underline; }
    .muted { color:var(--muted); font-size:13px; line-height:1.6; }
    .wrap { overflow:auto; border:1px solid var(--border); border-radius:8px; }
    .dept-table-wrap { overflow:auto; border:1px solid var(--border); border-radius:8px; margin-bottom:18px; }
    .dept-table { width:100%; border-collapse:collapse; min-width:760px; font-size:13px; }
    .dept-table th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:8px 10px; background:var(--panel2); border-bottom:1px solid var(--border); white-space:nowrap; }
    .dept-table td { padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .dept-table tr:last-child td { border-bottom:0; }
    .dept-table tbody tr:hover { background:#111927; }
    .dept-action-btn { width:48px; min-width:48px; max-width:48px; padding:0; text-align:center; overflow:hidden; white-space:nowrap; }
    .change-title { max-width:420px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .change-title a { margin-right:8px; }
    .gerrit-wiki-btn { margin-left:8px; padding:1px 6px; font-size:11px; line-height:1.4; cursor:pointer; border:1px solid var(--border,#ddd); background:var(--surface,#f6f8fa); border-radius:4px; color:inherit; flex:none; }
    .gerrit-wiki-btn:hover { background:var(--accent,#eef3ff); }
    .trend-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; min-height:30px; }
    .trend-title-row h2 { margin:0; }
    .trend-start-btn { width:30px; min-width:30px; padding:0; background:#30394a; color:var(--muted); }
    .trend-start-btn:hover { color:var(--text); }
    .error { color:#fca5a5; }
    .status-line { margin-bottom:10px; }
    .status-line:empty { display:none; }
    .conn-banner { display:none; align-items:center; gap:12px; flex-wrap:wrap; margin:12px 16px 0; padding:10px 14px; border-radius:8px; border:1px solid var(--bad); background:rgba(239,68,68,.12); color:#fecaca; font-size:13px; }
    .conn-banner.show { display:flex; }
    .conn-banner.ok { border-color:var(--ok); background:rgba(34,197,94,.12); color:#bbf7d0; }
    .conn-banner .conn-msg { flex:1; min-width:200px; line-height:1.5; }
    .conn-banner .conn-detail { color:var(--muted); font-size:12px; margin-top:2px; white-space:pre-line; }
    .conn-banner button { flex-shrink:0; }
    .review-badge { display:inline-block; min-width:22px; padding:1px 7px; margin-left:6px; border-radius:999px; background:var(--warn); color:#1a1206; font-size:12px; font-weight:700; line-height:1.5; }
    .modal { display:none; position:fixed; inset:0; width:100vw; z-index:10000; background:rgba(0,0,0,.68); align-items:center; justify-content:center; padding:clamp(8px,2.5vw,20px); overflow:hidden; overscroll-behavior:contain; }
    .modal.show { display:flex; }
    .modal-content { width:min(760px, 96vw); max-height:min(85vh,calc(100dvh - 16px)); min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,.4); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; gap:10px; min-width:0; padding:15px 20px; background:linear-gradient(135deg,#667eea,#764ba2); border-bottom:1px solid var(--border); }
    .modal-header h2 { margin:0; font-size:16px; font-weight:600; color:#fff; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .modal-header button.secondary { background:rgba(255,255,255,.15); color:#fff; }
    .modal-header button.secondary:hover { background:rgba(255,255,255,.25); }
    .modal-body { padding:16px; display:grid; gap:12px; overflow:auto; overscroll-behavior:contain; min-width:0; min-height:0; overflow-wrap:anywhere; }
    .modal-body > *, .modal-header > *, .modal-actions > * { min-width:0; max-width:100%; }
    #trendDetailBody { max-height:calc(85vh - 62px); }
    .form-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
    .field label { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
    .field input, .field select, .field textarea { width:100%; min-width:0; max-width:100%; }
    .field.full { grid-column:1 / -1; }
    .modal-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; padding:0 16px 16px; }
    /* 路由检查弹框：复用测试界面 route-check 风格 */
    #routeCheckModal { backdrop-filter:blur(4px); }
    #routeCheckModal .modal-content { background:var(--panel); border:1px solid var(--border); border-radius:6px; width:min(500px,96vw); max-width:min(500px,96vw); min-height:200px; max-height:min(80vh,calc(100dvh - 16px)); box-shadow:0 18px 48px rgba(0,0,0,.42); }
    #routeCheckModal .modal-header { background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
    #routeCheckModal .modal-header h3 { color:var(--text); margin:0; font-size:16px; font-weight:600; }
    #routeCheckModal .modal-close { background:transparent; border:none; font-size:28px; color:var(--muted); cursor:pointer; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:4px; transition:all .2s ease; line-height:1; padding:0; flex-shrink:0; }
    #routeCheckModal .modal-close:hover { background:rgba(239,68,68,.15); color:var(--bad); }
    #routeCheckModal .modal-close:active { transform:scale(.95); }
    #routeCheckModal .modal-body { display:block; padding:20px; overflow-y:auto; }
    html.modal-open, body.modal-open { overflow:hidden; }
    @media (max-width:800px) { header { grid-template-columns:1fr; align-items:flex-start; row-gap:8px; } input { min-width:180px; width:100%; } .toolbar { align-items:stretch; } }
    @media (max-width:560px) { .trend-grid { grid-template-columns:minmax(0,1fr); } .form-grid { grid-template-columns:1fr; } .field.full { grid-column:auto; } .modal-actions { flex-direction:column; } .modal-actions button { width:100%; } .tab { padding:10px 14px; min-height:40px; } button { min-height:40px; } .select-add-btn { height:40px; min-width:40px; } .trend-start-btn { width:40px; min-width:40px; min-height:40px; } .modal-close { width:40px; height:40px; min-width:40px; min-height:40px; } }
    @media (max-height:560px) { .modal { align-items:stretch; } .modal-content { max-height:calc(100dvh - 16px); } }
  </style>
</head>
<body>
<header>
  <div class="tabs" role="tablist" aria-label="看板视图" data-keydown="gerritTabKeydown" data-key="ArrowLeft,ArrowRight,Home,End" data-r0="event">
    <button type="button" class="tab" role="tab" aria-selected="false" data-tab="department" data-click="switchTab" data-a0="department">🏢 部门看板</button>
    <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="personal" data-click="switchTab" data-a0="personal">📈 个人看板</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-tab="query" data-click="switchTab" data-a0="query">🔍 查询</button>
  </div>
  <div class="btn-group">
    <button id="refreshBtn" class="secondary" data-click="refreshCurrentTab">🔄 刷新</button>
    <button class="secondary" data-click="showSettings" title="设置">⚙️</button>
  </div>
</header>
<div id="connBanner" class="conn-banner">
  <div class="conn-msg">
    <div id="connMsg"></div>
    <div id="connDetail" class="conn-detail"></div>
  </div>
  <button class="secondary" data-click="checkGerritRoute">📡 检查路由</button>
</div>
<main>
  <section id="tab-personal" class="tab-content active">
    <div id="personalStatus" class="muted status-line"></div>
    <div id="personalContent"><div class="muted" style="padding:40px;text-align:center">⏳ 正在统计个人 Gerrit 提交...</div></div>
  </section>
  <section id="tab-department" class="tab-content">
    <div id="departmentStatus" class="muted status-line"></div>
    <div id="departmentContent"><div class="muted" style="padding:40px;text-align:center">⏳ 正在统计部门 Gerrit 提交...</div></div>
  </section>
  <section id="tab-query" class="tab-content">
    <div class="toolbar">
      <select id="profile" data-change="loadChanges"></select>
      <input id="query" placeholder="Gerrit query，例如 status:open owner:self">
      <button data-click="loadChanges">查询</button>
    </div>
    <div id="status" class="muted status-line">加载中...</div>
    <div class="wrap"><table><thead><tr><th>变更</th><th>项目</th><th>分支</th><th>状态</th><th>Owner</th><th>更新时间</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<div id="settingsModal" class="modal">
  <div class="modal-content" style="height:min(560px,72vh)">
    <div class="modal-header">
      <h2>Gerrit 连接设置</h2>
      <button class="secondary" data-click="hideSettings">关闭</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full"><label>REST 地址</label><input id="settingBaseUrl" placeholder="从 config.json 读取"></div>
        <div class="field"><label>REST 用户名</label><input id="settingRestUser" placeholder="Gerrit 用户名"></div>
        <div class="field"><label>REST HTTP Password</label><input id="settingRestPass" type="password" placeholder="留空则保留原密码"></div>
        <div class="field"><label>SSH Host</label><input id="settingSshHost" placeholder="从 config.json 读取"></div>
        <div class="field"><label>SSH User</label><input id="settingSshUser" placeholder="SSH 用户名"></div>
        <div class="field"><label>SSH Port</label><input id="settingSshPort" type="number" placeholder="29418"></div>
        <div class="field full"><label>SSH 私钥路径</label><input id="settingSshIdentity" placeholder="~/.ssh/id_ed25519_gerrit_dashboard"></div>
        <div class="field full"><label>默认 Owner</label><input id="settingDefaultOwner" placeholder="从 config.json 读取"></div>
        <div class="field"><label>单页查询数量（≤2000）</label><input id="settingQueryPageSize" type="number" min="1" max="2000" placeholder="500"></div>
        <div class="field"><label>最大历史提交数（0=不限）</label><input id="settingMaxHistory" type="number" min="0" placeholder="0 表示拉取全部历史"></div>
      </div>
      <div class="muted">REST 返回 401 时，需要填写 Gerrit HTTP Password；如果 REST 不方便登录，可以填写 SSH Host/User，后端会自动 fallback 到 SSH。</div>
    </div>
    <div class="modal-actions">
      <button class="secondary" data-click="hideSettings">取消</button>
      <button data-click="saveSettings">保存</button>
    </div>
  </div>
</div>
<div id="addPersonalModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2>添加成员</h2><button class="secondary" data-click="hideAddPersonalModal">关闭</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>显示名</label><input id="addPersonalName" placeholder="例如：张三"></div>
        <div class="field"><label>Owner 邮箱/账号</label><input id="addPersonalOwner" placeholder="name@rock-chips.com"></div>
        <div class="field full"><label>所属部门</label><div class="select-with-add" style="width:100%"><select id="addPersonalDepartment" style="width:100%;min-width:0"></select><button class="select-add-btn" type="button" data-click="showAddDepartmentModal" data-a0="addPersonalDepartment" title="添加部门">＋</button></div></div>
      </div>
    </div>
    <div class="modal-actions"><button class="secondary" data-click="hideAddPersonalModal">取消</button><button data-click="savePersonalProfile">保存</button></div>
  </div>
</div>
<div id="addDepartmentModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2>添加部门看板</h2><button class="secondary" data-click="hideAddDepartmentModal">关闭</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>部门名称</label><input id="addDepartmentName" placeholder="例如：系统一部"></div>
        <div class="field"><label>部门 ID</label><input id="addDepartmentId" placeholder="可选，例如 system-1"></div>
        <div class="field full"><label>成员 Owner</label><input id="addDepartmentOwners" placeholder="多个成员用逗号分隔"></div>
      </div>
    </div>
    <div class="modal-actions"><button class="secondary" data-click="hideAddDepartmentModal">取消</button><button data-click="saveDepartmentProfile">保存</button></div>
  </div>
</div>
<div id="addDepartmentOwnerModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2>添加部门成员</h2><button class="secondary" data-click="hideAddDepartmentOwnerModal">关闭</button></div>
    <div class="modal-body"><div class="field"><label>Owner 邮箱/账号</label><input id="addDepartmentOwnerValue" placeholder="name@rock-chips.com"></div></div>
    <div class="modal-actions"><button class="secondary" data-click="hideAddDepartmentOwnerModal">取消</button><button data-click="saveDepartmentOwner">保存</button></div>
  </div>
</div>
<div id="trendStartModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2 id="trendStartModalTitle">设置统计日期范围</h2><button class="secondary" data-click="hideTrendStartModal">关闭</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>开始日期</label><input type="date" id="trendStartDateInput"></div>
        <div class="field"><label>结束日期</label><input type="date" id="trendEndDateInput"></div>
      </div>
    </div>
    <div class="modal-actions"><button class="secondary" data-click="clearTrendStartDate">清空</button><button data-click="saveTrendStartDate">保存并刷新</button></div>
  </div>
</div>
<div id="trendDetailModal" class="modal">
  <div class="modal-content" style="width:min(900px,100%)">
    <div class="modal-header"><h2 id="trendDetailTitle">提交明细</h2><button class="secondary" data-click="hideModal" data-a0="trendDetailModal">关闭</button></div>
    <div class="modal-body" id="trendDetailBody"><div class="muted">加载中…</div></div>
  </div>
</div>
<div id="routeCheckModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h3>📡 检查路由连通性</h3><button class="modal-close" data-click="hideModal" data-a0="routeCheckModal">&times;</button></div>
    <div class="modal-body" id="routeCheckBody"><div class="muted">正在探测 Gerrit 服务器可达性…</div></div>
  </div>
</div>
<script src="/static/js/shell/act-bridge.js?v=20260913-csp-bridge" defer></script>
<script src="/static/js/embedded-workspace.js?v=20260917-arrow-forward-v2"></script>
<script src="/static/js/embedded-ui/modal-controller.js?v=20260916-modal-controller"></script>
<script src="/gerrit-dashboard/page.js"></script>
</body>
</html>
