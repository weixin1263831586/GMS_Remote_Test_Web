<!doctype html>
<html lang="zh-CN" data-ui-type-root="data-table">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMS Update Monitor</title>
  <link rel="stylesheet" href="/static/css/theme.css?v=20261112-purple-surfaces">
  <link rel="stylesheet" href="/static/css/data-table-page.css?v=20261116-head32">
  <style>
    :root { color-scheme: dark; --bg:var(--dark-bg); --card:var(--card-bg); --head:var(--light-bg); --border:var(--border-color); --text:var(--text-primary); --muted:var(--text-secondary); --primary:var(--primary-color); --ok:var(--success-color); }
    /* 多列定制只在桌宽生效（>600px）：手机宽度让位公共单列布局，
       否则 390px 视口下筛选控件溢出（CI E2E）。 */
    @media (min-width: 601px) {
      .filters { grid-template-columns:minmax(260px,1fr) 170px 150px 100px; }
    }
    button.secondary { background:var(--lighter-bg); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .toast { position:fixed; left:50%; bottom:46px; transform:translateX(-50%); max-width:min(720px, calc(100vw - 32px)); background:var(--lighter-bg); color:#fff; border:1px solid var(--border); border-radius:6px; padding:9px 12px; box-shadow:0 8px 24px rgba(0,0,0,.35);  z-index:9999; display:none; }
    .toast.error { background:#3b1118; border-color:#7f1d1d; }
  </style>
    <link rel="stylesheet" href="/static/css/ui-sizing.css?v=20261119-ui-sizing-v2">
                        <link rel="stylesheet" href="/static/css/typography.css?v=20261119-type-audit-v5">
</head>
<body>
  <header>
    <h1>GMS Update Monitor</h1>
    <div id="summary" class="summary">加载中…</div>
    <div class="actions">
      <button data-click="startSync" data-a0="incremental">增量扫描</button>
      <button data-click="startSync" data-a0="full" class="secondary">全量扫描</button>
      <button data-click="loadAll" class="secondary">刷新</button>
    </div>
  </header>
  <main>
    <div class="filters">
      <input id="q" placeholder="全局搜索：变更/测试套件/GMS包/Mainline/认证要求">
      <select id="source_key">
        <option value="">全部来源</option>
        <option value="cts_downloads">CTS</option>
        <option value="vts_downloads">VTS</option>
        <option value="gts_downloads">GTS</option>
        <option value="gms_downloads">GMS Download</option>
        <option value="gms_requirements">GMS Requirements</option>
        <option value="gms_bulletins">GMS Bulletins</option>
      </select>
      <input id="type_filter" placeholder="类型/版本">
      <button data-click="runQuery" data-a0="true">查询</button>
    </div>
    <div class="tabs-row">
      <div class="tabs">
        <button data-tab="changes" class="active" data-click="setTab" data-a0="changes">变更</button>
        <button data-tab="requirements" data-click="setTab" data-a0="requirements">GMS要求</button>
        <button data-tab="packages" data-click="setTab" data-a0="packages">GMS包更新</button>
        <button data-tab="mainline" data-click="setTab" data-a0="mainline">Mainline包更新</button>
        <button data-tab="artifacts" data-click="setTab" data-a0="artifacts">测试套件更新</button>
      </div>
      <span id="section-badge" class="section-badge"></span>
    </div>
    <div class="table-wrap">
      <div id="tables-area" class="tables-area"><span class="muted">加载中…</span></div>
    </div>
    <div class="pager">
      <button data-click="page" data-a0="-1">上一页</button>
      <span id="pageinfo" class="muted"></span>
      <button data-click="page" data-a0="1">下一页</button>
    </div>
    <div id="toast" class="toast"></div>
  </main>
  <script src="/static/js/shell/act-bridge.js?v=20260913-csp-bridge" defer></script>
  <script src="/gms-update-monitor/page.js?v=20261117-safe-refs"></script>
</body>
</html>
