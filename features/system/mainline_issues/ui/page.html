<!doctype html>
<html lang="zh-CN" data-ui-type-root="data-table">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mainline Known Issues</title>
  <link rel="stylesheet" href="/static/css/theme.css?v=20261112-purple-surfaces">
  <link rel="stylesheet" href="/static/css/data-table-page.css?v=20261120-single-edge-template">
  <style>
    :root { color-scheme: dark; --border:var(--border-color); --muted:var(--text-secondary); --bg:var(--dark-bg); --text:var(--text-primary); --head:var(--light-bg); --card:var(--card-bg); --primary:var(--primary-color); }
    /* 多列定制只在桌宽生效（>600px）：手机宽度让位公共单列布局，
       否则 390px 视口下筛选控件溢出（CI E2E）。 */
    @media (min-width: 601px) {
      .filters { grid-template-columns: minmax(220px, 1fr) 120px 150px 120px 120px; }
      .filters.single-filter { grid-template-columns: minmax(300px, 1fr) 120px; } /* CVE/Critical_Patch 页签：搜索框占满水平方向 */
    }
    select { appearance:auto; }
  </style>
    <link rel="stylesheet" href="/static/css/ui-sizing.css?v=20261120-unified-page-edge-8">
                        <link rel="stylesheet" href="/static/css/typography.css?v=20261119-type-audit-v5">
</head>
<body>
  <header class="ui-page-edge">
    <h1>Mainline Known Issues</h1>
    <div id="summary" class="summary">加载中…</div>
  </header>
  <main class="ui-page-edge">
    <div class="filters">
      <input id="q" placeholder="全局搜索：豁免条目 / 安全补丁(CVE) / Critical_Patch">
      <select id="issue_type"><option value="">全部类型</option><option>CTS</option><option>MTS</option><option>GTS</option></select>
      <select id="product_section"><option value="">全部小节</option><option>Android</option><option>Android Go</option></select>
      <input id="exemption_id" placeholder="豁免ID">
      <button data-click="runQuery" data-a0="true">查询</button>
    </div>
    <div class="tabs-row">
      <div class="tabs">
        <button data-tab="exemptions" class="active" data-click="setTab" data-a0="exemptions">豁免条目</button>
        <button data-tab="patch" data-click="setTab" data-a0="patch">安全补丁 (CVE)</button>
        <button data-tab="critical" data-click="setTab" data-a0="critical">Critical_Patch</button>
      </div>
      <span id="section-badge" class="section-badge"></span>
    </div>
    <div class="table-wrap">
      <div id="tables-area" class="tables-area"><span class="muted">加载中…</span></div>
    </div>
    <div class="pager">
      <button data-click="page" data-a0="-1">上一页</button>
      <span id="pageinfo" class="muted"></span>
      <button data-click="page" data-a0="1">下一页</button>
    </div>
  </main>
  <script src="/static/js/shell/act-bridge.js?v=20260913-csp-bridge" defer></script>
  <script src="/mainline-known-issues/page.js?v=20261117-safe-refs"></script>
</body>
</html>
