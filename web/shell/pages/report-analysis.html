<div class="container page-content" id="page-report-analysis">
            {% include 'components/page-header.html' %}<span class="page-title-icon" aria-hidden="true">📈</span> 报告分析{% include 'components/page-header-end.html' %}

            <!-- 拖拽上传区域 -->
            <div class="analysis-upload-frame">
                <div id="report-upload-zone" class="report-upload-zone">
                    <input type="file" id="report-file-input" accept=".xml,.zip,.rar,.tar,.tar.gz" style="display: none;" />
                    <input type="file" id="report-folder-input" webkitdirectory directory style="display: none;" />
                    <div class="report-upload-content">
                        <div>📁</div>
                        <div class="analysis-upload-copy">
                            <div class="analysis-upload-title">拖拽测试报告到此处</div>
                            <div class="upload-instructions">
                                支持 .zip、.rar、.xml、.tar.gz 等文件格式<br><br>
                                1. 点击按钮"📤 上传报告"选择测试报告<br>
                                2. 直接拖拽测试报告上传<br>
                                3. 直接拖拽 Redmine 附件上传
                            </div>
                        </div>
                        <button class="btn-xs" data-click="_actClickById" data-a0="report-file-input">
                            <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#upload"></use></svg> 上传报告
                        </button>
                    </div>
                    <div class="report-upload-progress" id="report-upload-progress">
                        <div class="report-upload-progress-bar" id="report-progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 分析结果区域 -->
            <div id="report-analysis-result" style="display: none;">
                <div class="report-result-card">
                    <button class="btn-xs report-float-action" data-click="sendReportAnalysisEmail" title="将本报告分析结果作为 HTML 邮件发送"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#mail"></use></svg> 发送邮件</button>
                    <button class="btn-xs report-float-action" data-click="resetReportAnalysis">清除</button>

                    <div id="report-summary" class="report-summary-grid"></div>
                    <div id="report-details" class="report-details"></div>
                </div>

                <div id="report-failures" class="report-result-card" style="display: none;">
                    <div class="report-section-head">
                        <div id="report-failures-title">❌ 失败用例</div>
                    </div>
                    <div id="report-failure-list" class="report-failure-list"></div>
                </div>
            </div>
        </div>
