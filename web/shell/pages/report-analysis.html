<div class="container page-content page-ui-rework" id="page-report-analysis">
    {% include 'components/page-header.html' %}<span class="page-title-icon" aria-hidden="true">📈</span> 报告分析{% include 'components/page-header-end.html' %}

    <!-- Analysis workbench: same 84px compact intake and 29px controls as APK. -->
    <div class="analysis-upload-frame report-workbench-upload analysis-intake">
        <div id="report-upload-zone" class="report-upload-zone analysis-upload-surface upload-empty">
            <input type="file" id="report-file-input" accept=".xml,.zip,.rar,.tar,.tar.gz,.txt,.log" multiple style="display:none">
            <input type="file" id="report-folder-input" webkitdirectory directory style="display:none">
            <div class="report-upload-content analysis-upload-row">
                <span class="report-upload-mark analysis-upload-symbol" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#upload"></use></svg></span>
                <div class="analysis-upload-copy">
                    <div class="analysis-upload-title">拖拽测试报告到此处</div>
                    <div class="upload-instructions">支持报告 ZIP / XML 与 host_log 同时上传，也支持文件夹、Redmine 附件拖拽</div>
                </div>
                <button class="btn-xs" type="button" data-click="_actClickById" data-a0="report-file-input">
                    <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#upload"></use></svg> 上传报告
                </button>
            </div>
            <!-- Persistent status for slow uploads / server-side parsing. Toasts
                 are transient; this stays visible until the request settles. -->
            <div id="report-analysis-activity" class="report-analysis-activity" role="status" aria-live="polite" aria-atomic="true" hidden>
                <span class="report-analysis-spinner" aria-hidden="true"></span>
                <div class="report-analysis-activity-copy">
                    <div id="report-analysis-activity-title" class="report-analysis-activity-title">正在准备报告分析</div>
                    <div id="report-analysis-activity-detail" class="report-analysis-activity-detail">请保持页面打开</div>
                    <div id="report-analysis-activity-time" class="report-analysis-activity-time" aria-hidden="true">已等待 00:00</div>
                </div>
                <button type="button" class="btn-xs report-analysis-cancel" data-click="resetReportAnalysis" title="取消等待并清除当前分析（已提交服务器的处理可能继续）">取消等待</button>
            </div>
            <div class="report-upload-progress analysis-upload-progress" id="report-upload-progress">
                <div class="report-upload-progress-bar analysis-upload-progress-fill" id="report-progress-fill" style="width:0%"></div>
            </div>
        </div>
        <div id="report-active-file" class="report-active-file analysis-status-card" hidden>
            <div class="analysis-status-row">
                <div class="report-active-copy analysis-status-main">
                    <span class="report-active-icon analysis-upload-symbol" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#archive"></use></svg></span>
                    <div id="report-active-name" class="report-active-name analysis-status-name" title=""></div>
                    <div class="report-active-status analysis-status-text">解析完成</div>
                </div>
            </div>
            <div class="analysis-status-progress">
                <div class="report-active-progress analysis-status-track" aria-hidden="true"><span class="analysis-status-fill" style="width:100%"></span></div>
            </div>
        </div>
    </div>

    <div id="report-analysis-result" class="report-workbench-result" style="display:none">
        <section class="report-result-card report-overview">
            <!-- One compact row: stats, report metadata and icon-only actions. -->
            <div class="report-overview-line">
                <div id="report-summary" class="report-summary-grid"></div>
                <div class="report-overview-actions" role="group" aria-label="报告操作">
                    <button class="btn-xs" type="button" data-click="sendReportAnalysisEmail" aria-label="发送邮件" title="发送报告分析邮件"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#mail"></use></svg></button>
                    <button class="btn-xs" type="button" data-click="resetReportAnalysis" aria-label="清除" title="清除当前报告"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#close"></use></svg></button>
                </div>
            </div>
            <div id="report-details" class="report-details"></div>
        </section>
        <section id="report-failures" class="report-result-card report-failure-workspace" style="display:none">
            <div class="report-section-head report-failure-heading">
                <div id="report-failures-title">失败用例</div>
                <div id="report-failure-header-actions" class="report-failure-header-actions" role="group" aria-label="选中失败用例操作"></div>
            </div>
            <div class="report-failure-layout">
                <div id="report-failure-list" class="report-failure-list" aria-label="失败用例列表"></div>
                <section id="report-failure-detail" class="report-failure-detail" aria-label="失败用例详情" hidden>
                    <div id="report-failure-detail-content"></div>
                </section>
            </div>
        </section>
    </div>
</div>
