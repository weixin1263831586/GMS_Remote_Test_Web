<div class="container page-content page-ui-rework" id="page-security-audit">
            {% include 'components/page-header.html' %}<span class="page-title-icon" aria-hidden="true">🛡️</span> 安全审计{% include 'components/page-header-actions.html' %}
                <!-- 视图页签：同 users 页「用户列表 / Agent 接入」胶囊模板
                     （.users-view-tabs 通用分段按钮样式）。「历史邮件」为
                     owner 视图（本人邮件台账），管理员可切全量。 -->
                <div class="users-view-tabs" id="audit-view-tabs" role="tablist" aria-label="安全审计视图" style="display: none;">
                    <button id="audit-logs-tab" class="btn-xs active" type="button" role="tab" aria-selected="true" data-click="auditOutboxToggle" data-a0="false">审计日志</button>
                    <div id="audit-outbox-entry">
                        <button id="audit-outbox-tab" class="btn-xs" type="button" role="tab" aria-selected="false" data-click="auditOutboxToggle" data-a0="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#mail"></use></svg> 历史邮件</button>
                    </div>
                </div>
            {% include 'components/page-header-end.html' %}

            <!-- 审计日志主视图（原内容） -->
            <div id="audit-main-view">
            <div class="audit-stats page-stat-row">
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#shield"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-primary" id="audit-total-count">-</div>
                    <div class="page-stat-label">审计记录</div></span></div>
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#monitor"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-success" id="audit-web-count">-</div>
                    <div class="page-stat-label">Web访问</div></span></div>
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#terminal"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-warning" id="audit-cli-count">-</div>
                    <div class="page-stat-label">CLI操作</div></span></div>
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#warning"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-danger" id="audit-error-count">-</div>
                    <div class="page-stat-label">异常请求</div></span></div>
            </div>

            <div class="audit-filter-bar">
                <select id="audit-source-filter" class="combo-box" data-change="loadSecurityAudit" data-a0="true">
                    <option value="">全部来源</option>
                    <option value="web">Web</option>
                    <option value="cli">CLI</option>
                </select>
                <select id="audit-type-filter" class="combo-box" data-change="loadSecurityAudit" data-a0="true">
                    <option value="">全部类型</option>
                    <option value="page_view">页面访问</option>
                    <option value="api">接口操作</option>
                    <option value="page_visit">入口访问</option>
                </select>
                <input id="audit-search-input" class="entry-field" type="text" placeholder="搜索用户、IP、接口、页面" data-keydown="loadSecurityAudit" data-key="Enter" data-a0="true" />
                <button class="btn-xs" data-click="loadSecurityAudit" data-a0="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#refresh"></use></svg> 刷新</button>
                <button class="btn-xs" data-click="exportSecurityAudit"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#download"></use></svg> 导出</button>
            </div>

            <div class="audit-table-wrap list-table-wrap">
                <table class="list-table">
                    <thead>
                        <tr>
                            <th style="width: 145px;">时间</th>
                            <th style="width: 70px;">来源</th>
                            <th style="width: 70px;">状态</th>
                            <th style="width: 220px;">用户/IP</th>
                            <th>操作</th>
                            <th style="width: 80px;">耗时</th>
                        </tr>
                    </thead>
                    <tbody id="security-audit-table-body">
                        <tr>
                            <td colspan="6" class="table-placeholder">加载中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="audit-load-more-wrapper" class="table-load-more"></div>
            </div>
            </div>

            <!-- 历史邮件面板：邮件 outbox 台账（owner 视图；管理员可切全量）。
                 布局与审计日志同构：筛选栏（含管理员全量开关）+ 全宽块级表格。 -->
            <div id="audit-outbox-panel" style="display: none;">
                <div class="audit-filter-bar">
                    <select id="email-outbox-channel-filter" class="combo-box" data-change="loadAuditOutbox" data-a0="true">
                        <option value="">全部通道</option>
                        <option value="manual">手动发送</option>
                        <option value="automation">自动化通知</option>
                        <option value="ops">运维告警</option>
                        <option value="redmine_reminder">Redmine 提醒</option>
                    </select>
                    <select id="email-outbox-sent-filter" class="combo-box" data-change="loadAuditOutbox" data-a0="true">
                        <option value="">全部结果</option>
                        <option value="true">成功</option>
                        <option value="false">失败</option>
                    </select>
                    <input id="email-outbox-search-input" class="entry-field" type="text" placeholder="搜索收件人、主题" data-keydown="loadAuditOutbox" data-key="Enter" data-a0="true" />
                    <button class="btn-xs" data-click="loadAuditOutbox" data-a0="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#refresh"></use></svg> 刷新</button>
                    <label id="email-outbox-all-users-label" style="display: none;">
                        <input type="checkbox" id="email-outbox-all-users" data-change="loadAuditOutbox" data-a0="true" />
                        全部用户
                    </label>
                </div>
                <div class="audit-table-wrap list-table-wrap">
                    <table class="list-table">
                        <thead>
                            <tr>
                                <th style="width: 160px;">时间 (UTC)</th>
                                <th style="width: 165px;">通道</th>
                                <th style="width: 240px;">收件人</th>
                                <th>主题</th>
                                <th style="width: 80px;">结果</th>
                            </tr>
                        </thead>
                        <tbody id="email-outbox-table-body">
                            <tr>
                                <td colspan="5" class="table-placeholder">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                    <div id="email-outbox-load-more-wrapper" class="table-load-more"></div>
                </div>
            </div>
        </div>
