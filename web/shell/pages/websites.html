<div class="container page-content" id="page-websites">
            <div class="section-title">🌐 常用网址</div>

            <!-- 工具页面外框容器 - 固定高度支持滚动 -->
            <div class="tools-container" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; box-shadow: var(--shadow-sm); display: flex; flex: 1; min-height: 0; flex-direction: column; overflow: hidden;">

                <!-- 工具列表容器 - 可滚动区域 -->
                <div id="tools-scroll-container" style="flex: 1; overflow-y: auto; padding: 0; min-height: 0;">
                    <div id="tools-grid" style="padding: 4px 8px 8px 8px;">
                        <!-- 工具卡片由 JavaScript 动态生成 -->
                    </div>
                </div>

                <!-- 底部添加分类按钮 - 固定在容器底部 -->
                <div style="padding-top: 8px; border-top: 1px solid var(--border-color); margin-top: 8px;">
                    <button data-click="showAddCategoryModal" style="width: 100%; padding: 8px 8px; background: var(--success-color); color: white; border: none; border-radius: 5px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;"
                                >
                        添加分类
                    </button>
                </div>

            </div>
        </div>
