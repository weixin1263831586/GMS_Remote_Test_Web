<div class="container page-content" id="page-users">
            <div class="users-page-header">
                <div class="section-title" id="users-page-title">👥 用户管理</div>
                <div class="users-view-tabs" id="users-view-tabs" role="tablist" aria-label="用户管理视图" style="display: none;">
                    <button id="users-list-tab" class="btn-xs active" type="button" role="tab" aria-selected="true" data-click="agentAccessToggle" data-a0="false">用户列表</button>
                    <div id="agent-access-entry">
                        <button id="agent-access-tab" class="btn-xs" type="button" role="tab" aria-selected="false" data-click="agentAccessToggle" data-a0="true">🔑 Agent 接入</button>
                    </div>
                </div>
            </div>

            <div id="users-main-view">
                <!-- 用户统计卡片 -->
                <div class="users-stats">
                    <button class="user-stat-card" type="button" data-user-status-card="" data-click="setUsersStatusFilter" data-a0="">
                        <span class="user-stat-value total" id="total-users-count">-</span>
                        <span class="user-stat-label">全部用户</span>
                    </button>
                    <button class="user-stat-card" type="button" data-user-status-card="online" data-click="setUsersStatusFilter" data-a0="online">
                        <span class="user-stat-value online" id="active-users-count">-</span>
                        <span class="user-stat-label">空闲在线</span>
                    </button>
                    <button class="user-stat-card" type="button" data-user-status-card="testing" data-click="setUsersStatusFilter" data-a0="testing">
                        <span class="user-stat-value testing" id="testing-users-count">-</span>
                        <span class="user-stat-label">正在测试</span>
                    </button>
                </div>

                <!-- 用户列表 -->
                <div class="users-table-wrap">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th class="users-col-identity">用户标识</th>
                                <th class="users-col-ip">IP 地址</th>
                                <th class="users-col-source">来源</th>
                                <th>直连设备</th>
                                <th>占用设备</th>
                                <th class="users-col-status">状态</th>
                                <th class="users-col-time">连接时间</th>
                                <th class="users-col-time">最后活跃</th>
                                <th class="users-col-actions">操作</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr>
                                <td colspan="9" style="padding: 40px; text-align: center; color: var(--text-secondary);">
                                    加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Agent 接入：创建配对码、查看接入凭据。 -->
            <div id="agent-access-panel" style="display: none;">
                <div class="agent-access-intro">
                    <div>
                        <h2>Agent 接入</h2>
                        <p id="agent-access-summary">授权 Kimi、Codex 或 kkagent 在目标服务器上使用平台能力。</p>
                    </div>
                    <button id="agent-access-create-toggle" class="btn-xs btn-primary" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="agent-access-create-modal" data-click="agentAccessToggleCreate">＋ 创建配对码</button>
                </div>
                <div class="agent-access-stats" aria-label="Agent Token 统计">
                    <button class="agent-access-stat" type="button" data-agent-token-status-card="" data-click="agentAccessSetStatusFilter" data-a0="">
                        <strong id="agent-token-total-count">—</strong><span>接入凭据总数</span>
                    </button>
                    <button class="agent-access-stat" type="button" data-agent-token-status-card="active" data-click="agentAccessSetStatusFilter" data-a0="active">
                        <strong id="agent-token-active-count">—</strong><span>当前有效</span>
                    </button>
                    <button class="agent-access-stat" type="button" data-agent-token-status-card="inactive" data-click="agentAccessSetStatusFilter" data-a0="inactive">
                        <strong id="agent-token-inactive-count">—</strong><span>已失效</span>
                    </button>
                </div>

                <section class="agent-access-list-section" aria-label="已接入的 Agent">
                    <div class="agent-access-toolbar">
                        <div class="agent-access-list-label">
                            <h3>已接入的 Agent</h3>
                            <span id="agent-access-list-count">仅显示接入凭据信息，不展示原始 Token。</span>
                        </div>
                        <div class="agent-access-list-actions">
                            <input id="agent-access-search" class="combo-box" type="search" placeholder="搜索 Agent、Token ID 或设备" aria-label="搜索 Agent Token" data-input="agentAccessFilterTokens">
                            <select id="agent-access-status-filter" class="combo-box" aria-label="按状态筛选 Agent Token" data-change="agentAccessFilterTokens">
                                <option value="">全部状态</option><option value="active">有效</option>
                                <option value="inactive">已失效</option><option value="expired">已过期</option>
                                <option value="revoked">已吊销</option>
                            </select>
                            <button id="agent-access-refresh" class="btn-xs" type="button" data-click="agentAccessReload" data-r0="el">↻ 刷新</button>
                        </div>
                    </div>
                    <div class="agent-access-table-wrap">
                    <table class="agent-access-table">
                        <thead>
                            <tr>
                                <th class="agent-token-col-name">Agent</th>
                                <th class="agent-token-col-status">状态</th>
                                <th class="agent-token-col-scopes">授权范围</th>
                                <th class="agent-token-col-target">访问范围</th>
                                <th class="agent-token-col-owner">所有者</th>
                                <th class="agent-token-col-validity">有效期 / 最近使用</th>
                                <th class="agent-token-col-action">操作</th>
                            </tr>
                        </thead>
                        <tbody id="agent-access-tokens">
                            <tr><td colspan="7" class="agent-access-empty">加载中...</td></tr>
                        </tbody>
                    </table>
                    </div>
                </section>
            </div>
        </div>
