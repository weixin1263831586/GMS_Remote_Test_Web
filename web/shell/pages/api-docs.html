<div class="container page-content page-ui-rework" id="page-api-docs">
            {% include 'components/page-header.html' %}<span class="page-title-icon" aria-hidden="true">📡</span> 系统接口{% include 'components/page-header-end.html' %}

            <!-- API统计卡片 -->
            <div class="page-stat-row">
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#network"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-primary" id="total-apis-count">-</div>
                    <div class="page-stat-label">API总数</div></span></div>
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#check"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-success" id="get-apis-count">-</div>
                    <div class="page-stat-label">GET接口</div></span></div>
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#play"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-warning" id="post-apis-count">-</div>
                    <div class="page-stat-label">POST接口</div></span></div>
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#search"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-info" id="filtered-apis-count">-</div>
                    <div class="page-stat-label">筛选结果</div></span></div>
                <div class="page-stat-card workbench-stat"><span class="workbench-stat-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#book"></use></svg></span><span class="workbench-stat-copy">
                    <div class="page-stat-value tone-skill" id="skills-count">-</div>
                    <div class="page-stat-label">Skill总数</div></span></div>
            </div>

            <!-- 搜索栏 -->
            <div class="api-toolbar">
                <input type="text" id="api-search-input" placeholder="🔍 搜索API路径或说明..." data-input="debounceFilterApiDocs">
            </div>

            <div class="api-toolbar">
                <div class="api-filter-row">
                    <button class="filter-btn active" data-category="all" data-click="filterByCategory" data-a0="all">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#folder"></use></svg> 全部分类
                    </button>
                    <button class="filter-btn" data-category="test" data-click="filterByCategory" data-a0="test">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#test"></use></svg> 测试管理
                    </button>
                    <button class="filter-btn" data-category="desktop" data-click="filterByCategory" data-a0="desktop">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#monitor"></use></svg> 主机桌面
                    </button>
                    <button class="filter-btn" data-category="terminal" data-click="filterByCategory" data-a0="terminal">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#terminal"></use></svg> 主机终端
                    </button>
                    <button class="filter-btn" data-category="device" data-click="filterByCategory" data-a0="device">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#device"></use></svg> 设备管理
                    </button>
                    <button class="filter-btn" data-category="users" data-click="filterByCategory" data-a0="users">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#users"></use></svg> 用户管理
                    </button>
                    <button class="filter-btn" data-category="report" data-click="filterByCategory" data-a0="report">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#chart"></use></svg> 报告管理
                    </button>
                    <button class="filter-btn" data-category="burn" data-click="filterByCategory" data-a0="burn">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#bolt"></use></svg> 固件烧写
                    </button>
                    <button class="filter-btn" data-category="file" data-click="filterByCategory" data-a0="file">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#folder"></use></svg> 文件管理
                    </button>
                    <button class="filter-btn" data-category="config" data-click="filterByCategory" data-a0="config">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#settings"></use></svg> 配置管理
                    </button>
                    <button class="filter-btn" data-category="system" data-click="filterByCategory" data-a0="system">
                        💚 系统管理
                    </button>
                    <button class="filter-btn" data-category="ssh" data-click="filterByCategory" data-a0="ssh">
                        🔑 SSH管理
                    </button>
                    <button class="filter-btn" data-category="vpn" data-click="filterByCategory" data-a0="vpn">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#lock"></use></svg> VPN管理
                    </button>
                    <button class="filter-btn" data-category="usbip" data-click="filterByCategory" data-a0="usbip">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#network"></use></svg> USB/IP
                    </button>
                    <div class="api-filter-spacer"></div>
                    <button class="filter-btn tone-primary" data-click="showUsageExamples">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#book"></use></svg> 使用实例
                    </button>
                    <button class="filter-btn tone-success" data-click="copySkillInstallCommand" title="复制可在任意 Linux 主机执行的一键安装或更新命令">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#info"></use></svg> 安装/更新命令
                    </button>
                    <button class="filter-btn" data-click="downloadSkillsZip" title="仅下载 ZIP，用于离线部署或备份">
                        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#package"></use></svg> 离线包
                    </button>
                </div>
            </div>

            <!-- API列表 -->
            <div class="list-table-wrap">
                <table class="list-table">
                    <thead>
                        <tr>
                            <th style="width: 25%;">API接口</th>
                            <th style="width: 20%;">接口说明</th>
                            <th style="width: 20%;">skill方法(点击自动复制)</th>
                            <th style="width: 35%;">使用方法(点击自动复制)</th>
                        </tr>
                    </thead>
                    <tbody id="api-docs-table-body">
                        <tr>
                            <td colspan="4" class="table-placeholder">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
