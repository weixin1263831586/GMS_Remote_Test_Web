<div class="container page-content" id="page-notes">
            {% include 'components/page-header.html' %}<span class="page-title-icon" aria-hidden="true">📚</span> 个人知识库{% include 'components/page-header-actions.html' %}
                <button type="button" class="btn-xs page-title-action" data-click="ekOpen" title="外部知识库（Android Internals Wiki）revision 状态与管理"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#link"></use></svg> 外部知识库</button>
            {% include 'components/page-header-end.html' %}
            <div class="kb-layout split-layout">
                <div class="pane">
                    <div class="pane-bar spread">
                        <span class="pane-title">知识库</span>
                        <button class="btn-xs pane-icon-btn" data-click="kbNewSpace">＋</button>
                    </div>
                    <div id="kb-space-list"></div>
                    <div class="pane-label">目录</div>
                    <div id="kb-tree" class="pane-scroll"></div>
                    <div class="pane-foot">
                        <button class="btn-xs" data-click="kbNewFolder">新目录</button>
                        <button class="btn-xs btn-primary" data-click="kbNewDoc">新文档</button>
                    </div>
                </div>
                <div class="pane">
                    <div class="pane-bar">
                        <input type="text" id="kb-search-input" class="combo-box pane-grow" placeholder="全库搜索文档、标签、附件..." data-keydown="kbSearch" data-key="Enter" />
                        <button class="btn-xs" data-click="kbSearch">搜索</button>
                    </div>
                    <div id="kb-doc-list"><div class="suite-empty">加载中...</div></div>
                    <div class="pane-foot single">
                        <button class="btn-xs" data-click="kbOpenUpload">上传文件入库</button>
                    </div>
                </div>
                <div class="pane">
                    <div id="kb-editor">
                        <div class="kb-editor-toolbar pane-bar">
                            <input id="kb-doc-title" class="combo-box pane-grow" placeholder="文档标题" />
                            <button class="btn-xs" data-click="kbToggleFavorite">收藏</button>
                            <button class="btn-xs" data-click="kbShowHistory">历史</button>
                            <button class="btn-xs btn-primary" data-click="kbSaveDoc">保存</button>
                            <button class="btn-xs btn-danger-quiet" data-click="kbDeleteCurrent">删除</button>
                        </div>
                        <div class="kb-editor-tags pane-bar">
                            <input id="kb-doc-tags" class="combo-box pane-grow" placeholder="标签，逗号分隔" />
                            <button class="btn-xs" data-click="kbAsk">问答</button>
                        </div>
                        <textarea id="kb-doc-content" placeholder="记录知识、排查过程、配置、命令、结论..."></textarea>
                    </div>
                    <div id="kb-side-info">选择或新建一篇文档。</div>
                </div>
            </div>
        </div>
