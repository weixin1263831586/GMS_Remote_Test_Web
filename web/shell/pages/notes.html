<div class="container page-content page-ui-rework" id="page-notes">
            {% include 'components/page-header.html' %}<span class="page-title-icon" aria-hidden="true">📚</span> 个人知识库{% include 'components/page-header-actions.html' %}
            <button type="button" class="btn-xs" data-kb-view="personal" aria-pressed="true">个人知识库</button>
            <button type="button" class="btn-xs" data-kb-view="external" aria-pressed="false">外部知识源</button>
            {% include 'components/page-header-end.html' %}
            <div class="kb-layout split-layout">
                <div class="pane">
                    <div class="pane-bar spread">
                        <span class="pane-title">知识库</span>
                        <button class="btn-xs pane-icon-btn" data-click="kbNewSpace">＋</button>
                    </div>
                    <div id="kb-space-list"></div>
                    <div class="pane-label">目录</div>
                    <div id="kb-tree" class="pane-scroll"></div>
                    <div class="pane-foot">
                        <button class="btn-xs" data-click="kbNewFolder">新目录</button>
                        <button class="btn-xs btn-primary" data-click="kbNewDoc">新文档</button>
                    </div>
                </div>
                <div class="pane">
                    <div class="pane-bar">
                        <input type="text" id="kb-search-input" class="combo-box pane-grow" placeholder="全库搜索文档、标签、附件..." data-keydown="kbSearch" data-key="Enter" />
                        <button class="btn-xs" data-click="kbSearch">搜索</button>
                    </div>
                    <div id="kb-doc-list"><div class="suite-empty">加载中...</div></div>
                    <div class="pane-foot single">
                        <button class="btn-xs" data-click="kbOpenUpload">上传文件入库</button>
                    </div>
                </div>
                <div class="pane">
                    <div id="kb-editor">
                        <div class="kb-editor-toolbar pane-bar">
                            <input id="kb-doc-title" class="combo-box pane-grow" placeholder="文档标题" />
                            <button class="btn-xs" data-click="kbToggleFavorite">收藏</button>
                            <button class="btn-xs" data-click="kbShowHistory">历史</button>
                            <button class="btn-xs btn-primary" data-click="kbSaveDoc">保存</button>
                            <button class="btn-xs btn-danger-quiet" data-click="kbDeleteCurrent">删除</button>
                        </div>
                        <div class="kb-editor-tags pane-bar">
                            <input id="kb-doc-tags" class="combo-box pane-grow" placeholder="标签，逗号分隔" />
                            <button class="btn-xs" data-click="kbAsk">问答</button>
                        </div>
                        <textarea id="kb-doc-content" placeholder="记录知识、排查过程、配置、命令、结论..."></textarea>
                    </div>
                    <div id="kb-side-info">选择或新建一篇文档。</div>
                </div>
            </div>
            <section class="pane" data-kb-external hidden>
                <div class="pane-bar spread"><span class="pane-title">外部知识源</span><button type="button" class="btn-xs" data-kb-refresh>刷新</button></div>
                <div class="pane-label" data-kb-status role="status"></div>
                <div class="pane-scroll" data-kb-sources></div>
                <form class="pane-bar" data-kb-source-form>
                    <input type="text" name="name" class="combo-box" placeholder="知识源名称" required maxlength="160" />
                    <input type="url" name="url" class="combo-box pane-grow" placeholder="HTTPS 网址" required maxlength="2048" />
                    <select name="kind" class="combo-box" aria-label="来源类型"><option value="cdd">Android CDD</option><option value="document">公开技术文档</option></select>
                    <input name="android_version" type="number" min="1" max="100" class="combo-box" placeholder="Android 版本" aria-label="适用 Android 版本" />
                    <input name="license" class="combo-box" placeholder="内容使用许可" required maxlength="240" />
                    <label><input name="enabled" type="checkbox" checked /> 启用</label>
                    <button type="submit" class="btn-xs btn-primary">保存</button><button type="button" class="btn-xs" data-kb-reset>取消编辑</button>
                </form>
                <div class="pane-bar"><span>Google Partner · GMS Certification Requirements</span><button type="button" class="btn-xs" data-kb-partner-grant>查询授权状态</button><a href="/gms-update-center" class="btn-xs">GMS 更新中心</a></div>
                <div class="pane-label">公开网页使用独立索引；Google Partner 政策复用 GMS 更新中心已授权的扫描结果。仅对当前授权账号启用。</div>
            </section>
        </div>
