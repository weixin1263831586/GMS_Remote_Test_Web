<div class="container page-content page-ui-rework" id="page-notes">
            {% include 'components/page-header.html' %}<span class="page-title-icon" aria-hidden="true">📚</span> 个人知识库{% include 'components/page-header-actions.html' %}
                <div class="users-view-tabs ui-segmented" role="tablist" aria-label="知识库视图">
                    <button class="btn-xs active" type="button" role="tab" aria-selected="true" data-kb-view="personal">个人知识库</button>
                    <button class="btn-xs" type="button" role="tab" aria-selected="false" data-kb-view="external">外部知识源</button>
                </div>
            {% include 'components/page-header-end.html' %}
            <div class="kb-layout ui-workspace-grid">
                <div class="ui-workspace-panel">
                    <div class="pane-bar spread ui-workspace-toolbar ui-workspace-heading ui-workspace-divider">
                        <span class="pane-title">知识库</span>
                        <button class="btn-xs pane-icon-btn ui-workspace-control" data-click="kbNewSpace">＋</button>
                    </div>
                    <div id="kb-space-list"></div>
                    <div class="pane-label">目录</div>
                    <div id="kb-tree" class="ui-workspace-scroll"></div>
                    <div class="pane-foot">
                        <button class="btn-xs" data-click="kbNewFolder">新目录</button>
                        <button class="btn-xs btn-primary" data-click="kbNewDoc">新文档</button>
                    </div>
                </div>
                <div class="ui-workspace-panel">
                    <div class="pane-bar ui-workspace-toolbar ui-workspace-heading ui-workspace-divider">
                        <input type="text" id="kb-search-input" class="combo-box pane-grow ui-workspace-control" placeholder="全库搜索文档、标签、附件..." data-keydown="kbSearch" data-key="Enter" />
                        <button class="btn-xs ui-workspace-control" data-busy-size="short" data-click="kbSearch">搜索</button>
                    </div>
                    <div id="kb-doc-list"><div class="suite-empty">加载中...</div></div>
                    <div class="pane-foot single">
                        <button class="btn-xs" data-click="kbOpenUpload">上传文件入库</button>
                    </div>
                </div>
                <div class="ui-workspace-panel">
                    <div id="kb-editor">
                        <div class="kb-editor-toolbar pane-bar ui-workspace-toolbar ui-workspace-heading ui-workspace-divider">
                            <input id="kb-doc-title" class="combo-box pane-grow ui-workspace-control" placeholder="文档标题" />
                            <button class="btn-xs ui-workspace-control" data-click="kbToggleFavorite">收藏</button>
                            <button class="btn-xs ui-workspace-control" data-click="kbShowHistory">历史</button>
                            <button class="btn-xs btn-primary ui-workspace-control" data-click="kbSaveDoc">保存</button>
                            <button class="btn-xs btn-danger-quiet ui-workspace-control" data-click="kbDeleteCurrent">删除</button>
                        </div>
                        <div class="kb-editor-tags pane-bar ui-workspace-toolbar ui-workspace-heading ui-workspace-divider">
                            <input id="kb-doc-tags" class="combo-box pane-grow ui-workspace-control" placeholder="标签，逗号分隔" />
                            <button class="btn-xs ui-workspace-control" data-click="kbAsk">问答</button>
                        </div>
                        <textarea id="kb-doc-content" placeholder="记录知识、排查过程、配置、命令、结论..."></textarea>
                    </div>
                    <div id="kb-side-info">选择或新建一篇文档。</div>
                </div>
            </div>
            <section class="ui-workspace-stack" data-kb-external hidden>
                <div class="ui-workspace-panel ui-workspace-toolbar-panel">
                    <form class="ui-workspace-toolbar ui-workspace-toolbar--filter" data-kb-source-form>
                        <input type="text" name="name" class="combo-box ui-workspace-control" placeholder="知识源名称（选填，留空自动获取）" aria-label="知识源名称（选填）" maxlength="160" />
                        <input type="url" name="url" class="combo-box pane-grow ui-workspace-control" placeholder="请输入外部知识源 HTTPS 网址" aria-label="知识源网址" required maxlength="2048" />
                        <button type="submit" class="btn-xs btn-primary ui-workspace-control" data-kb-submit data-busy-size="short">添加</button>
                        <button type="button" class="btn-xs ui-workspace-control" data-kb-reset hidden style="display: none;">取消编辑</button>
                        <button type="button" class="btn-xs ui-workspace-control" data-kb-refresh data-busy-size="short">刷新</button>
                    </form>
                </div>
                <div class="ui-workspace-panel ui-workspace-content ui-workspace-panel--scroll" data-kb-sources></div>
            </section>
        </div>
