<div class="container page-content" id="page-agent">
            {% include 'components/page-header.html' %}💬 对话Agent{% include 'components/page-header-actions.html' %}
                <button class="btn-xs" data-click="newAgentSession">新会话</button>
                <button class="btn-xs" data-click="cancelAgentSession">取消Agent</button>
            {% include 'components/page-header-end.html' %}

            <div class="split-layout agent-layout">
                <div class="pane">
                    <div id="agent-chat-messages">
                        <div class="agent-chat-empty">输入测试需求，例如：跑 CtsWifiTestCases，找一台空闲设备，失败 retry 2 次，还失败就报告分析</div>
                    </div>
                    <div class="agent-composer">
                        <textarea id="agent-input" class="entry-field" rows="4" placeholder="描述你的目标：设备与固件、测试、报告、构建、工单或知识查询&#10;Shift+Enter 换行，Enter 发送"></textarea>
                        <div class="agent-send-actions">
                            <button class="btn-primary" data-click="sendAgentMessage" data-a0="false">发送</button>
                            <button class="btn-primary is-execute" data-click="sendAgentMessage" data-a0="true">执行</button>
                        </div>
                    </div>
                </div>
                <div class="pane">
                    <div class="agent-run-header">
                        <div class="agent-run-title-row">
                            <div class="agent-run-title">执行步骤</div>
                            <span id="agent-status">idle</span>
                        </div>
                        <span id="agent-engine-status">对话引擎：待连接</span>
                        <div class="agent-model-line">
                            <span id="agent-model-status" data-state="loading" title="报告与知识分析模型；对话引擎状态单独显示。">分析模型：读取配置…</span>
                            <button id="agent-model-check" class="btn-xxs" type="button" data-click="loadAgentModelStatus" data-a0="true">检测</button>
                        </div>
                    </div>
                    <div id="agent-steps">
                        <div class="suite-empty">等待任务</div>
                    </div>
                </div>
            </div>

            <!-- Agent 接入管理已迁移至用户管理页面（右上角入口） -->
        </div>
