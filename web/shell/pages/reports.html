<div class="container page-content" id="page-reports">
            {% include 'components/page-header.html' %}📊 报告管理{% include 'components/page-header-actions.html' %}
                <label class="reports-host-filter">主机
                    <select id="reports-worker-filter" class="header-host-select" data-change="switchReportsWorker"><option value="">全部 Worker</option></select>
                </label>
                <label>
                    <input type="checkbox" id="filter-user-checkbox" data-change="toggleUserReports">
                    查看本用户报告
                </label>
            {% include 'components/page-header-end.html' %}

            <!-- 报告列表 -->
            <div class="list-table-wrap">
                <table class="list-table">
                    <thead>
                        <tr>
                            <th style="width: 150px;">客户端</th>
                            <th style="width: 80px;">测试类型</th>
                            <th style="width: 140px;">测试套件</th>
                            <th style="width: 160px;">测试主机</th>
                            <th style="width: 240px;">报告名称</th>
                            <th style="width: 100px;">通过</th>
                            <th style="width: 100px;">失败</th>
                            <th style="width: 100px;">总计</th>
                            <th style="width: 100px;">通过率</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="reports-table-body" aria-live="polite" aria-busy="true">
                        <tr>
                            <td colspan="10" class="table-placeholder">加载中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="reports-load-more-wrapper" class="table-load-more"></div>
            </div>
        </div>
