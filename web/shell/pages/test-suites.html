<div class="container page-content" id="page-test-suites">
            {% include 'components/page-header.html' %}📚 测试套件{% include 'components/page-header-actions.html' %}
                <label data-multi-host-control>主机
                    <select id="suite-worker-select" class="header-host-select" data-change="switchSuiteWorker" disabled><option value="">正在加载主机...</option></select>
                </label>
            {% include 'components/page-header-end.html' %}

            <!-- 下载和解压区域 -->
            <div class="suite-download-section">
                <div class="suite-download-row">
                    <div>
                        <input type="text" id="suite-download-url" class="combo-box" placeholder="测试套件下载地址，如：https://dl.google.com/android/cts/android-cts-14_r1-linux_x86-arm.zip" />
                    </div>
                    <button id="btn-download-suite" class="btn-primary" data-click="downloadTestSuite">
                        ⬇️ 下载套件
                    </button>
                    <button id="btn-extract-suite" class="btn-primary" data-click="extractTestSuite">
                        📦 解压套件
                    </button>
                </div>
                <!-- 下载进度 -->
                <div id="suite-download-progress" style="display: none;">
                    <div class="suite-progress-row">
                        <span id="suite-progress-status" class="suite-progress-status">正在下载...</span>
                        <div class="suite-progress-track">
                            <div id="suite-progress-bar"></div>
                        </div>
                        <span id="suite-progress-percent" class="suite-progress-percent">0%</span>
                    </div>
                </div>
            </div>

            <div class="suite-browser-layout">
                <div class="suite-browser-sidebar">
                    <div class="suite-browser-toolbar">
                        <button class="btn-xs" data-click="refreshTestSuiteBrowser">🔄 刷新</button>
                        <span id="suite-browser-count" class="suite-browser-count">0 个套件</span>
                    </div>
                    <input type="text" id="suite-browser-filter" class="suite-browser-filter" placeholder="筛选套件..."
                           data-input="filterTestSuiteBrowserList" />
                    <div id="suite-browser-list" class="suite-browser-list">
                        <div class="suite-empty">正在加载...</div>
                    </div>
                </div>

                <div class="suite-browser-main">
                    <div class="suite-browser-header">
                        <div>
                            <div id="suite-browser-title" class="suite-browser-title">请选择测试套件</div>
                            <div id="suite-browser-path" class="suite-browser-path"></div>
                        </div>
                        <div class="suite-browser-actions">
                            <button id="btn-copy-test-report" class="btn-xs" data-click="openReportCopyModal" title="在同一主机或不同主机的测试套件之间复制 Tradefed results 报告">
                                🔁 拷贝报告
                            </button>
                            <button id="btn-test-results" class="btn-xs" data-click="openTestResultsModal" title="执行 tradefed list results 查看该套件的测试结果">
                                📋 测试结果列表
                            </button>
                            <button id="btn-add-local-suite" class="btn-xs" data-click="showAddLocalSuiteDialog">
                                ➕ 添加本地路径
                            </button>
                        </div>
                    </div>
                    <div id="suite-browser-breadcrumb" class="suite-browser-breadcrumb"></div>
                    <div class="suite-search-bar">
                        <input type="text" id="suite-file-search" class="suite-file-search"
                               placeholder="搜索文件/目录，例如 CtsVirtualDevicesCameraTestCases 或 2026.06.26_20.54.21"
                               data-keydown="handleSuiteFileSearchKeydown" data-r0="event" autocomplete="off" />
                        <button class="btn-xs" data-click="searchSuiteFiles">搜索</button>
                        <button class="btn-xs" data-click="clearSuiteFileSearch">清除</button>
                    </div>
                    <div id="suite-search-results" class="suite-search-results"></div>
                    <div id="suite-file-list" class="suite-file-list">
                        <div class="suite-empty">从左侧选择一个测试套件</div>
                    </div>
                </div>
            </div>
        </div>
