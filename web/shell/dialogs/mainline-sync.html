<div id="mainline-sync-modal" class="modal">
        <div class="modal-content modal-s tech-dialog tech-dialog--mainline-sync">
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#refresh"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">选择扫描方式</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="ut_closeMainlineSyncModal">&times;</button>
            </div>
            <div class="modal-body tech-mainline-strategy">
                <p class="tech-workflow-lede">选择实际扫描范围。两种操作均沿用平台已有同步逻辑。</p>
                <div class="tech-mainline-choice-grid" role="group" aria-label="扫描方式">
                    <section class="tech-mainline-option tech-mainline-option--incremental">
                        <h3 class="tech-workflow-section-title"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/ui.svg#refresh"></use></svg> 增量扫描</h3>
                        <p>只检查尚未记录的新页面，保留已有扫描结果。</p>
                        <button type="button" class="btn-xxs btn-primary" data-click="ut_confirmMainlineKnownIssuesSync" data-a0="incremental">执行增量扫描</button>
                    </section>
                    <section class="tech-mainline-option tech-mainline-option--full">
                        <h3 class="tech-workflow-section-title"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/ui.svg#search"></use></svg> 全量扫描</h3>
                        <p>重新解析导航栏中的所有页面并刷新数据库。</p>
                        <button type="button" class="btn-xxs" data-click="ut_confirmMainlineKnownIssuesSync" data-a0="full">执行全量扫描</button>
                    </section>
                </div>
                <div class="tech-workflow-operation-note">全量扫描通常更耗时，可按同步目标选择。</div>
                <div class="modal-buttons tech-dialog-actions">
                    <button type="button" class="btn-xxs" data-click="ut_closeMainlineSyncModal">取消</button>
                </div>
            </div>
        </div>
    </div>
