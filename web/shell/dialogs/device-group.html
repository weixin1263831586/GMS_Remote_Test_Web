<div id="device-group-modal" class="modal" style="display: none;">
        <div class="modal-content modal-m tech-dialog tech-dialog--device-group"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#grid"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title" id="device-group-modal-title">新建分组</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="_actCloseModal" data-a0="device-group-modal">&times;</button>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body">
<p class="tech-intro">为设备命名分组，并选择本组包含的成员设备。</p>
                <section class="tech-form-section tech-form-section--device-group" aria-label="分组与成员"><h3 class="tech-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#users"></use></svg>分组与成员</h3><div class="modal-form-row tech-structured-row tech-field-card">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#users"></use></svg></span>
                    <label for="device-group-name">分组名称:</label>
                    <input type="hidden" id="device-group-edit-id"/>
                    <input type="text" id="device-group-name" class="host-input" placeholder="如：产线A / Android17回归" autocomplete="off"/>
                </div></section>
                <div class="modal-form-row tech-structured-row" style="align-items:flex-start;">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#device"></use></svg></span>
                    <label>成员设备:</label>
                    <div id="device-group-picklist" class="group-picklist" style="flex:1; max-height:240px; overflow-y:auto;"></div>
                </div>
                <div class="modal-info-text" style="margin-top:8px;">
                    💡 离线设备也可勾选保留在组内，重新上线后自动归位
                </div>

            </div>

<div class="modal-buttons tech-dialog-actions"><span class="tech-footer-decoration" aria-hidden="true"></span>
                    <button class="btn-xxs" data-click="_actCloseModal" data-a0="device-group-modal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitDeviceGroup">保存</button>
                </div>
</div>
    </div>
