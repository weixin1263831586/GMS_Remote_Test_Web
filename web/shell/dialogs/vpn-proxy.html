<div id="vpn-proxy-modal" class="modal" style="display:none;">
    <div class="modal-content tech-dialog tech-dialog--vpn-proxy" data-modal-initial-focus>
        <svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span>
        <span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
        <div class="modal-header tech-dialog-header">
            <div class="tech-title-group">
                <span class="tech-title-glyph" aria-hidden="true"><svg><use href="/static/icons/ui.svg#globe"></use></svg></span>
                <span class="tech-title-divider" aria-hidden="true"></span>
                <span class="modal-title">vpn-proxy 代理管理</span>
            </div>
            <span class="tech-header-ticks" aria-hidden="true"></span>
            <button type="button" id="vpn-proxy-close" class="modal-close" aria-label="关闭" data-click="closeVpnProxyPanel">&times;</button>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg>
        </div>
        <div class="modal-body">
            <div id="vpn-proxy-error" role="status" aria-live="polite"></div>
            <section class="vpn-proxy-panel-section" aria-label="服务运行状态">
                <div class="vpn-proxy-panel-heading">
                    <strong>代理服务</strong>
                    <div class="vpn-proxy-actions">
                        <button type="button" class="btn-xxs" data-click="refreshVpnProxyPanel">刷新状态</button>
                        <button type="button" class="btn-xxs btn-primary" id="vpn-proxy-start" disabled data-click="startVpnProxyService">启动代理</button>
                        <button type="button" class="btn-xxs" id="vpn-proxy-stop" disabled data-click="stopVpnProxyService">停止代理</button>
                    </div>
                </div>
                <div class="vpn-proxy-status-grid">
                    <div class="vpn-proxy-stat"><span>代理</span><strong id="vpn-proxy-status">检测中…</strong></div>
                    <div class="vpn-proxy-stat"><span>防火墙</span><strong id="vpn-proxy-firewall">检测中…</strong></div>
                    <div class="vpn-proxy-stat"><span>统计服务</span><strong id="vpn-proxy-stats">检测中…</strong></div>
                    <div class="vpn-proxy-stat"><span>客户端安装服务</span><strong id="vpn-proxy-installer">检测中…</strong></div>
                </div>
                <p id="vpn-proxy-endpoint" class="vpn-proxy-hint"></p>
                <p class="vpn-proxy-hint">启停需要管理员二次验证和服务端限定 systemctl sudo 权限；停止代理不会关闭防火墙保护。</p>
            </section>
            <section class="vpn-proxy-panel-section" aria-label="接入客户端">
                <div class="vpn-proxy-panel-heading"><strong>当前接入客户端</strong><span class="vpn-proxy-hint" id="vpn-proxy-connected-note">等待统计服务…</span></div>
                <div class="vpn-proxy-table-wrap"><table><thead><tr><th>客户端 IP</th><th>TCP 连接数</th><th>匹配网段</th><th>访问状态</th><th>操作</th></tr></thead><tbody id="vpn-proxy-connected"><tr><td colspan="5">检测中…</td></tr></tbody></table></div>
                <div class="vpn-proxy-panel-heading"><strong>最近活跃客户端</strong><span class="vpn-proxy-hint" id="vpn-proxy-recent-note">默认统计最近 300 秒</span></div>
                <div class="vpn-proxy-table-wrap"><table><thead><tr><th>客户端</th><th>请求数</th><th>流量</th><th>错误</th><th>最后活跃</th></tr></thead><tbody id="vpn-proxy-recent"><tr><td colspan="5">检测中…</td></tr></tbody></table></div>
                <p id="vpn-proxy-allowlist" class="vpn-proxy-hint"></p>
            </section>
            <section class="vpn-proxy-panel-section vpn-proxy-install-section" aria-label="新客户端接入">
                <div class="vpn-proxy-panel-heading"><strong>新客户端部署</strong><span class="vpn-proxy-hint">复制完整安装命令到目标设备运行</span></div>
                <div class="vpn-proxy-install-list">
                    <div class="vpn-proxy-install-row">
                        <span class="vpn-proxy-install-glyph" aria-hidden="true">🐧</span>
                        <label for="vpn-proxy-linux-command">Ubuntu</label>
                        <input type="text" id="vpn-proxy-linux-command" readonly placeholder="安装服务不可用" title="单行完整部署命令" />
                        <button type="button" class="btn-xxs tech-row-action" data-click="copyVpnProxyLinux">复制</button>
                    </div>
                    <div class="vpn-proxy-install-row">
                        <span class="vpn-proxy-install-glyph" aria-hidden="true"><svg class="tech-brand-icon" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><path d="M3 6.5 14.1 5v10H3zM16 4.7 29 3v12H16zM3 17h11.1v10L3 25.5zM16 17h13v12l-13-1.7z"/></svg></span>
                        <label for="vpn-proxy-windows-command">Windows</label>
                        <input type="text" id="vpn-proxy-windows-command" readonly placeholder="安装服务不可用" title="单行完整部署命令" />
                        <button type="button" class="btn-xxs tech-row-action" data-click="copyVpnProxyWindows">复制</button>
                    </div>
                </div>
                <p class="vpn-proxy-hint">安装命令会复制完整脚本；服务端尚未提供自动注册时，未授权设备不会自动获准使用代理。</p>
            </section>
        </div>
        <div class="modal-buttons tech-dialog-actions">
            <span class="tech-footer-decoration" aria-hidden="true"></span>
            <button type="button" class="btn-xxs" data-click="closeVpnProxyPanel">关闭</button>
            <button type="button" class="btn-xxs" data-click="refreshVpnProxyPanel">刷新</button>
        </div>
    </div>
</div>
