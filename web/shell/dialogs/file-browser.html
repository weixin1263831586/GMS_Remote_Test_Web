<div id="file-browser-modal" class="modal" style="z-index: 10060;">
        <div class="modal-content modal-l modal-pin tech-dialog tech-dialog--file-browser"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#folder"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title" id="file-browser-title">浏览文件</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeFileBrowserModal">&times;</button>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body" style="overflow: hidden; display: flex; flex-direction: column;">
                <!-- Worker switching stays available for GSI Worker browsing. -->
                <div id="file-browser-worker-row" class="file-browser-worker-row tech-field-card tech-field-stack" style="display:none;">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="/static/icons/ui.svg#server"></use></svg></span>
                    <label for="file-browser-worker-select">Worker 主机:</label>
                    <select id="file-browser-worker-select" data-change="onFileBrowserWorkerChange"></select>
                </div>
                <div class="file-browser-location-toolbar" aria-label="文件位置与目录导航">
                    <span class="file-browser-location-label">路径</span>
                    <div class="file-browser-path" id="file-browser-current-path" aria-label="当前目录"></div>
                    <div class="file-browser-nav-actions" role="toolbar" aria-label="文件目录导航">
                        <button type="button" class="btn-xxs" data-click="navigateToRoot" title="根目录" aria-label="根目录"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#home"></use></svg></button>
                        <button type="button" class="btn-xxs" data-click="navigateToParent" title="返回上级" aria-label="返回上级"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#back"></use></svg></button>
                        <button type="button" class="btn-xxs" data-click="refreshCurrentDirectory" title="刷新" aria-label="刷新"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#refresh"></use></svg></button>
                    </div>
                </div>
                <div class="file-browser-header">
                    <span class="file-browser-icon"></span>
                    <span>名称</span>
                    <span style="text-align:right;">大小</span>
                    <span style="text-align:right;">修改时间</span>
                </div>
                <div class="file-browser-list" id="file-browser-list" style="flex: 1; overflow-y: auto; min-height: 0;">
                    <!-- 文件列表将动态生成 -->
                </div>

            </div>

<div class="modal-buttons tech-dialog-actions"><span class="tech-footer-decoration" aria-hidden="true"></span>
                    <button class="btn-xxs" data-click="closeFileBrowserModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="confirmFileSelection">选择</button>
                </div>
</div>
    </div>
