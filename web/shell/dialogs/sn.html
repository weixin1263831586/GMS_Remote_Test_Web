<div id="sn-modal" class="modal">
        <div class="modal-content modal-s tech-dialog tech-dialog--sn">
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#chip"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">烧写SN码</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeSnModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-form-row tech-structured-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#chip"></use></svg></span>
                    <label>SN 码:</label>
                    <input type="text" id="sn-code" placeholder="请输入SN码" />
                </div>
                <div class="modal-info-text">
                    ⚠️ 该功能需要在 loader 模式下烧写 SN 码到设备。
                </div>
                <div class="modal-buttons tech-dialog-actions">
                    <button class="btn-xxs" data-click="closeSnModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitSnBurn">开始烧写</button>
                </div>
            </div>
        </div>
    </div>
