<div id="agent-access-create-modal" class="modal" aria-labelledby="agent-access-create-title" aria-hidden="true">
    <div class="modal-content agent-access-modal-content">
        <div class="modal-header">
            <span id="agent-access-create-title" class="modal-title">创建配对码</span>
            <button type="button" class="modal-close" aria-label="关闭创建配对码" data-click="agentAccessToggleCreate" data-a0="false">&times;</button>
        </div>
        <div class="modal-body agent-access-modal-body">
            <form id="agent-access-enroll-form" class="agent-access-create-card" data-submit="agentAccessCreateEnrollment" data-prevent>
                <div class="agent-access-form-grid">
                    <label class="agent-access-field">
                        <span>Agent 标识名 <em>必填</em></span>
                        <input id="agent-access-name" class="combo-box" maxlength="64" required placeholder="例如 codex-build03" autocomplete="off" autofocus>
                        <small>使用客户端名称和主机名，方便识别。</small>
                    </label>
                    <label class="agent-access-field agent-access-days-field">
                        <span>接入凭据有效期</span>
                        <span class="agent-access-input-suffix"><input id="agent-access-days" class="combo-box" type="number" min="1" max="365" value="90"><b>天</b></span>
                        <small>配对成功后开始计算，与配对码的 5 分钟有效期不同。</small>
                    </label>
                </div>
                <fieldset class="agent-access-scope-fieldset">
                    <legend>授权范围</legend>
                    <div id="agent-access-scope-details">
                        <div class="agent-access-scope-heading">
                            <div>
                                <button class="btn-xxs" type="button" data-click="agentAccessSetScopeSelection" data-a0="default">恢复推荐</button>
                                <button class="btn-xxs" type="button" data-click="agentAccessSetScopeSelection" data-a0="all">全选</button>
                                <button class="btn-xxs" type="button" data-click="agentAccessSetScopeSelection" data-a0="none">清空</button>
                            </div>
                        </div>
                        <div id="agent-access-scopes" class="agent-access-scopes"></div>
                    </div>
                </fieldset>
                <details class="agent-access-details agent-access-target-details" open>
                    <summary>限制 Worker 和设备 <span id="agent-access-target-summary">全部 Worker · 全部设备</span></summary>
                    <div class="agent-access-form-grid">
                        <label class="agent-access-field">
                            <span>允许的 Worker</span>
                            <input id="agent-access-workers" class="combo-box mono" value="*" placeholder="* 或逗号分隔的 Worker ID" data-input="agentAccessUpdateTargetSummary">
                            <small>* 表示全部；多个 Worker ID 用逗号分隔。</small>
                        </label>
                        <label class="agent-access-field">
                            <span>允许的设备</span>
                            <input id="agent-access-devices" class="combo-box mono" value="*" placeholder="* 或逗号分隔的设备序列号" data-input="agentAccessUpdateTargetSummary">
                            <small>* 表示全部；多个设备序列号用逗号分隔。</small>
                        </label>
                    </div>
                </details>
            </form>
            <div id="agent-access-code-card" class="agent-access-code-card" hidden>
                <div class="agent-access-card-heading">
                    <div><h3>完成服务器配对</h3><p id="agent-access-code-context"></p></div>
                </div>
                <div class="agent-access-code-value">
                    <strong id="agent-access-code-result" class="mono"></strong>
                    <button class="btn-xs btn-primary" id="agent-access-copy-code" type="button" data-click="agentAccessCopyEnrollmentCode">复制配对码</button>
                </div>
                <p id="agent-access-code-expiry">5 分钟内有效，只能使用一次。</p>
                <div class="agent-access-code-next">
                    <span>命令已含本次配对码（0600 临时文件，不进 shell 历史）；粘贴到目标服务器直接执行，完成后刷新接入列表。</span>
                    <button class="btn-xs" type="button" data-click="copyPaircodeInstallCommand">复制安装命令</button>
                </div>
            </div>
        </div>
        <div id="agent-access-create-actions" class="agent-access-form-actions">
            <span class="agent-access-form-hint">生成时验证管理员身份，Agent 仅获得所选权限。</span>
            <div>
                <button class="btn-xs" type="button" data-click="agentAccessToggleCreate" data-a0="false">取消</button>
                <button id="agent-access-create-submit" class="btn-xs btn-primary" type="submit" form="agent-access-enroll-form">生成配对码</button>
            </div>
        </div>

        <div id="agent-access-result-actions" class="agent-access-form-actions" hidden>
            <span class="agent-access-form-hint">配对码只能使用一次，完成配对后可关闭此窗口。</span>
            <button class="btn-xs" type="button" data-click="agentAccessDismissCode">关闭</button>
        </div>
    </div>
</div>

<div id="agent-sdk-add-modal" class="modal" aria-labelledby="agent-sdk-add-title" aria-hidden="true">
    <div class="modal-content agent-access-modal-content">
        <div class="modal-header">
            <span id="agent-sdk-add-title" class="modal-title">添加 SDK 源码源</span>
            <button type="button" class="modal-close" aria-label="关闭添加SDK" data-click="sdkConfigToggleAddSdk" data-a0="false">&times;</button>
        </div>
        <div class="modal-body agent-access-modal-body">
            <form id="agent-sdk-add-form" class="agent-access-create-card" data-submit="sdkConfigSubmitAdd" data-prevent>
                <div class="agent-access-form-grid">
                    <label class="agent-access-field">
                        <span>源类型</span>
                        <select id="agent-sdk-add-type" class="combo-box" data-change="sdkConfigOnTypeChange">
                            <option value="ssh_git">编译服务器（SSH 只读）</option>
                            <option value="local_git">本机 Git 仓库</option>
                        </select>
                        <small>编译服务器：全量自动发现该目录下全部 git 子仓；本机：绑定 Web 主机上的仓库路径。</small>
                    </label>
                    <label class="agent-access-field agent-sdk-ssh-only" id="agent-sdk-add-target-field">
                        <span>编译服务器 <em>必填</em>（填完按回车自动发现目录）</span>
                        <input id="agent-sdk-add-target" class="combo-box mono" maxlength="255" placeholder="hcq@10.10.10.206" autocomplete="off" data-change="sdkConfigOnTargetChange" data-keydown="sdkConfigOnTargetKeydown" data-key="Enter" data-prevent>
                        <small>格式 user@host[:port]；口令优先取编译服务器配置，没有则用下方口令框。</small>
                    </label>
                </div>
                <div class="agent-access-form-grid">
                    <label class="agent-access-field">
                        <span>SDK 根目录 <em>必选</em>（可多选批量添加）</span>
                        <div id="agent-sdk-add-path-list" class="agent-sdk-path-list" role="group" aria-label="候选 SDK 根目录">
                            <div class="agent-sdk-path-empty">请先填写服务器并按回车「发现目录」</div>
                        </div>
                        <div class="agent-sdk-path-actions" id="agent-sdk-add-path-actions" hidden>
                            <button type="button" class="btn-xxs" data-click="sdkConfigSelectAllPaths" data-a0="true">全选</button>
                            <button type="button" class="btn-xxs" data-click="sdkConfigSelectAllPaths" data-a0="false">清空</button>
                        </div>
                        <small id="agent-sdk-add-path-hint">只列出 repo 工作区与 Android 源码树（含 build/envsetup.sh）；普通 git 仓（CI 工具、备份）不是 SDK 树，不再列为候选。</small>
                    </label>
                    <label class="agent-access-field">
                        <span>源 ID（可选）</span>
                        <input id="agent-sdk-add-id" class="combo-box mono" maxlength="64" placeholder="留空按目录名自动生成" disabled>
                        <small>批量添加时忽略此项，一律按目录名自动生成（重名自动加 -2/-3）。单条添加时保留目录名大小写。</small>
                    </label>
                </div>
                <div class="agent-access-form-grid agent-sdk-ssh-only" id="agent-sdk-add-cred-row">
                    <label class="agent-access-field" id="agent-sdk-add-password-field">
                        <span>SSH 口令（可选）</span>
                        <input id="agent-sdk-add-password" class="combo-box" type="password" maxlength="128" placeholder="服务器未配置口令时填写" autocomplete="new-password">
                        <small>加密存储，仅用于只读检索。</small>
                    </label>
                    <label class="agent-access-field">
                        <span>默认 revision（可选）</span>
                        <input id="agent-sdk-add-revision" class="combo-box mono" maxlength="128" placeholder="本机默认 main / 编译服务器默认 HEAD">
                        <small>Agent 检索未指定 revision 时使用的默认值。</small>
                    </label>
                </div>
                <div class="agent-access-form-grid">
                    <label class="agent-access-field">
                        <span>Android 版本（可选）</span>
                        <input id="agent-sdk-add-android-version" class="combo-box mono" maxlength="128" placeholder="留空按目录名自动识别（如 Android17）">
                        <small>仅用于列表展示；批量添加时每条路径按各自目录名自动识别，此框只在单条添加时生效。</small>
                    </label>
                    <label class="agent-access-field">
                        <span>手动路径兜底（可选）</span>
                        <input id="agent-sdk-add-path-manual" class="combo-box mono" maxlength="512" placeholder="列表没有时手动输入绝对路径" autocomplete="off" data-change="sdkConfigPrefillAndroidVersion">
                        <small>填写后只添加这一条路径（优先于勾选列表）；用于发现不到的深层目录。</small>
                    </label>
                    <label class="agent-access-field">
                        <span>重新发现（可选）</span>
                        <button id="agent-sdk-add-discover-btn" class="btn-xs" type="button" data-click="sdkConfigDiscoverRoots">发现目录</button>
                        <small id="agent-sdk-add-discover-hint">服务器路径填错改动后可手动重刷下拉。</small>
                    </label>
                </div>
                <div id="agent-sdk-add-probe-result" class="agent-access-code-next" hidden>
                    <span id="agent-sdk-add-probe-text">—</span>
                </div>
            </form>
        </div>
        <div class="agent-access-form-actions">
            <span class="agent-access-form-hint">注册前会连接服务器校验路径与 git 仓库；只读检索，绝不写入远端。</span>
            <div>
                <button class="btn-xs" type="button" data-click="sdkConfigToggleAddSdk" data-a0="false">取消</button>
                <button id="agent-sdk-add-probe-btn" class="btn-xs" type="button" data-click="sdkConfigProbePath">校验路径</button>
                <button id="agent-sdk-add-submit" class="btn-xs btn-primary" type="submit" form="agent-sdk-add-form">添加</button>
            </div>
        </div>
    </div>
</div>

<div id="agent-access-scopes-modal" class="modal" aria-labelledby="agent-access-scopes-title" aria-hidden="true">
    <div class="modal-content modal-m">
        <div class="modal-header">
            <span id="agent-access-scopes-title" class="modal-title">Agent 授权范围</span>
            <button type="button" class="modal-close" aria-label="关闭授权范围" data-click="agentAccessCloseScopes">&times;</button>
        </div>
        <div id="agent-access-token-scope-list" class="modal-body"></div>
    </div>
</div>
