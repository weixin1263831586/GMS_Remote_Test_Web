<div id="vpn-credential-modal" class="modal">
        <div class="modal-content modal-s tech-dialog tech-dialog--vpn-credential">
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#shield"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">🔒 选择 VPN 连接</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeVpnCredentialModal">&times;</button>
            </div>
            <div class="modal-body tech-purpose-body tech-purpose-body--vpn-credential"><p class="tech-workflow-lede">选择主机 NetworkManager 中已配置的 VPN 账号</p>
                <form id="vpn-credential-form" data-submit="submitVpnCredential" data-prevent autocomplete="off" class="tech-purpose-form" ><section class="tech-purpose-panel"><h3 class="tech-workflow-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#settings"></use></svg> 选择网络连接</h3>
                <div class="modal-form-row tech-structured-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#lock"></use></svg></span>
                    <label>VPN账号:</label>
                    <select id="vpn-credential-name" style="flex:1;padding:6px 8px;border-radius:4px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-primary);font-size:13px;"></select>
                </div>
                </section></form>
                <div class="modal-ssh-info">
                    <small>VPN 账号在 Ubuntu 主机 NetworkManager 中预先配置。</small>
                </div>
                <div class="modal-buttons tech-dialog-actions">
                    <button class="btn-xxs" data-click="closeVpnCredentialModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitVpnCredential">连接</button>
                </div>
            </div>
        </div>
    </div>
