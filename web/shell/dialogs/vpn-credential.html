<div id="vpn-credential-modal" class="modal">
        <div class="modal-content modal-s">
            <div class="modal-header">
                <span class="modal-title">🔒 选择 VPN 连接</span>
                <button type="button" class="modal-close" aria-label="关闭" data-click="closeVpnCredentialModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="vpn-credential-form" data-submit="submitVpnCredential" data-prevent autocomplete="off">
                <div class="modal-form-row">
                    <label>VPN账号:</label>
                    <select id="vpn-credential-name" style="flex:1;padding:6px 8px;border-radius:4px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-primary);font-size:13px;"></select>
                </div>
                </form>
                <div class="modal-ssh-info">
                    <small>VPN 账号在 Ubuntu 主机 NetworkManager 中预先配置。</small>
                </div>
                <div class="modal-buttons">
                    <button class="btn-xxs" data-click="closeVpnCredentialModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitVpnCredential">连接</button>
                </div>
            </div>
        </div>
    </div>
