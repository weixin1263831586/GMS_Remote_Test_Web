<div id="wifi-modal" class="modal">
        <div class="modal-content modal-s tech-dialog tech-dialog--wifi">
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#wifi"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">连接Wi-Fi</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeWifiModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="wifi-form" data-submit="submitWifiConfig" data-prevent autocomplete="off">
                <div class="modal-form-row tech-structured-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#wifi"></use></svg></span>
                    <label>Wi-Fi 名称:</label>
                    <input type="text" id="wifi-ssid" data-modal-initial-focus placeholder="留空使用 config.wifi.ssid" autocomplete="off" />
                </div>
                <div class="modal-form-row tech-structured-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#lock"></use></svg></span>
                    <label>Wi-Fi 密码:</label>
                    <input type="text" id="wifi-password" placeholder="请输入 Wi-Fi 密码" autocomplete="off" />
                </div>
                <div class="modal-buttons tech-dialog-actions">
                    <button type="button" class="btn-xxs" data-click="closeWifiModal">取消</button>
                    <button type="submit" class="btn-xxs btn-primary">连接</button>
                </div>
                </form>
            </div>
        </div>
    </div>
