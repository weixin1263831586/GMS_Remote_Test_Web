<div id="ui-control-modal" class="modal">
        <div class="modal-content modal-xl tech-dialog tech-dialog--ui-control">
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#layout"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">🎯 智能 UI 操控 <span id="ui-control-serial" style="font-size: 12px; color: var(--text-secondary); font-weight: normal;"></span></span></div>
                <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
                    <button class="btn-xxs" data-click="refreshUiControl"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#refresh"></use></svg> 刷新</button>
                    <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeUiControl">&times;</button>
                </div>
            </div>
            <div class="modal-body tech-ui-workbench" style="display: flex; flex-direction: column; gap: 8px;">
                <div id="ui-control-status" class="modal-info-text">加载中...</div>
                <div class="tech-ui-screen-elements tech-ui-inspector-layout" style="display: flex; gap: 12px; align-items: flex-start; min-height: 400px;">
                    <!-- 左：设备截图 -->
                    <section class="tech-ui-screen-panel" style="flex: 0 0 auto; max-width: 45%;">
                        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">设备屏幕</div>
                        <img id="ui-control-screenshot" alt="device screen" style="max-width: 100%; max-height: 60vh; border: 1px solid var(--border-color); border-radius: 8px; display: block;" />
                    </section>
                    <!-- 右：可点按元素列表 -->
                    <section class="tech-ui-inspector-panel" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">UI 元素（点击行即点按对应坐标，随后自动刷新）</div>
                        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                            <input id="ui-control-search" type="search" placeholder="搜索文本、资源 ID 或控件类型" data-input="renderUiControlElements" style="flex:1;min-width:0;" />
                            <label style="font-size:12px;white-space:nowrap;"><input id="ui-control-actionable-only" type="checkbox" checked data-change="renderUiControlElements" /> 仅可操作</label>
                        </div>
                        <div id="ui-control-elements" style="flex: 1; overflow: auto; border: 1px solid var(--border-color); border-radius: 8px; max-height: 60vh;">
                            <div style="padding: 20px; color: var(--text-secondary); text-align: center;">暂无元素</div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
