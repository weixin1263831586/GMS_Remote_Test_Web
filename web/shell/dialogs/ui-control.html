<div id="ui-control-modal" class="modal">
        <div class="modal-content modal-xl tech-dialog tech-dialog--ui-control"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#layout"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">智能 UI 操控</span><span id="ui-control-serial" class="ui-control-serial"></span></div>
                <div class="ui-control-header-actions">
                    <button class="btn-xxs" data-click="refreshUiControl"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#refresh"></use></svg> 刷新</button>
                    <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeUiControl">&times;</button>
                </div>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body ui-control-body">
                <div id="ui-control-status" class="modal-info-text">加载中...</div>
                <div class="ui-control-workspace">
                    <!-- 左：设备截图 -->
                    <section class="ui-control-screen-panel tech-section">
                        <h3 class="ui-control-panel-title">设备屏幕</h3>
                        <img id="ui-control-screenshot" alt="设备屏幕截图" />
                    </section>
                    <!-- 右：可点按元素列表 -->
                    <section class="ui-control-elements-panel tech-section">
                        <h3 class="ui-control-panel-title">UI 元素（点击行即点按对应坐标，随后自动刷新）</h3>
                        <div class="ui-control-filter-row">
                            <input id="ui-control-search" type="search" placeholder="搜索文本、资源 ID 或控件类型" data-input="renderUiControlElements" />
                            <label class="ui-control-filter-check"><input id="ui-control-actionable-only" type="checkbox" checked data-change="renderUiControlElements" /> 仅可操作</label>
                        </div>
                        <div id="ui-control-elements">
                            <div class="ui-control-empty">暂无元素</div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
