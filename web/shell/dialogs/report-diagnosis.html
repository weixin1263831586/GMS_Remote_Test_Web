<div id="report-diagnosis-modal" class="modal">
        <div class="modal-content modal-workspace report-diagnosis-shell tech-dialog tech-dialog--report-diagnosis">
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header report-diagnosis-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#chart"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">🤖 报错诊断</span></div>
                <div class="report-diagnosis-actions">
                    <button type="button" class="btn-xxs btn-primary" data-click="rerunReportDiagnosis">重新诊断</button>
                    <button type="button" class="btn-xxs" data-click="copyReportDiagnosis"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#info"></use></svg> 复制结果</button>
                    <button type="button" class="btn-xxs" data-click="minimizeReportDiagnosisWorkbench">缩小</button>
                    <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeReportDiagnosisWorkbench">&times;</button>
                </div>
            </div>
            <div class="modal-body report-diagnosis-body tech-diagnosis-workbench"><div class="tech-diagnosis-layout"><aside class="tech-diagnosis-summary-pane" aria-label="诊断摘要"><h3 class="tech-workflow-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#chart"></use></svg> 诊断摘要</h3>
                <div id="report-diagnostic-summary" class="report-diagnosis-summary">
                    <div class="suite-empty" style="margin: 0;">点击失败用例上的“🤖 报错诊断”开始诊断</div>
                </div>
                </aside><section class="tech-diagnosis-result-pane" aria-label="诊断结果"><h3 class="tech-workflow-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#search"></use></svg> 问题分析</h3><div id="report-diagnostic-result" class="report-diagnosis-result"></div></section></div>
            </div>
        </div>
    </div>
