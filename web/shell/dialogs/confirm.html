<div id="confirm-modal" class="modal" style="z-index: 10090;">
        <div class="modal-content modal-s">
            <div class="modal-header">
                <span class="modal-title" id="confirm-title">确认操作</span>
                <button type="button" class="modal-close" aria-label="关闭" data-click="_actCloseModal" data-a0="confirm-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-info-text" id="confirm-message" style="margin-bottom: 15px; background: rgba(231, 76, 60, 0.1); border-left-color: var(--danger-color); color: var(--danger-color); white-space: pre-wrap; overflow-wrap: anywhere;">
                    确定要执行此操作吗？
                </div>
                <div class="modal-buttons" style="margin-top: 20px;">
                    <button class="btn-xxs" id="confirm-cancel-btn">取消</button>
                    <button class="btn-xxs btn-primary" id="confirm-ok-btn" style="background: var(--danger-color);">确定</button>
                </div>
            </div>
        </div>
    </div>
