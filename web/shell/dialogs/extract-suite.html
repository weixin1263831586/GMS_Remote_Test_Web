<div id="extract-suite-modal" class="modal" style="display: none;" data-keydown="handleExtractSuiteKeydown" data-r0="event">
        <div class="modal-content modal-m tech-dialog tech-dialog--extract-suite"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#archive"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">解压测试套件</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeExtractSuiteModal">&times;</button>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body">
<p class="tech-intro">选择压缩包并设置目标文件夹，完成后刷新套件列表。</p>
                <form id="extract-suite-form" data-submit="submitExtractSuite" data-prevent autocomplete="off">
                    <section class="tech-form-section tech-form-section--extract-suite" aria-label="解压任务"><h3 class="tech-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#archive"></use></svg>解压任务</h3><div class="modal-form-row tech-field-card"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#package"></use></svg></span>
                        <label for="extract-suite-archive-select">压缩包:</label>
                        <select id="extract-suite-archive-select" class="host-input" data-change="handleExtractArchiveSelectChange"></select>
                    </div>
                    <div class="modal-form-row tech-field-card"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#folder"></use></svg></span>
                        <label for="extract-suite-archive-path">压缩包路径:</label>
                        <input type="text" id="extract-suite-archive-path" class="host-input" placeholder="~/GMS-Suite/android-suite.zip" autocomplete="off" />
                    </div>
                    <div class="modal-form-row tech-field-card"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#user"></use></svg></span>
                        <label for="extract-suite-folder-name">文件夹名称:</label>
                        <input type="text" id="extract-suite-folder-name" class="host-input" placeholder="android-cts-verifier-16.1_r3" autocomplete="off" />
                    </div></section>
                </form>
                <div class="modal-info-text" style="margin-top: 10px;">
                    💡 将压缩包解压到 GMS-Suite 下指定文件夹，完成后自动刷新左侧套件列表
                </div>

            </div>

<div class="modal-buttons tech-dialog-actions"><span class="tech-footer-decoration" aria-hidden="true"></span>
                    <button class="btn-xxs" data-click="closeExtractSuiteModal">取消</button>
                    <button id="btn-submit-extract-suite" class="btn-xxs btn-primary" data-click="submitExtractSuite">开始解压</button>
                </div>
</div>
    </div>
