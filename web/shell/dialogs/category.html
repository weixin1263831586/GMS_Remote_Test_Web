<div id="category-modal" class="modal" style="display: none;">
            <div class="modal-content modal-xs">
                <div class="modal-header">
                    <span class="modal-title">添加分类</span>
                    <button type="button" class="modal-close" aria-label="关闭" data-click="closeCategoryModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="modal-form-row">
                        <label>分类名称:</label>
                        <input type="text" id="category-name" placeholder="例如：娱乐" maxlength="20" style="width: 100%; padding: 8px; background: var(--darker-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-size: 13px;" />
                    </div>
                    <div class="modal-form-row">
                        <label>选择图标:</label>
                        <input type="text" id="category-icon" placeholder="例如：🎮" maxlength="2" style="width: 100%; padding: 8px; background: var(--darker-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-size: 13px;" />
                    </div>
                    <div class="modal-info-text">
                        💡 提示：图标可以是1-2个Emoji字符
                    </div>
                    <div class="modal-buttons">
                        <button class="btn-xxs" data-click="closeCategoryModal">取消</button>
                        <button class="btn-xxs btn-primary" data-click="saveCategory">保存</button>
                    </div>
                </div>
            </div>
        </div>
