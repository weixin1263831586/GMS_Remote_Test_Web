<div id="gsi-modal" class="modal">
        <div class="modal-content modal-s">
            <div class="modal-header">
                <span class="modal-title">烧写GSI镜像</span>
                <button type="button" class="modal-close" aria-label="关闭" data-click="closeGsiModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-form-row">
                    <label>GSI烧写脚本:</label>
                    <div class="input-with-btn">
                        <input type="text" id="gsi-script" placeholder="请选择GSI烧写脚本" />
                        <button class="btn-small" data-click="browseLocalFileForGsiScript">📁</button>
                    </div>
                </div>
                <div class="modal-form-row">
                    <label>System 镜像:</label>
                    <div class="input-with-btn">
                        <input type="text" id="gsi-system" placeholder="请选择System镜像" />
                        <button class="btn-small" data-click="browseLocalFileForGsiSystem">📁</button>
                        <button class="btn-small" data-click="pickLocalGsiSystemFile">本机</button>
                    </div>
                </div>
                <div class="modal-form-row">
                    <label>Vendor Boot 镜像:</label>
                    <div class="input-with-btn">
                        <input type="text" id="gsi-vendor" placeholder="选择本机文件或输入服务器Vendor Boot路径(可选)" />
                        <button class="btn-small" data-click="browseLocalFileForGsiVendor">本机</button>
                        <button class="btn-small" data-click="browseRemoteFileForGsiVendor">服务器</button>
                    </div>
                </div>
                <div class="modal-info-text">
                    ⚠️ GSI烧写会在需要时自动解锁 Bootloader（通常会清除设备数据），并自动处理分区删除、镜像烧写和设备重启。
                </div>
                <div class="modal-buttons">
                    <button class="btn-xxs" data-click="closeGsiModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitGsiBurn">开始烧写</button>
                </div>
            </div>
        </div>
    </div>
