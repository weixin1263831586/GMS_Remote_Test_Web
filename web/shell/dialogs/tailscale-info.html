<div id="tailscale-info-modal" class="modal">
    <div class="modal-content modal-l tech-dialog tech-dialog--tailscale" data-modal-initial-focus>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span>
        <span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
        <div class="modal-header tech-dialog-header">
            <div class="tech-title-group">
                <span class="tech-title-glyph" aria-hidden="true"><svg class="tech-brand-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="19"/><ellipse cx="24" cy="24" rx="9" ry="19"/><path d="M5.5 24h37M8.3 13.5h31.4M8.3 34.5h31.4"/></svg></span>
                <span class="tech-title-divider" aria-hidden="true"></span>
                <span class="modal-title">Tailscale 组网</span>
            </div>
            <span class="tech-header-ticks" aria-hidden="true"></span>
            <button type="button" class="modal-close" aria-label="关闭" data-click="closeTailscaleInfoModal">&times;</button>
        </div>
        <div class="modal-body tech-tailscale-body">
            <div class="tech-tailscale-rows">
                <div class="modal-form-row tech-tailscale-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#link"></use></svg></span>
                    <label for="tailscale-url-display">公网访问地址</label>
                    <input type="text" id="tailscale-url-display" readonly placeholder="正在检查..." />
                    <button type="button" class="btn-small tech-row-action" data-click="copyTailscaleAccessUrl"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#copy"></use></svg><span>复制</span></button>
                </div>
                <div class="modal-form-row tech-tailscale-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#terminal"></use></svg></span>
                    <label for="tailscale-install-cmd">Ubuntu 安装</label>
                    <input type="text" id="tailscale-install-cmd" readonly value="sudo bash scripts/setup_tailscale.sh" />
                    <button type="button" class="btn-small tech-row-action" data-click="copyTailscaleInstallCmd"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#copy"></use></svg><span>复制</span></button>
                </div>
                <div class="modal-form-row tech-tailscale-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="tech-brand-icon" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><path d="M3 6.5 14.1 5v10H3zM16 4.7 29 3v12H16zM3 17h11.1v10L3 25.5zM16 17h13v12l-13-1.7z"/></svg></span>
                    <label for="tailscale-download-windows">Windows 程序</label>
                    <input type="text" id="tailscale-download-windows" readonly value="https://tailscale.com/download/windows" />
                    <button type="button" class="btn-small tech-row-action" data-click="_actOpenUrlBlank" data-a0="https://tailscale.com/download/windows"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#external"></use></svg><span>打开</span></button>
                </div>
                <div class="modal-form-row tech-tailscale-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="tech-brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M16.5 6.5c1.15-1.25 1.12-2.8 1.03-3.3-1.39.13-2.73.95-3.6 1.98-.93 1.06-1.42 2.47-1.3 3.32 1.48.12 2.95-.7 3.87-2zM19.57 18.33c-.55 1.28-.8 1.84-1.49 2.97-.9 1.41-2.17 3.18-3.76 3.2-1.46.02-1.85-.94-3.86-.94-1.97 0-2.43.91-3.85.97-1.6.06-2.83-1.64-3.72-3.03-2.65-4.12-4.56-11.72-1.9-16.42A6.4 6.4 0 0 1 6.51 1.95c1.8-.04 3.52 1.15 4.62 1.15 1.05 0 2.97-1.41 5.13-1.2 1.32.06 3.87.54 5.25 2.71-4.65 2.53-3.9 8.02-.06 10.31z" transform="translate(2.5 2) scale(.79)"/></svg></span>
                    <label for="tailscale-download-mac">macOS 程序</label>
                    <input type="text" id="tailscale-download-mac" readonly value="https://tailscale.com/download/mac" />
                    <button type="button" class="btn-small tech-row-action" data-click="_actOpenUrlBlank" data-a0="https://tailscale.com/download/mac"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#external"></use></svg><span>打开</span></button>
                </div>
                <div class="modal-form-row tech-tailscale-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="tech-brand-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M10 8 7.5 4M22 8l2.5-4"/><path d="M7.2 13a8.8 8.8 0 0 1 17.6 0Z" fill="currentColor" stroke="none"/><circle cx="12" cy="10" r="1" fill="#50346d" stroke="none"/><circle cx="20" cy="10" r="1" fill="#50346d" stroke="none"/><rect x="7.2" y="14.5" width="17.6" height="12" rx="2" fill="currentColor" stroke="none"/><path d="M4.4 16v8M27.6 16v8M12 26.5v3.2M20 26.5v3.2" stroke-width="3.1"/></svg></span>
                    <label for="tailscale-download-android">Android 应用</label>
                    <input type="text" id="tailscale-download-android" readonly value="https://tailscale.com/download/android" />
                    <button type="button" class="btn-small tech-row-action" data-click="_actOpenUrlBlank" data-a0="https://tailscale.com/download/android"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#external"></use></svg><span>打开</span></button>
                </div>
            </div>
            <div class="modal-info-text tech-tailscale-help">
                <span class="tech-hint-icon" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#info"></use></svg></span>
                <span>点击打开弹框时自动检测并启动 Tailscale。Ubuntu / Windows / macOS / Android 需安装 Tailscale 并登录同一账号。</span>
            </div>
        </div>
        <div class="modal-buttons tech-dialog-footer">
            <span class="tech-footer-ticks" aria-hidden="true"></span>
            <svg class="tech-footer-trace" viewBox="0 0 980 44" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 10H200l28 27h750" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="miter"/></svg>
            <button type="button" class="btn-xxs" data-click="closeTailscaleInfoModal">关闭</button>
        </div>
    </div>
</div>
