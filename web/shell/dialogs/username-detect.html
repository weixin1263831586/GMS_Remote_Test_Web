<div id="username-detect-modal" class="modal">
        <div class="modal-content modal-s tech-dialog tech-dialog--username-detect"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#terminal"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">SSH 用户名检测</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeUsernameDetectModal">&times;</button>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body">
<p class="tech-intro">确认客户端身份；SSH 可达时将验证用户名与连接凭据。</p>
                <form id="username-detect-form" data-submit="submitUsernameDetect" data-prevent autocomplete="off">
                <section class="tech-form-section tech-form-section--username-detect" aria-label="SSH 连接信息"><h3 class="tech-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#terminal"></use></svg>SSH 连接信息</h3><div class="modal-form-row tech-structured-row tech-field-card">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#network"></use></svg></span>
                    <label for="username-detect-ip">客户端IP:</label>
                    <input type="text" id="username-detect-ip" readonly />
                </div>
                <div class="modal-form-row tech-structured-row tech-field-card">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#user"></use></svg></span>
                    <label for="username-detect-username">用户名:</label>
                    <input type="text" id="username-detect-username" data-modal-initial-focus placeholder="例如：ubuntu / root / admin" data-keypress="handleUsernameDetectKeyPress" data-r0="event" autocomplete="username" />
                </div>
                <div class="modal-form-row tech-structured-row tech-field-card">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#lock"></use></svg></span>
                    <label for="username-detect-password">SSH密码:</label>
                    <input type="password" id="username-detect-password" placeholder="可选，用于SSH验证" data-keypress="handleUsernameDetectKeyPress" data-r0="event" autocomplete="current-password" />
                </div></section>
                </form>
                <div class="modal-ssh-info">
                    <small>SSH可达时会验证用户名；通过 Tailscale 等远程访问时可留空密码直接保存。</small>
                </div>

            </div>

<div class="modal-buttons tech-dialog-actions"><span class="tech-footer-decoration" aria-hidden="true"></span>
                    <button class="btn-xxs" data-click="closeUsernameDetectModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitUsernameDetect">保存</button>
                </div>
</div>
    </div>
