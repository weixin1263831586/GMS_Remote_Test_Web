<div id="report-copy-modal" class="modal" style="z-index: 10100;">
        <div class="modal-content modal-l report-copy-modal-content tech-dialog tech-dialog--report-copy"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#copy"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">拷贝测试报告</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeReportCopyModal">&times;</button>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body">
                <div class="modal-info-text" style="margin-bottom: 12px;">
                    选择一个 Tradefed results 报告，复制到同一主机的其他套件或另一主机所选套件的 results 目录。目标中已存在同名报告时不会覆盖。
                </div>
                <div class="report-transfer-grid">
                    <section class="tech-section report-transfer-panel">
                        <h3 class="tech-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#folder"></use></svg>报告来源</h3>
                        <div class="modal-form-row tech-field-card" style="display:block;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#server"></use></svg></span>
                            <label for="report-copy-source-worker" style="display:block;margin-bottom:4px;">来源主机</label>
                            <select id="report-copy-source-worker" class="combo-box" data-change="onReportCopySourceWorkerChange" style="width:100%;"></select>
                        </div>
                        <div class="modal-form-row tech-field-card" style="display:block;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#package"></use></svg></span>
                            <label for="report-copy-source-suite" style="display:block;margin-bottom:4px;">来源套件</label>
                            <select id="report-copy-source-suite" class="combo-box" data-change="onReportCopySourceSuiteChange" style="width:100%;"></select>
                        </div>
                        <div class="modal-form-row tech-field-card" style="display:block;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#settings"></use></svg></span>
                            <label for="report-copy-source-report" style="display:block;margin-bottom:4px;">来源报告</label>
                            <select id="report-copy-source-report" class="combo-box" style="width:100%;"></select>
                        </div>
                    </section>
                    <div aria-hidden="true" style="padding-top:96px;text-align:center;color:var(--primary-color);font-size:22px;">→</div>
                    <section class="tech-section report-transfer-panel">
                        <h3 class="tech-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#server"></use></svg>拷贝目标</h3>
                        <div class="modal-form-row tech-field-card" style="display:block;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#server"></use></svg></span>
                            <label for="report-copy-target-worker" style="display:block;margin-bottom:4px;">目标主机</label>
                            <select id="report-copy-target-worker" class="combo-box" data-change="onReportCopyTargetWorkerChange" style="width:100%;"></select>
                        </div>
                        <div class="modal-form-row tech-field-card" style="display:block;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#package"></use></svg></span>
                            <label for="report-copy-target-suite" style="display:block;margin-bottom:4px;">目标套件</label>
                            <select id="report-copy-target-suite" class="combo-box" data-change="updateReportCopyTargetPath" style="width:100%;"></select>
                        </div>
                        <div class="modal-form-row tech-field-card" style="display:block;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#folder"></use></svg></span>
                            <label for="report-copy-target-path" style="display:block;margin-bottom:4px;">目标目录</label>
                            <input id="report-copy-target-path" type="text" readonly style="width:100%;box-sizing:border-box;" />
                        </div>
                    </section>
                </div>
                <div id="report-copy-status" class="modal-info-text" style="display:none;margin-top:12px;white-space:pre-wrap;"></div>

            </div>

<div class="modal-buttons tech-dialog-actions"><span class="tech-footer-decoration" aria-hidden="true"></span>
                    <button type="button" class="btn-xxs" data-click="closeReportCopyModal">关闭</button>
                    <button type="button" id="report-copy-submit" class="btn-xxs btn-primary" data-click="submitReportCopy">开始拷贝</button>
                </div>
</div>
    </div>
