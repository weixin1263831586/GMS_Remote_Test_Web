<div id="test-results-modal" class="modal" style="z-index: 10090;">
        <div class="modal-content modal-xl modal-pin tech-dialog tech-dialog--test-results"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#chart"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">测试结果列表 <span id="test-results-modal-suite" style="color: var(--text-secondary);" data-ui-type-size="small" data-ui-type-weight="regular"></span></span></div>
                <div class="test-results-header-actions" role="group" aria-label="测试结果列表窗口操作">
                    <button type="button" class="test-results-minimize" data-click="minimizeTestResultsModal" aria-label="缩小测试结果列表" title="缩小测试结果列表"><span aria-hidden="true" class="test-results-minimize-glyph">−</span></button>
                    <button type="button" class="modal-close" aria-label="关闭测试结果列表" title="关闭测试结果列表" data-click="closeTestResultsModal"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#close"></use></svg></button>
                </div>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H740" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body" style="display: flex; flex-direction: column; height: 100%; overflow: hidden; padding: 0 20px;">
                <div class="modal-info-text" style="display: flex; justify-content: space-between; align-items: center; padding: 2px 0;">
                    <span id="test-results-modal-status">点击某一行测试结果可跳转到对应目录</span>
                    <button class="btn-xxs" data-click="loadTestResults" data-a0="true">刷新</button>
                </div>
                <div id="test-results-list" style="flex: 1; overflow: auto; margin-top: 4px; border: 1px solid var(--border-color); border-radius: 8px;">
                    <div style="padding: 20px; color: var(--text-secondary); text-align: center;">加载中...</div>
                </div>
            </div>
        </div>
    </div>
