<div id="firmware-share-password-modal" class="modal" style="z-index: 10080;">
        <div class="modal-content modal-s tech-dialog tech-dialog--firmware-share-password">
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#lock"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">远端固件主机认证</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeFirmwareSharePasswordModal">&times;</button>
            </div>
            <div class="modal-body tech-password-composition">
                <input type="hidden" id="firmware-share-password-host" />
                <div class="modal-info-text">连接远端固件主机认证失败，请输入 SSH 密码。</div>
                <section class="tech-purpose-panel"><h3 class="tech-workflow-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#lock"></use></svg> SSH 身份认证</h3><div class="modal-form-row tech-structured-row">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#lock"></use></svg></span>
                    <label>SSH 密码:</label>
                    <input type="password" id="firmware-share-password-input" placeholder="仅本会话使用，不持久保存" data-keypress="handleFirmwareSharePasswordKeyPress" data-r0="event" autocomplete="current-password" />
                </div>
                </section><div class="modal-buttons tech-dialog-actions">
                    <button class="btn-xxs" data-click="closeFirmwareSharePasswordModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitFirmwareSharePassword">继续</button>
                </div>
            </div>
        </div>
    </div>
