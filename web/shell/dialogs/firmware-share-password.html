<div id="firmware-share-password-modal" class="modal" style="z-index: 10080;">
        <div class="modal-content modal-s">
            <div class="modal-header">
                <span class="modal-title">远端固件主机认证</span>
                <button type="button" class="modal-close" aria-label="关闭" data-click="closeFirmwareSharePasswordModal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="firmware-share-password-host" />
                <div class="modal-info-text">连接远端固件主机认证失败，请输入 SSH 密码。</div>
                <div class="modal-form-row">
                    <label>SSH 密码:</label>
                    <input type="password" id="firmware-share-password-input" placeholder="仅本会话使用，不持久保存" data-keypress="handleFirmwareSharePasswordKeyPress" data-r0="event" autocomplete="current-password" />
                </div>
                <div class="modal-buttons">
                    <button class="btn-xxs" data-click="closeFirmwareSharePasswordModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitFirmwareSharePassword">继续</button>
                </div>
            </div>
        </div>
    </div>
