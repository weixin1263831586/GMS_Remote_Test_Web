<div id="guide-image-modal" class="modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="guide-image-title" data-click="closeGuideImageLightboxFromBackdrop" data-r0="event">
            <div class="modal-content">
                <div class="modal-header">
                    <span id="guide-image-title" class="modal-title">图片操作实例</span>
                    <div class="guide-image-actions">
                        <button id="guide-image-zoom-btn" type="button" class="btn-xxs" data-click="toggleGuideImageZoom">1:1 原图</button>
                        <button type="button" class="modal-close" aria-label="关闭" data-click="closeGuideImageLightbox">&times;</button>
                    </div>
                </div>
                <div class="modal-body">
                    <div id="guide-image-viewport" class="guide-image-viewport">
                        <img id="guide-image-preview" alt="" data-click="toggleGuideImageZoom">
                    </div>
                    <div id="guide-image-caption"></div>
                </div>
            </div>
        </div>
