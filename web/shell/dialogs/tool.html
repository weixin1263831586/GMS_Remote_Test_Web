<div id="tool-modal" class="modal" style="display: none;">
            <div class="modal-content modal-m tech-dialog tech-dialog--tool">
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
                <div class="modal-header tech-dialog-header">
                    <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#tool"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title" id="tool-modal-title">添加工具</span></div>
                    <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeToolModal">&times;</button>
                </div>
                <div class="modal-body tech-tools-composition tech-tools-composition--tool">
                    <input type="hidden" id="tool-index" value="-1" />
                    <section class="tech-purpose-panel tech-tool-details"><h3 class="tech-workflow-section-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#tool"></use></svg> 工具信息与来源</h3><div class="modal-form-row tech-structured-row">
                        <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#grid"></use></svg></span>
                        <label>分类:</label>
                        <select id="tool-category" class="combo-box">
                            <!-- 分类选项将由 JavaScript 动态生成 -->
                        </select>
                    </div>
                    <div class="modal-form-row tech-structured-row">
                        <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#edit"></use></svg></span>
                        <label>标题:</label>
                        <input type="text" id="tool-title" placeholder="例如：Google" />
                    </div>
                    <div class="modal-form-row tech-structured-row">
                        <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#star"></use></svg></span>
                        <label>图标:</label>
                        <input type="text" id="tool-icon" placeholder="输入Emoji或图片URL" style="width: 100%;" />
                    </div>
                    <div class="modal-form-row tech-structured-row" id="emoji-picker-row" style="margin-bottom: 8px;">
                        <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#info"></use></svg></span>
                        <label></label>
                        <div id="emoji-picker" class="emoji-picker-grid">
                            <!-- Emoji 选项将由 JavaScript 动态生成 -->
                        </div>
                    </div>
                    <div class="modal-form-row tech-structured-row">
                        <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#folder"></use></svg></span>
                        <label>链接:</label>
                        <input type="text" id="tool-url" placeholder="例如：https://www.google.com" data-blur="autoFetchIcon" data-r0="value" />
                    </div>
                    </section><div class="modal-info-text">
                        💡 提示：输入网址后点击外部，系统会自动获取网站图标
                    </div>
                    <div id="icon-preview" style="display: none; text-align: center; margin-top: 8px; padding: 8px; background: var(--darker-bg); border-radius: 3px;">
                        <div style="font-size: 11px; color: var(--text-secondary); margin-bottom: 4px;">图标预览：</div>
                        <div id="preview-container" style="width: 40px; height: 40px; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
                            <img id="preview-image" src="" alt="预览" style="width: 40px; height: 40px; border-radius: 3px; border: 1px solid var(--border-color); object-fit: contain;">
                        </div>
                    </div>
                    <div class="modal-buttons tech-dialog-actions">
                        <button class="btn-xxs" data-click="closeToolModal">取消</button>
                        <button class="btn-xxs btn-primary" data-click="saveTool">保存</button>
                    </div>
                </div>
            </div>
        </div>
