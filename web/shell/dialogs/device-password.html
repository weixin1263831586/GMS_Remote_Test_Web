<div id="device-password-modal" class="modal">
        <div class="modal-content modal-s tech-dialog tech-dialog--device-password"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#lock"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title" id="device-password-modal-title">设备主机 SSH 密码</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeDevicePasswordModal">&times;</button>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body">
<p class="tech-intro">为所选设备主机提供本次 SSH 连接凭据。</p>
                <form id="device-pswd-form" data-submit="submitDevicePassword" data-prevent autocomplete="off">
                <section class="tech-form-section tech-form-section--device-password tech-aligned-fields" aria-label="连接凭据"><div class="modal-form-row tech-structured-row tech-field-card">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#device"></use></svg></span>
                    <label for="device-host-display">设备主机:</label>
                    <input type="text" id="device-host-display" autocomplete="off" />
                </div>
                <div class="modal-form-row tech-structured-row tech-field-card">
                    <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#lock"></use></svg></span>
                    <label for="device-pswd">SSH密码:</label>
                    <span class="password-input-wrap"><input type="password" id="device-pswd" placeholder="请输入SSH密码" data-keypress="handleDevicePasswordKeyPress" data-r0="event" autocomplete="current-password" /><button type="button" class="password-visibility-toggle" data-click="togglePasswordVisibility" data-r0="el" aria-controls="device-pswd" aria-label="显示密码" title="显示密码"></button></span>
                </div></section>
                </form>

            </div>

<div class="modal-buttons tech-dialog-actions"><span class="tech-footer-decoration" aria-hidden="true"></span>
                    <button class="btn-xxs" data-click="closeDevicePasswordModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitDevicePassword">确定</button>
                </div>
</div>
    </div>
