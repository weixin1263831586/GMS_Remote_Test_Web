<div id="device-password-modal" class="modal">
        <div class="modal-content modal-s">
            <div class="modal-header">
                <span class="modal-title" id="device-password-modal-title">设备主机 SSH 密码</span>
                <button type="button" class="modal-close" aria-label="关闭" data-click="closeDevicePasswordModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="device-pswd-form" data-submit="submitDevicePassword" data-prevent autocomplete="off">
                <div class="modal-form-row">
                    <label>设备主机:</label>
                    <input type="text" id="device-host-display" autocomplete="off" />
                </div>
                <div class="modal-form-row">
                    <label>SSH密码:</label>
                    <input type="password" id="device-pswd" placeholder="请输入SSH密码" data-keypress="handleDevicePasswordKeyPress" data-r0="event" autocomplete="current-password" />
                </div>
                </form>
                <div class="modal-buttons">
                    <button class="btn-xxs" data-click="closeDevicePasswordModal">取消</button>
                    <button class="btn-xxs btn-primary" data-click="submitDevicePassword">确定</button>
                </div>
            </div>
        </div>
    </div>
