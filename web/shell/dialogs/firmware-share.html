<div id="firmware-share-modal" class="modal" style="z-index: 10040;">
        <div class="modal-content" style="max-width: min(1380px, 97vw); width: 97vw; height: 92vh; max-height: 92vh;">
            <div class="modal-header">
                <span class="modal-title">共享固件</span>
                <button type="button" class="modal-close" aria-label="关闭" data-click="closeFirmwareShareModal">&times;</button>
            </div>
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 12px; align-items: end;">
                    <div class="modal-form-row" style="margin-bottom: 0;">
                        <label>远端固件:</label>
                        <div class="input-with-btn">
                            <input type="text" id="firmware-share-remote" placeholder="user@host:/absolute/path" />
                            <button class="btn-small" data-click="browseRemoteFileForFirmwareShare">编译服务器</button>
                        </div>
                    </div>
                    <div class="modal-form-row" style="margin-bottom: 0;">
                        <label>有效期:</label>
                        <select id="firmware-share-expire-days" style="height: 36px; padding: 8px; background: var(--darker-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary);">
                            <option value="0">长期有效</option>
                            <option value="1">1 天</option>
                            <option value="7">7 天</option>
                            <option value="30">30 天</option>
                        </select>
                    </div>
                </div>
                <div class="modal-form-row" style="margin-top: 10px;">
                    <label>显示名称:</label>
                    <input type="text" id="firmware-share-name" placeholder="可选，默认使用文件名" />
                </div>
                <div id="firmware-share-validation" class="modal-info-text" style="min-height: 20px;"></div>
                <div class="modal-buttons" style="justify-content: flex-start; margin-top: 8px;">
                    <button class="btn-xxs" data-click="validateFirmwareShare">校验</button>
                    <button class="btn-xxs btn-primary" data-click="createFirmwareShare">创建分享</button>
                    <button class="btn-xxs" data-click="loadFirmwareShares">刷新列表</button>
                </div>
                <div style="margin-top: 12px; border: 1px solid var(--border-color); border-radius: 8px; overflow: auto; max-height: calc(92vh - 238px);">
                    <table style="width: 100%; border-collapse: collapse; table-layout: fixed;">
                        <thead style="position: sticky; top: 0; z-index: 1;">
                            <tr style="background: var(--darker-bg); border-bottom: 1px solid var(--border-color);">
                                <th style="padding: 8px; text-align: left; width: 22%;">名称</th>
                                <th style="padding: 8px; text-align: left; width: 40%;">远端路径</th>
                                <th style="padding: 8px; text-align: right; width: 10%;">大小</th>
                                <th style="padding: 8px; text-align: center; width: 10%;">下载</th>
                                <th style="padding: 8px; text-align: center; width: 13%;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="firmware-share-list">
                            <tr><td colspan="5" style="padding: 14px; color: var(--text-secondary); text-align: center;">暂无共享固件</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
