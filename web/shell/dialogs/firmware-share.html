<div id="firmware-share-modal" class="modal" style="z-index: 10040;">
        <div class="modal-content modal-workspace tech-dialog tech-dialog--firmware-share"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
            <div class="modal-header tech-dialog-header">
                <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#link"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">共享固件</span></div>
                <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="closeFirmwareShareModal">&times;</button>
            <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
            <div class="modal-body firmware-share-body">
<p class="tech-intro">选择远端固件并设置共享名称和有效期。</p>
                <div class="firmware-share-form-grid">
                    <div class="modal-form-row tech-field-card" style="margin-bottom: 0;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#settings"></use></svg></span>
                        <label for="firmware-share-remote">远端固件:</label>
                        <div class="input-with-btn">
                            <input type="text" id="firmware-share-remote" placeholder="user@host:/absolute/path" />
                            <button class="btn-small" data-click="browseRemoteFileForFirmwareShare">编译服务器</button>
                        </div>
                    </div>
                    <div class="modal-form-row tech-field-card tech-field-stack" style="margin-bottom: 0;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#clock"></use></svg></span>
                        <label for="firmware-share-expire-days">有效期:</label>
                        <select id="firmware-share-expire-days" style="height: 36px; padding: 8px; background: var(--darker-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary);">
                            <option value="0">长期有效</option>
                            <option value="1">1 天</option>
                            <option value="7">7 天</option>
                            <option value="30">30 天</option>
                        </select>
                    </div>
                </div>
                <section class="tech-form-section tech-form-section--firmware-share" aria-label="共享固件"><div class="modal-form-row tech-field-card" style="margin-top: 10px;"><span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/icons/ui.svg#user"></use></svg></span>
                    <label for="firmware-share-name">显示名称:</label>
                    <input type="text" id="firmware-share-name" placeholder="可选，默认使用文件名" />
                </div></section>
                <div id="firmware-share-validation" class="modal-info-text" role="status" aria-live="polite"></div>

                <section class="firmware-share-table-scroll" role="region" aria-label="已共享固件列表，可水平及垂直滚动" tabindex="0">
                    <table class="firmware-share-table">
                        <thead>
                            <tr>
                                <th class="firmware-share-col-name" scope="col">名称</th>
                                <th class="firmware-share-col-path" scope="col">远端路径</th>
                                <th class="firmware-share-col-size" scope="col">大小</th>
                                <th class="firmware-share-col-downloads" scope="col">下载次数</th>
                                <th class="firmware-share-col-actions" scope="col">操作</th>
                            </tr>
                        </thead>
                        <tbody id="firmware-share-list">
                            <tr><td colspan="5" style="color: var(--text-secondary); text-align: center;">暂无共享固件</td></tr>
                        </tbody>
                    </table>
                </section>
            </div>

<div class="modal-buttons tech-dialog-actions firmware-share-footer"><span class="tech-footer-decoration" aria-hidden="true"></span>
                    <button class="btn-xxs" data-click="validateFirmwareShare">校验</button>
                    <button class="btn-xxs btn-primary" data-click="createFirmwareShare">创建分享</button>
                    <button class="btn-xxs" data-click="loadFirmwareShares">刷新列表</button>
                </div>
</div>
    </div>
