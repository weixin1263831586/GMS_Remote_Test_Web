<div id="ut-category-modal" class="modal" style="display: none;">
            <div class="modal-content modal-xs tech-dialog tech-dialog--ut-category"><svg class="tech-frame" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 1H986L999 14V584L984 599H16L1 584V16Z" vector-effect="non-scaling-stroke"/></svg>
        <span class="tech-corner-mark tech-corner-mark--tl" aria-hidden="true"></span><span class="tech-corner-mark tech-corner-mark--br" aria-hidden="true"></span>
                <div class="modal-header tech-dialog-header">
                    <div class="tech-title-group"><span class="tech-title-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#grid"></use></svg></span><span class="tech-title-divider" aria-hidden="true"></span><span class="modal-title">添加工具分类</span></div>
                    <span class="tech-header-ticks" aria-hidden="true"></span><button type="button" class="modal-close" aria-label="关闭" data-click="ut_closeCategoryModal">&times;</button>
                <svg class="tech-header-rule" viewBox="0 0 1000 16" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 15H490L506 1H916" vector-effect="non-scaling-stroke"/></svg></div>
                <div class="modal-body">
<p class="tech-intro">设置工具分类的名称与图标，便于整理常用工具。</p>
                    <section class="tech-form-section tech-form-section--ut-category" aria-label="工具分类"><div class="modal-form-row tech-structured-row tech-field-card">
                        <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#grid"></use></svg></span>
                        <label for="ut-category-name">分类名称:</label>
                        <input type="text" id="ut-category-name" placeholder="例如：Gerrit工具" maxlength="20" style="width: 100%; padding: 8px; background: var(--darker-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-size: 13px;" />
                    </div>
                    <div class="modal-form-row tech-structured-row tech-field-card">
                        <span class="tech-field-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false" aria-hidden="true"><use href="/static/icons/ui.svg#edit"></use></svg></span>
                        <label for="ut-category-icon">选择图标:</label>
                        <input type="text" id="ut-category-icon" placeholder="例如：📦" maxlength="2" style="width: 100%; padding: 8px; background: var(--darker-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-size: 13px;" />
                    </div></section>
                    <div class="modal-info-text">
                        💡 提示：图标可以是1-2个Emoji字符
                    </div>

                </div>

<div class="modal-buttons tech-dialog-actions"><span class="tech-footer-decoration" aria-hidden="true"></span>
                        <button class="btn-xxs" data-click="ut_closeCategoryModal">取消</button>
                        <button class="btn-xxs btn-primary" data-click="ut_saveCategory">保存</button>
                    </div>
</div>
        </div>
