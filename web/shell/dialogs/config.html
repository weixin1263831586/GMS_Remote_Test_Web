<div id="config-modal" class="modal">
        <div class="modal-content modal-l" style="height: min(560px, 72vh);">
            <div class="modal-header">
                <span class="modal-title">系统配置</span>
                <button type="button" class="modal-close" aria-label="关闭" data-click="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="config-modal-body">
                <!-- 动态生成配置表单 -->
            </div>
            <div id="config-modal-footer" class="modal-buttons" style="display:none;border-top:1px solid var(--border-color);padding:10px 20px;background:var(--light-bg);flex-shrink:0;">
                <button class="btn-xxs" data-click="closeModal">取消</button>
                <button class="btn-xxs btn-primary" data-click="saveConfig">保存</button>
            </div>
        </div>
    </div>
