        /* 与其他页面标题保持相同的 6px 内容间距。标题行保留 24px 供右侧
           按钮（page-title-actions）使用；左侧标题文字保持顶部对齐
           （line-height 1.6，字形不进 24px 行盒垂直居中——那会整体下沉
           约 2px），但盒子本身 align-self: stretch 撑满行高，使
           "标题盒底 → 内容顶"的间距仍是 margin-bottom 的 6px
           （runtime UI smoke 的 titleToContent 契约）。stretch 只改变
           盒高，字形仍渲染在盒顶，与 69f91b0 的防下沉意图一致。 */
        .host-workspace-title-row { position: relative; min-height: 24px; margin-bottom: 6px; display: flex; align-items: flex-start; }
        .main-container > #page-desktop.page-content,

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            flex: 0 0 auto;
            min-height: 24px;
        }
        .host-workspace-mode-pending.host-workspace-title-state::after {
            content: "";
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
        }
        .host-workspace-refresh-btn.btn-xs {

            min-width: 24px;
            height: 24px;
            min-height: 24px;

        body.workspace-scope-single #page-desktop .host-workspace-pane,
        body.workspace-scope-single #page-terminal .host-workspace-pane {

        body.workspace-scope-cluster #page-terminal .host-workspace-pane-header select {

        body.workspace-scope-cluster #page-terminal .host-workspace-pane-header .btn-xs {
            height: 24px;
            min-height: 24px;
            /* Single-glyph buttons (⛶ ▦ ×) measured 19.8–21.5px wide

            min-width: 24px;
            padding: 1px 6px;
            border-radius: 3px;
