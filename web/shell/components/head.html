    <style>
        .btn-xs { padding: 4px 10px;  background: var(--light-bg); border: 1px solid var(--border-color); border-radius: 3px; color: var(--text-primary); cursor: pointer; transition: all 0.2s;  }
        .btn-xs:hover { background: var(--border-color); transform: translateY(-1px); }
        .sidebar-brand { cursor: pointer; user-select: none; }
        .sidebar-brand:focus { outline: 2px solid var(--primary-color); outline-offset: 3px; border-radius: 4px; }
        .cluster-mode-toggle { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; padding: 6px 8px; background: var(--darker-bg); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .cluster-mode-toggle:hover { border-color: var(--primary-color); }
        .cluster-mode-toggle .mode-label {  color: var(--text-secondary); }
        .cluster-mode-toggle .mode-switch { position: relative; width: 36px; height: 18px; background: var(--border-color); border-radius: 9px; transition: background 0.2s; flex-shrink: 0; }
        .cluster-mode-toggle .mode-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: transform 0.2s; }
        .cluster-mode-toggle.active .mode-switch { background: var(--primary-gradient); }
        .cluster-mode-toggle.active .mode-switch::after { transform: translateX(18px); }
        .cluster-mode-toggle .mode-text {   }
        #sidebar-visibility-modal .modal-body { overflow: hidden; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        .sidebar-settings-tabs { display: flex; gap: 6px; padding: 4px; border-radius: 8px; background: var(--darker-bg); flex-shrink: 0; }
        .sidebar-settings-tab { flex: 1; padding: 9px 14px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text-secondary);  cursor: pointer; }
        .sidebar-settings-tab:hover { color: var(--text-primary); border-color: var(--border-color); }
        .sidebar-settings-tab.active { color: white; background: var(--primary-gradient); }
        .sidebar-settings-panel { min-height: 0; flex: 1; }
        .sidebar-settings-panel[hidden] { display: none !important; }
        #sidebar-settings-panel-visibility { display: flex; flex-direction: column; min-height: 0; }
        .sidebar-visibility-list { display: grid; gap: 8px; min-height: 0; overflow-y: auto; padding-right: 4px; flex: 1; }
        .sidebar-visibility-option { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--light-bg); cursor: pointer; }
        .sidebar-visibility-option input { margin: 0; }
        .sidebar-visibility-option .sidebar-icon { width: 22px; display: inline-flex; justify-content: center; }
        .sidebar-visibility-option .sidebar-text { flex: 0 0 106px; min-width: 0; white-space: nowrap; }
        .sidebar-visibility-option .sidebar-description { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary);  line-height: 1.45;  }
        body.workspace-scope-single #page-desktop .host-workspace-layouts,
        body.workspace-scope-single #page-terminal .host-workspace-layouts,
        body.workspace-scope-single [data-multi-host-control],
        body.workspace-scope-pending [data-multi-host-control],
        body.workspace-scope-single #page-devices [data-cluster-mode-only] { display: none !important; }
        body.workspace-scope-single #page-desktop .host-workspace-pane-header,
        body.workspace-scope-single #page-terminal .host-workspace-pane-header { display: none !important; }
        .host-workspace-single-bar { display: none; }
        body.workspace-scope-single .host-workspace-single-bar { display: flex; align-items: center; gap: 0; }
        .host-workspace-mode-pending { display: none; }
        /* 与其他页面标题保持相同的 6px 内容间距。标题行结构已组件化
           （components/page-header{,-actions,-end}.html → .page-header-row，
           几何单点在 common.css：标题盒高 19.2px、行高 17.2px、内容顶
           40.19 ≈ 默认 frame-top 40，页级覆盖已不需要）。行内特有子元素
           （拉伸状态条、布局按钮组）的样式保留在此。 */
        .main-container > #page-desktop.page-content,
        .main-container > #page-terminal.page-content,
        .main-container > #page-devices.page-content {
            /* 组件化后内容顶与默认 frame-top 对齐（原 45/49px 覆盖对应
               旧的内联行高，已由组件统一）。占位保留页级锚点便于调整。 */
        }
        .host-workspace-title-state { height: 24px; align-items: center; }
        .host-workspace-title-state > .host-workspace-pane-status {
            flex: 0 0 150px;
            width: 150px;
            max-width: 150px;
            height: 24px;
            margin-left: 0;
            line-height: 24px;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .host-workspace-title-state > .btn-xs {
            flex: 0 0 auto;
            min-height: 24px;
        }
        .host-workspace-mode-pending.host-workspace-title-state::after {
            content: "";
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
        }
        .host-workspace-refresh-btn.btn-xs {
            width: 24px;
            min-width: 24px;
            height: 24px;
            min-height: 24px;
            padding: 0;
            border: 0;
            border-radius: 4px;
            background: transparent;
            box-shadow: none;
            transform: none;
        }
        .host-workspace-refresh-btn.btn-xs:hover,
        .host-workspace-refresh-btn.btn-xs:focus-visible {
            border: 0;
            background: var(--lighter-bg);
            box-shadow: none;
            transform: none;
        }
        /* 单机模式使用公共页面外框；集群卡片统一内缩，避免与公共外框叠线。 */
        body.workspace-scope-single #page-desktop .host-workspace-pane,
        body.workspace-scope-single #page-terminal .host-workspace-pane {
            border: 0;
        }
        body.workspace-scope-cluster #page-desktop .host-workspace-grid,
        body.workspace-scope-cluster #page-terminal .host-workspace-grid {
            padding: 8px;
        }
        body.workspace-scope-cluster #page-desktop .host-workspace-pane-header,
        body.workspace-scope-cluster #page-terminal .host-workspace-pane-header {
            min-height: 28px;
            padding: 2px 4px;
            gap: 4px;
        }
        body.workspace-scope-cluster #page-desktop .host-workspace-pane-header select,
        body.workspace-scope-cluster #page-terminal .host-workspace-pane-header select {
            height: 24px;
            padding: 1px 4px;
        }
        body.workspace-scope-cluster #page-desktop .host-workspace-pane-header .btn-xs,
        body.workspace-scope-cluster #page-terminal .host-workspace-pane-header .btn-xs {
            height: 24px;
            min-height: 24px;
            /* Single-glyph buttons (⛶ ▦ ×) measured 19.8–21.5px wide
               with the old 1px 6px padding; enforce the 24×24 pointer-target
               minimum the geometry tests require. */
            min-width: 24px;
            padding: 1px 6px;
            border-radius: 3px;
            
        }
        body.workspace-scope-cluster #page-desktop .host-workspace-pane-header .host-workspace-refresh-btn,
        body.workspace-scope-cluster #page-terminal .host-workspace-pane-header .host-workspace-refresh-btn {
            width: 24px;
            min-width: 24px;
        }
