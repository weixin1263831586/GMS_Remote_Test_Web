name: One-shot vpn-proxy master on dedicated local runner

on:
  push:
    branches:
      - verify/vpn-proxy-master-0066c998-20261118
    paths:
      - .github/workflows/verify-vpn-proxy-master-0066c998.yml

permissions:
  contents: read

concurrency:
  group: vpn-proxy-local-0066c998
  cancel-in-progress: false

jobs:
  vpn-proxy-readonly:
    runs-on: [self-hosted, linux, gms-android-lab]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: /home/hcq/vpn-proxy
    steps:
      - name: Verify requested machine and dedicated runner
        working-directory: /
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          hostname
          test -f /home/hcq/GMS_Remote_Test_Web/actions-runner/.runner
          test -d /home/hcq/vpn-proxy/.git
          echo "Verified dedicated runner and local vpn-proxy directory"

      - name: Confirm exact local master commit and clean tree
        run: |
          set -euo pipefail
          git status -sb
          branch=$(git branch --show-current)
          sha=$(git rev-parse HEAD)
          echo "Local branch: $branch"
          echo "Local SHA: $sha"
          test "$branch" = master
          test "$sha" = 0066c998c856a0cef86ffa7184e2e46cf3fa83b7
          test -z "$(git status --porcelain)"
          echo "PASS: exact expected clean master"

      - name: Python unit regressions
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -v

      - name: Policy routing stub regressions
        run: |
          set -euo pipefail
          bash tests/test_policy_routing.sh

      - name: Real kernel routing namespace regressions
        run: |
          set -euo pipefail
          bash tests/test_policy_routing_kernel.sh

      - name: Check active proxy services and firewall
        if: always()
        run: |
          set -euo pipefail
          for service in rk-vpn-proxy.service rk-vpn-proxy-firewall.service rk-vpn-proxy-installer.service rk-vpn-proxy-stats.service rk-vpn-proxy-health.timer; do
            printf '%-40s' "$service"
            systemctl is-active "$service"
          done
          if sudo -n true 2>/dev/null; then
            sudo -n /usr/local/libexec/rk-vpn-proxy-firewall --check
            echo "PASS: deployed firewall check"
          else
            echo "SKIP: noninteractive sudo unavailable (no privilege changes attempted)"
          fi

      - name: Verify local stats HTTP endpoint
        if: always()
        run: |
          set -euo pipefail
          curl --noproxy '*' -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:17898/api/stats |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print("stats: proxy_port=%s sources=%s connected_count=%d recent_count=%d" % (d.get("proxy_port"), d.get("sources"), len(d.get("connected",[])), len(d.get("recent",[])))); assert d.get("sources",{}).get("connections") and d.get("sources",{}).get("access_log")'

      - name: Verify HTTPS CONNECT using local health listener, not LAN ACL
        if: always()
        run: |
          set -euo pipefail
          bash check-client.sh http://127.0.0.1:17897

      - name: Final source tree integrity
        if: always()
        run: |
          set -euo pipefail
          git status -sb
          test "$(git rev-parse HEAD)" = 0066c998c856a0cef86ffa7184e2e46cf3fa83b7
          test -z "$(git status --porcelain)"
          echo "PASS: test run left source tree clean"
