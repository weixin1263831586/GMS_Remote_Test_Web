name: Current repository integrity audit

on:
  push:
    branches: ['audit/**', 'ui/**']

permissions:
  contents: read

concurrency:
  group: current-repo-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Audit every tracked file and write evidence
        run: |
          python tools/scripts/maintenance/audit_repository_inventory.py \
            --output artifacts/current-repo-audit --strict
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify CodeSearch MCP subprocess bounds
        run: python -m pytest plugins/codesearch/tests -q
      - name: Verify architecture, contracts, documentation and diagrams
        run: |
          python -m pytest tests/architecture tests/contract -q \
            --junitxml=artifacts/current-repo-audit/contracts.xml
      - name: Upload repository audit and contract results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-repo-audit-${{ github.run_number }}
          path: artifacts/current-repo-audit/
          if-no-files-found: warn
          retention-days: 7
