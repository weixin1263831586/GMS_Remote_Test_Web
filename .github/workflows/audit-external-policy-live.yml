name: External policy knowledge live validation
on:
  push:
    branches: ['audit/**']
    paths:
      - 'features/knowledge/**'
      - 'features/redmine/analysis/kkagent/**'
      - 'features/redmine/tests/knowledge/test_reference_recall.py'
      - 'features/reports/diagnosis_recalls.py'
      - 'features/redmine/ui/**'
      - 'web/shell/pages/notes.html'
      - 'web/static/js/shell/shell-personal-knowledge.js'
      - 'agent/gms-remote-test/runtime/cli/redmine.sh'
      - 'agent/gms-remote-test/runtime/mcp_tool_schemas.py'
      - 'tools/scripts/testing/audit_external_policy_live.py'
      - 'features/redmine/reference_recall.py'
      - '.github/workflows/audit-external-policy-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-policy-live-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  public-cdd:
    if: github.repository == 'weixin1263831586/GMS_Remote_Test_Web'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test isolated indexes against public CDD
        shell: bash
        env:
          GMS_EXTERNAL_POLICY_LIVE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/external-policy.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          export GMS_DATA_ROOT="$scratch/data"
          python3 -m pytest -q -s \
            features/knowledge/tests/test_web_sources.py features/knowledge/tests/test_web_sources_live.py \
            features/knowledge/tests/test_policy_imports.py \
            features/reports/tests/test_diagnosis_system_background.py \
            --basetemp="$scratch/pytest"

  snapshot-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Replay isolated synthetic Redmine snapshots
        env:
          GMS_DATA_ROOT: ${{ runner.temp }}/external-policy-replay
        run: python -m pytest -q features/redmine/tests/knowledge/test_reference_recall.py
