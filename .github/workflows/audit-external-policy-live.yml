name: External policy knowledge live validation
on:
  push:
    branches: ['audit/**']
    paths:
      - 'features/knowledge/**'
      - 'features/redmine/analysis/kkagent/**'
      - 'features/redmine/tests/test_reference_recall.py'
      - 'features/reports/diagnosis_recalls.py'
      - 'features/redmine/ui/**'
      - 'web/shell/pages/notes.html'
      - 'web/static/js/shell/shell-personal-knowledge.js'
      - 'agent/gms-remote-test/runtime/cli/redmine.sh'
      - 'agent/gms-remote-test/runtime/mcp_tool_schemas.py'
      - 'tools/scripts/testing/audit_external_policy_live.py'
      - 'features/redmine/reference_recall.py'
      - '.github/workflows/audit-external-policy-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-policy-live-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  public-cdd:
    if: github.repository == 'weixin1263831586/GMS_Remote_Test_Web'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test isolated indexes against public CDD
        shell: bash
        env:
          GMS_EXTERNAL_POLICY_LIVE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/external-policy.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          export GMS_DATA_ROOT="$scratch/data"
          python3 -m pytest -q -s \
            features/knowledge/tests/test_web_sources.py features/knowledge/tests/test_web_sources_live.py \
            features/knowledge/tests/test_policy_imports.py features/redmine/tests/test_reference_recall.py \
            features/reports/tests/test_diagnosis_system_background.py \
            --basetemp="$scratch/pytest"

      - name: Replay existing Redmine snapshots without changing production data
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GMS_PARTNER_ANDROID_AUTO_LOGIN: '0'
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "ats-041055-64g"
          test "$(id -un)" = "hcq"
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/external-replay.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          export GMS_DATA_ROOT="$scratch/data"
          python3 -m tools.scripts.testing.audit_external_policy_live \
            --data-root "$HOME/GMS_Remote_Test_Web/data" --scratch "$scratch" \
            2>"$scratch/errors" | grep --line-buffered '^EXTERNAL_POLICY_REPLAY='
