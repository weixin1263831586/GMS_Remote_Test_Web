name: GMS modal staging validation (isolated Playwright)

# Isolated read-only UI validation on this branch; no production device access.
# Run synthetic browser fixtures on a GitHub-hosted Runner (no physical devices).
# Never accept pull_request, pull_request_target, or fork events on this runner.
on:
  push:
    branches:
      - audit/global-current-1cd4167-20261118
    paths:
      - '.github/workflows/modal-staging-validation.yml'
      - 'tests/**'
      - 'web/**'
      - 'features/**/ui/**'

permissions:
  contents: read

concurrency:
  group: gms-modal-current-1cd4167
  cancel-in-progress: true

jobs:
  modal-ui:
    if: >-
      github.repository == 'weixin1263831586/GMS_Remote_Test_Web' &&
      github.ref == 'refs/heads/audit/global-current-1cd4167-20261118' &&
      github.event_name == 'push' &&
      github.actor == 'weixin1263831586'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout verification commit into Runner _work only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Select supported Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Verify exact verification branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Runner checkout: $(git rev-parse --short HEAD)"
          echo "Runner workspace: $GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/gms-modal-validation"

      - name: Install CJK and emoji fonts for accurate UI screenshots
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          fc-list :lang=zh-cn family | grep -qi 'Noto Sans CJK'
      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gms-modal-validation/venv"
          "$RUNNER_TEMP/gms-modal-validation/venv/bin/python" -m pip install \
            --disable-pip-version-check -r requirements-dev.txt
          "$RUNNER_TEMP/gms-modal-validation/venv/bin/python" -m playwright install chromium

      - name: Static and architectural tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gms-modal-validation/venv/bin/python" -m pytest \
            tests/architecture/test_modal_tech_style.py \
            tests/architecture/test_modal_asset_versions.py \
            tests/architecture/test_modal_frame_single_owner.py \
            tests/architecture/test_modal_reference_fidelity_e6f16a49.py \
            tests/architecture/test_modal_template_contracts.py \
            -q --junitxml="$RUNNER_TEMP/gms-modal-validation/architecture.xml"

      - name: Isolated browser gallery and modal regressions
        shell: bash
        env:
          GMS_MODAL_GALLERY_OUT: ${{ runner.temp }}/gms-modal-validation/gallery
          GMS_AUTH_GALLERY_OUT: ${{ runner.temp }}/gms-modal-validation/auth-gallery
        run: |
          set -euo pipefail
          # RuntimeUiHarness starts a disposable 127.0.0.1 Uvicorn server with
          # isolated temporary data, no production device or Worker operations.
          "$RUNNER_TEMP/gms-modal-validation/venv/bin/python" -m pytest \
            tests/runtime_ui/test_modal_redesign.py \
            tests/runtime_ui/test_modals.py \
            tests/runtime_ui/test_modal_compact_layout.py \
            tests/runtime_ui/test_modal_consistency.py \
            tests/runtime_ui/test_auth_dialog.py \
            -q --junitxml="$RUNNER_TEMP/gms-modal-validation/browser.xml"

      - name: Upload synthetic-fixture UI screenshots and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gms-modal-staged-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/gms-modal-validation/architecture.xml
            ${{ runner.temp }}/gms-modal-validation/browser.xml
            ${{ runner.temp }}/gms-modal-validation/gallery/
            ${{ runner.temp }}/gms-modal-validation/auth-gallery/
          if-no-files-found: warn
          retention-days: 3

  modal-inventory:
    if: >-
      github.repository == 'weixin1263831586/GMS_Remote_Test_Web' &&
      github.ref == 'refs/heads/audit/global-current-1cd4167-20261118' &&
      github.event_name == 'push' &&
      github.actor == 'weixin1263831586'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Python 3.11
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install CJK and emoji fonts for accurate UI screenshots
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          fc-list :lang=zh-cn family | grep -qi 'Noto Sans CJK'
      - name: Setup isolated Chromium and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m playwright install chromium
      - name: Run every discovered modal independently on three viewports
        env:
          GMS_MODAL_MATRIX_OUT: ${{ runner.temp }}/gms-modal-inventory/cases
        run: |
          python -m pytest tests/runtime_ui/test_modal_inventory_runner.py -q \
            --junitxml="${{ runner.temp }}/gms-modal-inventory/cases.xml"
      - name: Build complete modal-by-modal evidence ledger
        if: always()
        env:
          GMS_MODAL_MATRIX_OUT: ${{ runner.temp }}/gms-modal-inventory/cases
        run: |
          python -m tests.runtime_ui.modal_matrix_report "$GMS_MODAL_MATRIX_OUT" --fail-incomplete
      - name: Publish all screenshots, verdicts and JUnit data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gms-modal-full-inventory-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/gms-modal-inventory/cases/
            ${{ runner.temp }}/gms-modal-inventory/cases.xml
          if-no-files-found: error
          retention-days: 7
