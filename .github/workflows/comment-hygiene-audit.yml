name: Repository comment and documentation audit
on:
  push:
    branches: [main, 'ui/**', 'audit/**', 'fix/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-comments:
    name: Check tracked comments and documentation
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Scan tracked files (read-only)
        run: python3 tools/scripts/maintenance/audit_comment_hygiene.py
