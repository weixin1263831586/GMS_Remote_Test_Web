name: Critical Fix live source and Gerrit accuracy audit (read-only)
on:
  push:
    branches: ['audit/mainline-gerrit-match-20261124']
    paths: ['.github/workflows/audit-critical-fix-live-accuracy.yml', 'tools/scripts/testing/audit_critical_fix_live.py']
permissions:
  contents: read
jobs:
  live-accuracy:
    if: github.repository == 'weixin1263831586/GMS_Remote_Test_Web'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Verify dedicated host
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "ats-041055-64g"
          test "$(id -un)" = "hcq"
          test -s "$HOME/GMS_Remote_Test_Web/actions-runner/.runner"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Compare live data, original source and Gerrit evidence
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GMS_PARTNER_ANDROID_AUTO_LOGIN: '0'
          GMS_SOAK_BASE_URL: ${{ vars.GMS_SOAK_BASE_URL || secrets.GMS_SOAK_BASE_URL }}
          GMS_SOAK_USERNAME: ${{ secrets.GMS_SOAK_USERNAME }}
          GMS_SOAK_PASSWORD: ${{ secrets.GMS_SOAK_PASSWORD }}
          GMS_SOAK_SESSION_TOKEN: ${{ secrets.GMS_SOAK_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/cf-accuracy.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          host="$HOME/GMS_Remote_Test_Web"
          if ! (cd "$host" && python3 -B -c 'from features.gms.repository import DB_PATH; print(DB_PATH)') >"$scratch/db" 2>"$scratch/error"; then
            echo 'Cannot resolve production index path.'
            exit 1
          fi
          db=$(tail -n 1 "$scratch/db")
          test -f "$db"
          python3 -B -m tools.scripts.testing.audit_critical_fix_live \
            --host-root "$host" --db "$db" 2>"$scratch/error" | \
            grep --line-buffered '^CF_AUDIT='
