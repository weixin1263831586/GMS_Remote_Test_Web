name: One-shot remove migrated daily-brief audit branch
on:
  push:
    branches:
      - ui/unify-page-edge-8px-20261120
permissions:
  contents: write
jobs:
  delete-migrated-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete only the superseded audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ui/unify-page-edge-8px-20261120'
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/audit/daily-brief-kkagent-readonly-20261120"
          echo 'Superseded audit branch deleted'
