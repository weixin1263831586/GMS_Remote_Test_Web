name: CI

# 门禁流程（对应 2026-08 代码审核第五节的最低门禁建议 + 2026-08-27 凭据泄漏评审）：
# secret scan → lint → 全量单测（含 worker_agent）→ 安全/架构测试 → 前端完整性 → 发布打包校验
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks 需要 parent^..HEAD 的完整历史；fetch-depth: 1 会导致
          # "fatal: ambiguous argument" 并连锁跳过 Ruff/pytest 等后续步骤。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Tracked-file secret scan
        run: python scripts/check_source_secrets.py .

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt 包含 requirements.txt + pytest/httpx
          # （TestClient 硬依赖）等测试专用依赖，生产部署不装它。
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Unit + feature + worker_agent tests
        # tests/e2e 依赖 Playwright 浏览器，由独立 browser-e2e job 执行，
        # 避免 browser 故障与 unit 故障混在一起。
        run: pytest tests features worker_agent/tests --ignore=tests/e2e -q

      - name: Security and architecture tests
        run: |
          pytest tests/architecture -q
          pytest features/auth/tests/test_security_boundary.py \
                 features/auth/tests/test_auth_api.py \
                 features/system/tests/test_skill_installer.py \
                 -q

      - name: Frontend integrity
        run: pytest tests/test_frontend_integrity.py -q

      - name: Release tree validation
        run: pytest tests/test_release_packaging.py -q

      - name: Soak tests (self-skipping without real devices)
        run: pytest tests/soak -q

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium || \
            python -m playwright install chromium

      - name: Browser E2E and smoke tests
        run: pytest tests/e2e tests/test_runtime_ui_smoke.py -q

# 真机链路由 nightly-soak.yml 在隔离实验台 runner 上执行。
