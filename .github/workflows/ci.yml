name: CI

# Independent CI gates feed the release-ready aggregate.
on:
  push:
    # main、audit/** 与 ui/** 推送共享完整门禁，不依赖临时分支专属工作流。
    branches: [main, 'audit/**', 'ui/**']
  pull_request:
    branches: [main]

# 最小权限：本流程所有 job 只需读仓库内容。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Audit both supported Python versions; only explicit 3.10 waivers apply.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.10"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Audit pinned dependencies; waivers require a reason and exit condition.
      - name: Audit runtime dependencies
        env:
          AUDIT_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python -m pip install --upgrade pip pip-audit
          if [ "$AUDIT_PYTHON_VERSION" = "3.10" ]; then
            WAIVERS=$(grep -v '^#' .github/pip-audit-py310-waivers.txt | sed '/^$/d' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
            pip-audit -r requirements.txt --strict $WAIVERS
          else
            pip-audit -r requirements.txt --strict
          fi
      - name: Audit dev dependencies
        env:
          AUDIT_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          # requirements-dev.txt 内联 requirements.txt,同栈审计（豁免同上）。
          if [ "$AUDIT_PYTHON_VERSION" = "3.10" ]; then
            WAIVERS=$(grep -v '^#' .github/pip-audit-py310-waivers.txt | sed '/^$/d' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
            pip-audit -r requirements-dev.txt --strict $WAIVERS
          else
            pip-audit -r requirements-dev.txt --strict
          fi

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Gitleaks requires complete commit history.
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Tracked-file secret scan
        run: python scripts/security/check_source_secrets.py .

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Reject unresolved merge conflict markers
        # 在 lint 前拒绝未解决的合并冲突标记，避免将无效源码提交到主线。
        run: python tools/scripts/maintenance/check_conflict_markers.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      # Formatter differences are advisory.
      - name: Ruff format baseline report
        if: always()
        continue-on-error: true
        run: ruff format --check .
      - name: Vulture dead-code scan
        run: python -m vulture bootstrap features foundation worker tools/scripts --min-confidence 90

  # Semgrep 静态安全扫描（SAST 门禁）：
  # - ERROR 级发现直接阻断（shell 注入、taint 传播等高危模式）；审计过的
  #   边界在源码以 `# nosemgrep: <rule>` 就地豁免并写明理由；
  # - WARNING 级作为存量改进清单随 artifact 上传，不阻断；
  # - 刻意排除的规则（纯 import 告警/与平台约定冲突的误报）逐条列出：
  #   B404(仅 import subprocess)、B313..B410 组合族(XML 解析显式禁用外部实体与网络访问)、
  #   B101(assert 是测试与防御式检查的合法用法)。
  static-sast:
    name: static-sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - name: Semgrep scan
        id: semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep==1.187.0
          mkdir -p artifacts
          # Without --error, findings do not change the scanner exit status.
          # Strict mode rejects scan failures; the next step gates findings by severity.
          set +e
          semgrep scan --config p/bandit --config p/owasp-top-ten \
              --config p/python . \
              --exclude-rule gitlab.bandit.B404 \
              --exclude-rule "gitlab.bandit.B313.B314.B315.B316.B318.B319.B320.B405.B406.B407.B408.B409.B410" \
              --exclude-rule python.lang.security.use-defused-xml.use-defused-xml \
              --exclude-rule gitlab.bandit.B101 \
              --json --output artifacts/semgrep.json \
              --metrics=off --strict
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -s artifacts/semgrep.json
      - name: Gate on ERROR-severity findings
        if: ${{ !cancelled() }}
        env:
          SEMGREP_EXIT_CODE: ${{ steps.semgrep.outputs.exit_code }}
        run: python tools/scripts/maintenance/check_semgrep_report.py artifacts/semgrep.json --scan-exit-code "$SEMGREP_EXIT_CODE"
      - name: Upload semgrep report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: artifacts/semgrep.json
          if-no-files-found: error


  # Each unit-test domain reports its own result and JUnit evidence.
  unit-foundation:
    name: unit-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt 包含 requirements.txt + pytest/httpx
          # （TestClient 硬依赖）等测试专用依赖，生产部署不装它。
          pip install -r requirements-dev.txt
      # Browser suites run in browser-e2e with Chromium installed; do not
      # duplicate them on this unit runner without browser dependencies.
      - name: Foundation / bootstrap / top-level tests
        run: |
          mkdir -p artifacts
          pytest tests foundation bootstrap conftest.py \
            --ignore=tests/e2e --ignore=tests/runtime_ui --ignore=tests/architecture --ignore=tests/soak \
            -q --junitxml=artifacts/unit-foundation.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-foundation
          path: artifacts/
          if-no-files-found: ignore

  unit-feature-auth-system:
    name: unit-auth-system-users
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Auth / system / users / GMS / SDK / ops feature tests
        run: |
          mkdir -p artifacts
          pytest features/auth features/system features/users features/gms features/sdk features/ops \
            -q --junitxml=artifacts/unit-auth-system.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-auth-system
          path: artifacts/
          if-no-files-found: ignore

  unit-feature-devices-firmware:
    name: unit-devices-firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Devices / firmware / cluster feature tests
        run: |
          mkdir -p artifacts
          pytest features/devices features/firmware features/apk features/cluster \
            -q --junitxml=artifacts/unit-devices-firmware.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-devices-firmware
          path: artifacts/
          if-no-files-found: ignore

  unit-feature-test-execution:
    name: unit-test-execution-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test execution / build / automation feature tests
        run: |
          mkdir -p artifacts
          pytest features/test_execution features/build features/automation \
            -q --junitxml=artifacts/unit-execution.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-execution
          path: artifacts/
          if-no-files-found: ignore

  unit-feature-assistant-reports:
    name: unit-assistant-reports-rest
    # Bundled OCR requires libtiff.so.5 and libgif.so.7 on Ubuntu 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install system libraries for the bundled OCR engine
        run: |
          # Install the bundled OCR engine's shared libraries.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgif7 libtiff5
      - name: Assistant / reports / redmine / kkagent / gerrit / knowledge / email tests
        run: |
          mkdir -p artifacts
          pytest features/assistant features/reports features/redmine features/kkagent \
                 features/gerrit features/knowledge features/email features/retrieval \
            -q --junitxml=artifacts/unit-assistant-reports.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-assistant-reports
          path: artifacts/
          if-no-files-found: ignore

  # Rebuild the pinned knowledge corpus and gate golden-query recall.
  knowledge-quality:
    name: knowledge-quality-golden-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Validate golden-query recall before changing the corpus revision.
      GMS_WIKI_PINNED_REVISION: "64a3963aedee5a5961ef25963520b991f14b51a1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Prepare pinned wiki clone + fresh temp index
        id: knowledge
        run: |
          bash tools/scripts/testing/prepare_knowledge_quality_corpus.sh
      - name: Golden query corpus recall gate
        env:
          GMS_KNOWLEDGE_INDEX: ${{ steps.knowledge.outputs.index }}
        run: |
          # Read the index path from the preceding step output.
          idx="$GMS_KNOWLEDGE_INDEX"
          test -n "${idx}" || { echo "::error::prepare step did not emit index output"; exit 1; }
          test -f "${idx}" || { echo "::error::temp index missing: ${idx}"; exit 1; }
          GMS_WIKI_INDEX_DB="${idx}" pytest \
            "features/knowledge/tests/test_external_provider.py::GoldenQueryCorpusTests" -v
      - name: Diagnosis development replay quality gate
        run: |
          pytest tests/quality -q
          python tools/scripts/testing/eval_diagnosis_quality.py --split development --replay tests/quality/diagnosis_replay_fixtures.jsonl --json

  diagnosis-holdout:
    # Holdout replay must pass for release readiness.
    name: diagnosis-holdout-replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Diagnosis holdout replay quality gate
        run: |
          python tools/scripts/testing/eval_diagnosis_quality.py --split holdout --replay tests/quality/diagnosis_replay_fixtures.jsonl --json

  worker-agent:
    name: worker-agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Worker agent tests
        run: |
          mkdir -p artifacts
          pytest worker/tests \
            -q --junitxml=artifacts/worker-agent.xml --durations=30
      - name: Soak tests (self-skipping without real devices)
        run: pytest tests/soak -q
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-worker-agent
          path: artifacts/
          if-no-files-found: ignore

  docs-snapshots-scripts:
    name: docs-snapshots-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install contract tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Audit tracked repository inventory
        run: python tools/scripts/maintenance/audit_repository_inventory.py --output artifacts/repository-inventory --strict
      - name: Upload repository inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-inventory
          path: artifacts/repository-inventory/
          if-no-files-found: error
      - name: Regenerate all frozen contract snapshots and reject drift
        run: |
          python -m tests.contract.generate_snapshots
          git diff --exit-code -- tests/contract/snapshots/
      - name: Check generated CLI documentation
        run: python tools/scripts/docs/generate_cli_docs.py --check
      - name: Check tracked Shell script syntax
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n

  security:
    name: security-and-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Security and architecture tests
        run: |
          pytest tests/architecture -q
          pytest features/auth/tests/test_security_boundary.py \
                 features/auth/tests/test_auth_api.py \
                 features/system/tests/test_skill_installer.py \
                 -q
      - name: Frontend integrity
        run: pytest tests/test_frontend_integrity.py -q
      - name: Release tree validation
        run: pytest tests/test_release_packaging.py -q

  agent-package:
    name: agent-package-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Agent plugin gate
        # Verify generated package parity and run source and generated tests separately.
        run: |
          make agent-sync-check agent-test PY=python
      - name: Standalone CodeSearch plugin tests
        run: make codesearch-check PY=python
      - name: Agent package lifecycle + registry contract
        # install/update/rollback/bootstrap lifecycle, single-root ZIP
        # contract between the registry and the release builder.
        run: |
          python -m pytest features/system/tests/test_agent_package_lifecycle.py \
                 features/system/tests/test_agent_package_builder.py -q
      - name: Release archive builds for every client variant
        run: python tools/scripts/agent/build_package.py --out dist

  browser-e2e:
    name: browser-e2e (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Run disjoint browser shards in parallel with complete module coverage.
    strategy:
      fail-fast: false
      matrix:
        shard: [early, dashboards, late, daily-brief-review]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium || \
            python -m playwright install chromium

      - name: Verify browser test shards cover every test module exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("tests/runtime_ui")
          groups = [
              list(root.glob("test_[a-c]*.py")),
              [path for path in root.glob("test_[d-m]*.py") if path.name != "test_daily_brief_review.py"],
              list(root.glob("test_[n-z]*.py")),
              [root / "test_daily_brief_review.py"],
          ]
          all_tests = list(root.glob("test_*.py"))
          selected = [path for group in groups for path in group]
          assert all(groups), "empty browser E2E shard"
          assert len(selected) == len(set(selected)) == len(all_tests)
          assert set(selected) == set(all_tests), "browser E2E test file omitted"
          PY

      - name: Browser E2E and smoke tests
        shell: bash
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Verbose node ids and faulthandler provide an exact last-running
          # test and Python stacks if a browser/iframe request stops progressing.
          case "$BROWSER_SHARD" in
            early)
              pytest tests/e2e tests/runtime_ui/test_[a-c]*.py -vv \
                -o faulthandler_timeout=180 --durations=25 \
                --junitxml=artifacts/browser-early.xml ;;
            dashboards)
              files=()
              for file in tests/runtime_ui/test_[d-m]*.py; do
                if [[ "$file" != tests/runtime_ui/test_daily_brief_review.py ]]; then
                  files+=("$file")
                fi
              done
              pytest "${files[@]}" -vv \
                -o faulthandler_timeout=180 --durations=25 \
                --junitxml=artifacts/browser-dashboards.xml ;;
            daily-brief-review)
              pytest tests/runtime_ui/test_daily_brief_review.py -vv \
                -o faulthandler_timeout=180 --durations=25 \
                --junitxml=artifacts/browser-daily-brief-review.xml ;;
            late)
              pytest tests/runtime_ui/test_[n-z]*.py -vv \
                -o faulthandler_timeout=180 --durations=25 \
                --junitxml=artifacts/browser-late.xml ;;
            *)
              echo "::error::Unknown browser shard"; exit 1 ;;
          esac

      - name: Upload browser E2E JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-browser-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  release-ready:
    name: release-ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [
      secret-scan, lint, dependency-audit, static-sast,
      unit-foundation, unit-feature-auth-system, unit-feature-devices-firmware,
      unit-feature-test-execution, unit-feature-assistant-reports,
      knowledge-quality, diagnosis-holdout,
      worker-agent,
      security, agent-package, browser-e2e, docs-snapshots-scripts,
    ]
    if: always()
    steps:
      - name: Require every gate green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Gate results: ${RESULTS}"
          # Evaluate each gate result independently.
          fail=0
          # Only success satisfies the release gate.
          for result in $(echo "${RESULTS}" | jq -r '.[]'); do
            if [ "${result}" != "success" ]; then
              echo "::error::Gate result '${result}' is not acceptable (only success counts as green)."
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "::error::One or more gates did not pass."
            exit 1
          fi
          echo "All required gates passed."

