name: CI

# 门禁流程（并行 job 拆分：Agent Package gate 不再被无关 UI/单测失败连坐跳过）：
#   secret-scan ─┐
#   lint ────────┤
#   dep-audit ───┤
#   static-sast ─┤
#   unit ────────┤
#   security ────┼─→ release-ready（汇总）
#   agent-pkg ───┤
#   browser-e2e ─┘
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：本流程所有 job 只需读仓库内容。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      # pip-audit 扫描 requirements*.txt 的已知漏洞(OSV/PyPIADVISORY)。
      # 精确 pin 的依赖使结果可复现;新漏洞进入门禁而不是潜伏到运行时。
      # PYSEC-2026-2858(paramiko rsakey SHA-1)已随 paramiko 5.0.0 升级修复,
      # 不再需要豁免;如新增豁免必须在注释中给出理由与退出条件。
      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict
      - name: Audit dev dependencies
        run: |
          # requirements-dev.txt 内联 requirements.txt,同栈审计。
          pip-audit -r requirements-dev.txt --strict

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Gitleaks 需要 parent^..HEAD 的完整历史；fetch-depth: 1 会导致
          # "fatal: ambiguous argument" 并连锁跳过后续步骤。
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Tracked-file secret scan
        run: python scripts/check_source_secrets.py .

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Vulture dead-code scan
        # 审核第 22 项僵尸代码检测: min-confidence 90 只报 100% 置信度的
        # 未用局部变量; FastAPI/mock 误报在 tools/scripts/maintenance/vulture_allowlist.py。
        run: |
          python -m vulture features foundation worker_agent tools \
            tools/scripts/maintenance/vulture_allowlist.py --min-confidence 90

  # Semgrep 静态安全扫描（SAST 门禁）：
  # - ERROR 级发现直接阻断（shell 注入、taint 传播等高危模式）；审计过的
  #   边界在源码以 `# nosemgrep: <rule>` 就地豁免并写明理由；
  # - WARNING 级作为存量改进清单随 artifact 上传，不阻断；
  # - 刻意排除的规则（纯 import 告警/与平台约定冲突的误报）逐条列出：
  #   B404(仅 import subprocess)、B313..B410 组合族(与 use-defused-xml
  #   同源：标准库 ET 不解析外部实体，lxml 已在 _LXML_PARSER 显式关闭)、
  #   B101(assert 是测试与防御式检查的合法用法)。
  static-sast:
    name: static-sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - name: Semgrep scan
        env:
          SEMGREP_RULES: p/bandit p/owasp-top-ten p/python
        run: |
          python -m pip install --upgrade pip semgrep
          mkdir -p artifacts
          # 退出码不作为本步判定（存在 WARNING 时 semgrep 也返回 1），
          # 门禁在下一步按 severity 精确判定。
          semgrep scan --config p/bandit --config p/owasp-top-ten \
              --config p/python . \
              --exclude-rule gitlab.bandit.B404 \
              --exclude-rule "gitlab.bandit.B313.B314.B315.B316.B318.B319.B320.B405.B406.B407.B408.B409.B410" \
              --exclude-rule python.lang.security.use-defused-xml.use-defused-xml \
              --exclude-rule gitlab.bandit.B101 \
              --json --output artifacts/semgrep.json \
              --metrics=off || true
      - name: Gate on ERROR-severity findings
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("artifacts/semgrep.json").read_text())
          errors = [f for f in data.get("results", [])
                    if f["extra"]["severity"] == "ERROR"]
          for f in errors:
              loc = f"{f['path']}:{f['start']['line']}"
              print(f"::error file={f['path']},line={f['start']['line']}"
                    f"::{f['check_id']} at {loc}")
          print(f"semgrep: {len(data.get('results', []))} findings, "
                f"{len(errors)} ERROR (gate)")
          raise SystemExit(1 if errors else 0)
          PY
      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: artifacts/semgrep.json
          if-no-files-found: error


  # 历史上这里是一个 `pytest tests features worker_agent/tests -q` 大 job：
  # 某个域卡住会把整组测试 cancel 掉，已经出现的 failure 连 failure
  # summary 都来不及打印。按域拆分后每组独立判定，失败时上传 JUnit 与
  # durations 定位。
  unit-foundation:
    name: unit-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt 包含 requirements.txt + pytest/httpx
          # （TestClient 硬依赖）等测试专用依赖，生产部署不装它。
          pip install -r requirements-dev.txt
      - name: Foundation / bootstrap / top-level tests
        run: |
          mkdir -p artifacts
          pytest tests foundation bootstrap conftest.py \
            --ignore=tests/e2e --ignore=tests/architecture --ignore=tests/soak \
            -q --junitxml=artifacts/unit-foundation.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-foundation
          path: artifacts/
          if-no-files-found: ignore

  unit-feature-auth-system:
    name: unit-auth-system-users
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Auth / system / users feature tests
        run: |
          mkdir -p artifacts
          pytest features/auth features/system features/users \
            -q --junitxml=artifacts/unit-auth-system.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-auth-system
          path: artifacts/
          if-no-files-found: ignore

  unit-feature-devices-firmware:
    name: unit-devices-firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Devices / firmware / cluster feature tests
        run: |
          mkdir -p artifacts
          pytest features/devices features/firmware features/cluster \
            -q --junitxml=artifacts/unit-devices-firmware.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-devices-firmware
          path: artifacts/
          if-no-files-found: ignore

  unit-feature-test-execution:
    name: unit-test-execution-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test execution / build / automation feature tests
        run: |
          mkdir -p artifacts
          pytest features/test_execution features/build features/automation \
            -q --junitxml=artifacts/unit-execution.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-execution
          path: artifacts/
          if-no-files-found: ignore

  unit-feature-assistant-reports:
    name: unit-assistant-reports-rest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Assistant / reports / redmine / gerrit / knowledge / email tests
        run: |
          mkdir -p artifacts
          pytest features/assistant features/reports features/redmine \
                 features/gerrit features/knowledge features/email \
            -q --junitxml=artifacts/unit-assistant-reports.xml --durations=30
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit-assistant-reports
          path: artifacts/
          if-no-files-found: ignore

  worker-agent:
    name: worker-agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Worker agent tests
        run: |
          mkdir -p artifacts
          pytest worker_agent/tests \
            -q --junitxml=artifacts/worker-agent.xml --durations=30
      - name: Soak tests (self-skipping without real devices)
        run: pytest tests/soak -q
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-worker-agent
          path: artifacts/
          if-no-files-found: ignore

  security:
    name: security-and-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Security and architecture tests
        run: |
          pytest tests/architecture -q
          pytest features/auth/tests/test_security_boundary.py \
                 features/auth/tests/test_auth_api.py \
                 features/system/tests/test_skill_installer.py \
                 -q
      - name: Frontend integrity
        run: pytest tests/test_frontend_integrity.py -q
      - name: Release tree validation
        run: pytest tests/test_release_packaging.py -q

  agent-package:
    name: agent-package-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Agent plugin gate
        # plugins/gms-remote-test is a generated release payload synced from
        # agent/gms-remote-test (single source of truth) with a
        # six-way version contract (package.yaml / three manifests / CLI /
        # MCP). The git diff covers the WHOLE plugin directory, so a stale
        # MCP or skill copy can no longer sneak into main.
        # 生成树的测试也必须运行——其 scripts/ 布局、
        # launcher 可执行位与自包含性只有在这套测试里才被覆盖。两个测试树
        # 的文件同名，必须分开两次 pytest 调用收集。
        run: |
          python tools/scripts/agent/sync_package.py .
          git diff --exit-code -- plugins/gms-remote-test/
          python -m pytest agent/gms-remote-test/tests -q
          python -m pytest plugins/gms-remote-test/tests -q
      - name: Agent package lifecycle + registry contract
        # install/update/rollback/bootstrap lifecycle, single-root ZIP
        # contract between the registry and the release builder.
        run: |
          python -m pytest features/system/tests/test_agent_package_lifecycle.py \
                 features/system/tests/test_agent_package_builder.py -q
      - name: Release archive builds for every client variant
        run: python tools/scripts/agent/build_package.py --out dist

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium || \
            python -m playwright install chromium

      - name: Browser E2E and smoke tests
        run: pytest tests/e2e tests/test_runtime_ui_smoke.py -q

  release-ready:
    name: release-ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [
      secret-scan, lint, dependency-audit, static-sast,
      unit-foundation, unit-feature-auth-system, unit-feature-devices-firmware,
      unit-feature-test-execution, unit-feature-assistant-reports,
      worker-agent,
      security, agent-package, browser-e2e,
    ]
    if: always()
    steps:
      - name: Require every gate green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Gate results: ${RESULTS}"
          # 旧的 `grep -Ev '"(success|skipped)"'` 对单行
          # JSON 无效——只要整行含 "success" 就会被整体过滤，掩盖真实失败
          # （["success","failure"] 被判通过）。改为逐元素精确判定。
          fail=0
          # "every gate green" means success — a skipped
          # gate (e.g. its `if:` skipped the job after an earlier failure)
          # used to count as green and masked the failure. Only `success`
          # is acceptable; anything else (including skipped/cancelled) fails.
          for result in $(echo "${RESULTS}" | jq -r '.[]'); do
            if [ "${result}" != "success" ]; then
              echo "::error::Gate result '${result}' is not acceptable (only success counts as green)."
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "::error::One or more gates did not pass."
            exit 1
          fi
          echo "All required gates passed."

# 真机链路由 nightly-soak.yml 在隔离实验台 runner 上执行。
