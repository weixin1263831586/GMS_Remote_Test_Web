name: On-prem Chromium typography verification

on:
  push:
    branches: ['audit/**']
    paths:
      - 'web/static/css/typography.css'
      - 'web/static/css/typography/**'
      - 'tests/runtime_ui/test_typography_rendered.py'
      - 'tests/runtime_ui/test_modal_compact_layout.py'
      - 'web/static/css/modal-tech-cases.css'
      - '.github/workflows/onprem-typography-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onprem-typography-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onprem-computed-fonts:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - name: Confirm dedicated registered Runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "ats-041055-64g"
          test "$(id -un)" = "hcq"
          test -s "$HOME/GMS_Remote_Test_Web/actions-runner/.runner"
          echo "Read-only browser validation in an isolated temporary test server"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - name: Prepare isolated Python/Chromium environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gms-type-venv"
          "$RUNNER_TEMP/gms-type-venv/bin/python" -m pip install --disable-pip-version-check -r requirements-dev.txt
          "$RUNNER_TEMP/gms-type-venv/bin/python" -m playwright install chromium
      - name: Run typography contracts and browser checks with screenshots
        shell: bash
        env:
          GMS_UI_PREVIEW_DIR: ${{ runner.temp }}/gms-typography-evidence
          GMS_MODAL_GALLERY_OUT: ${{ runner.temp }}/gms-typography-evidence/modal-gallery
          GMS_SKIP_RUNTIME_ENV: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p "$GMS_UI_PREVIEW_DIR"
          "$RUNNER_TEMP/gms-type-venv/bin/python" -m pytest -q \
            tests/test_typography_contract.py \
            tests/runtime_ui/test_typography_rendered.py \
            tests/runtime_ui/test_modal_compact_layout.py \
            --junitxml="$GMS_UI_PREVIEW_DIR/junit.xml"
      - name: Upload computed typography and screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onprem-typography-${{ github.run_id }}
          path: ${{ runner.temp }}/gms-typography-evidence/
          if-no-files-found: warn
          retention-days: 7
