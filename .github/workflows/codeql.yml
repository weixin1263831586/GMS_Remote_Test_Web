name: codeql

# CodeQL 周期性深度扫描（与 CI 里的 Semgrep PR 门禁互补）：
# - Semgrep 在每次 push/PR 上跑规则集门禁（ERROR 级阻断）；
# - CodeQL 做全库数据流分析，成本高，按周 + main 分支 push 触发；
# - SARIF 以 artifact 形式留存而不是上传 code-scanning API：
#   私有/GHES 安装没有 security-events: write 的场景也能跑通，
#   需要 GitHub Advanced Security 集成时把 artifact 换成
#   github/codeql-action/upload-sarif 即可。
on:
  push:
    branches: [main]
  schedule:
    # UTC 周三 19:00（北京周四凌晨），避开工作时段的 runner 占用。
    - cron: "0 19 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42c378ffbb438be29e3e1848d520fb0a8ee1c271 # v3.38.0
        with:
          languages: python, javascript
          # 查询套件：安全审计 + 质量告警里只取安全子集，
          # 避免非安全类发现淹没结果。
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42c378ffbb438be29e3e1848d520fb0a8ee1c271 # v3.38.0
        with:
          output: sarif-results
          # 只落本地 SARIF 供 artifact 上传;不调 code-scanning API
          # (私有/GHES 无 security-events: write 时该调用会失败)。
          upload: false
          category: codeql

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: sarif-results/
          if-no-files-found: error
