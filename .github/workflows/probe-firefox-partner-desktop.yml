name: GMS requirements targeted scan validation
on:
  push:
    branches: ['audit/main-full-review-18fe70e-20261126']
    paths: ['.github/workflows/probe-firefox-partner-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-index-audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - name: Confirm Controller host
        run: |
          test "$RUNNER_NAME" = ats-041055-64g
          test "$(id -un)" = hcq
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Run scoped Requirements scan and verify index metadata
        shell: bash
        env:
          GMS_SOAK_BASE_URL: ${{ vars.GMS_SOAK_BASE_URL || secrets.GMS_SOAK_BASE_URL }}
          GMS_SOAK_USERNAME: ${{ secrets.GMS_SOAK_USERNAME }}
          GMS_SOAK_PASSWORD: ${{ secrets.GMS_SOAK_PASSWORD }}
          GMS_SOAK_SESSION_TOKEN: ${{ secrets.GMS_SOAK_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import time
          from pathlib import Path
          from urllib.parse import urlsplit
          import requests
          sys.path.insert(0, 'tools/scripts/testing')
          from resolve_soak_host_config import resolve
          def report(key, value):
              print(f'{key}={value}', flush=True)
          def main():
              root = Path.home() / 'GMS_Remote_Test_Web'
              cfg, _ = resolve(root / 'configs/local', dict(os.environ))
              base = cfg.get('GMS_SOAK_BASE_URL', '').rstrip('/')
              target = urlsplit(base)
              if target.scheme != 'https' or not target.hostname or target.username or target.password or target.query or target.fragment:
                  report('controller_config', 'unavailable')
                  return 1
              with requests.Session() as session:
                  session.trust_env = False
                  for cert in ('gms-local-ca.crt', 'gms-local.crt'):
                      candidate = root / 'configs/secrets/certs' / cert
                      if candidate.is_file() and target.hostname in ('localhost', '127.0.0.1'):
                          session.verify = str(candidate)
                          break
                  token = cfg.get('GMS_SOAK_SESSION_TOKEN')
                  if token:
                      session.cookies.set('gms_session', token, domain=target.hostname, secure=True)
                  elif cfg.get('GMS_SOAK_USERNAME') and cfg.get('GMS_SOAK_PASSWORD'):
                      response = session.post(base + '/api/auth/login', json={'username': cfg['GMS_SOAK_USERNAME'], 'password': cfg['GMS_SOAK_PASSWORD']}, allow_redirects=False, timeout=15)
                      if response.status_code != 200:
                          report('controller_login_http', response.status_code)
                          return 1
                      response = session.post(base + '/api/auth/elevate', json={'username': cfg['GMS_SOAK_USERNAME'], 'password': cfg['GMS_SOAK_PASSWORD']}, allow_redirects=False, timeout=15)
                      if response.status_code != 200:
                          report('controller_elevation_http', response.status_code)
                          return 1
                  else:
                      report('controller_auth', 'not_configured')
                      return 1
                  def get(route, params=None):
                      response = session.get(base + route, params=params, allow_redirects=False, timeout=15)
                      if response.status_code != 200:
                          report('controller_api_http', response.status_code)
                          raise ValueError('API unavailable')
                      payload = response.json()
                      if payload.get('success') is not True:
                          raise ValueError('API unsuccessful')
                      return payload
                  prefix = '/api/gms-update-center'
                  status = get(prefix + '/scan/status')['data']['status']
                  if status.get('running'):
                      report('requirements_scan_start', 'busy')
                      return 1
                  previous = status.get('run_id') or 0
                  # Explicit source only; never trigger the full GMS or radar scan.
                  response = session.post(base + prefix + '/scan',
                                          params={'mode': 'full', 'source': 'gms_requirements'},
                                          allow_redirects=False, timeout=15)
                  report('requirements_scan_start_http', response.status_code)
                  if response.status_code != 200 or response.json().get('success') is not True:
                      return 1
                  scan = {}
                  for _ in range(36):
                      time.sleep(3)
                      status = get(prefix + '/scan/status')['data']['status']
                      run_id = status.get('run_id')
                      if (isinstance(run_id, int) and run_id > previous
                              and not status.get('running')
                              and status.get('source') == ['gms_requirements']):
                          scan = status
                          break
                  state = scan.get('state')
                  report('requirements_scan_state', state if state in ('completed', 'failed', 'partial', 'interrupted') else 'pending')
                  if scan:
                      report('requirements_scan_run_id', scan['run_id'])
                      for item in scan.get('sources', []):
                          if item.get('source_key') != 'gms_requirements':
                              continue
                          for field in ('discovered', 'fetched', 'parsed'):
                              number = item.get(field)
                              report('requirements_scan_' + field, number if isinstance(number, int) else 'unknown')
                      evidence = get(prefix + '/scan/runs/' + str(scan['run_id']), {'limit': 50})['data']
                      for item in evidence.get('documents', []):
                          if item.get('source_key') == 'gms_requirements':
                              code = item.get('status_code')
                              report('requirements_document_http', code if isinstance(code, int) else 'unknown')
                  sources = get(prefix + '/sources')['data']
                  matches = [item for item in sources.get('scanned', []) if item.get('source_key') == 'gms_requirements']
                  report('requirements_source_configured', any(item.get('source_key') == 'gms_requirements' for item in sources.get('configured', [])))
                  report('requirements_scan_exists', bool(matches))
                  if matches:
                      code = matches[0].get('status_code')
                      report('requirements_last_http', code if isinstance(code, int) else 'unknown')
                  for label, route, params in (
                      ('requirements_sections', '/requirements/sections', {}),
                      ('requirements_table_rows', '/requirements/table-rows', {}),
                      ('android16_version_tags', '/requirements', {'android_version': 'Android 16'}),
                      ('android16_ram_candidates', '/requirements', {'android_version': 'Android 16', 'q': 'RAM'}),
                      ('android16_memory_candidates', '/requirements', {'android_version': 'Android 16', 'q': 'memory'}),
                      ('all_version_ram_sections', '/requirements/sections', {'q': 'RAM'}),
                  ):
                      payload = get(prefix + route, {**params, 'limit': 1})
                      total = payload.get('meta', {}).get('total')
                      report(label, total if isinstance(total, int) else 'unknown')
              return 0 if state == 'completed' else 1
          try:
              sys.exit(main())
          except Exception as exc:
              report('audit_error_type', type(exc).__name__)
              sys.exit(1)
          PY
