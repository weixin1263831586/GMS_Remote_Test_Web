name: GMS requirements read-only result audit
on:
  push:
    branches: ['audit/main-full-review-18fe70e-20261126']
    paths: ['.github/workflows/probe-firefox-partner-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-index-audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - name: Confirm Controller host
        run: |
          test "$RUNNER_NAME" = ats-041055-64g
          test "$(id -un)" = hcq
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify existing Requirements scan and local index
        shell: bash
        env:
          GMS_SOAK_BASE_URL: ${{ vars.GMS_SOAK_BASE_URL || secrets.GMS_SOAK_BASE_URL }}
          GMS_SOAK_USERNAME: ${{ secrets.GMS_SOAK_USERNAME }}
          GMS_SOAK_PASSWORD: ${{ secrets.GMS_SOAK_PASSWORD }}
          GMS_SOAK_SESSION_TOKEN: ${{ secrets.GMS_SOAK_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import time
          from pathlib import Path
          from urllib.parse import urlsplit
          import requests
          sys.path.insert(0, 'tools/scripts/testing')
          from resolve_soak_host_config import resolve
          def report(key, value):
              print(f'{key}={value}', flush=True)
          def main():
              root = Path.home() / 'GMS_Remote_Test_Web'
              cfg, _ = resolve(root / 'configs/local', dict(os.environ))
              base = cfg.get('GMS_SOAK_BASE_URL', '').rstrip('/')
              target = urlsplit(base)
              if target.scheme != 'https' or not target.hostname or target.username or target.password or target.query or target.fragment:
                  report('controller_config', 'unavailable')
                  return 1
              with requests.Session() as session:
                  session.trust_env = False
                  for cert in ('gms-local-ca.crt', 'gms-local.crt'):
                      candidate = root / 'configs/secrets/certs' / cert
                      if candidate.is_file() and target.hostname in ('localhost', '127.0.0.1'):
                          session.verify = str(candidate)
                          break
                  token = cfg.get('GMS_SOAK_SESSION_TOKEN')
                  if token:
                      session.cookies.set('gms_session', token, domain=target.hostname, secure=True)
                  elif cfg.get('GMS_SOAK_USERNAME') and cfg.get('GMS_SOAK_PASSWORD'):
                      response = session.post(base + '/api/auth/login', json={'username': cfg['GMS_SOAK_USERNAME'], 'password': cfg['GMS_SOAK_PASSWORD']}, allow_redirects=False, timeout=15)
                      if response.status_code != 200:
                          report('controller_login_http', response.status_code)
                          return 1
                      response = session.post(base + '/api/auth/elevate', json={'username': cfg['GMS_SOAK_USERNAME'], 'password': cfg['GMS_SOAK_PASSWORD']}, allow_redirects=False, timeout=15)
                      if response.status_code != 200:
                          report('controller_elevation_http', response.status_code)
                          return 1
                  else:
                      report('controller_auth', 'not_configured')
                      return 1
                  def get(route, params=None):
                      response = session.get(base + route, params=params, allow_redirects=False, timeout=15)
                      if response.status_code != 200:
                          report('controller_api_http', response.status_code)
                          raise ValueError('API unavailable')
                      payload = response.json()
                      if payload.get('success') is not True:
                          raise ValueError('API unsuccessful')
                      return payload
                  prefix = '/api/gms-update-center'
                  scan = {}
                  for _ in range(8):
                      try:
                          status = get(prefix + '/scan/status')['data']['status']
                      except requests.RequestException:
                          report('controller_status_retry', 'connection_unavailable')
                          time.sleep(3)
                          continue
                      if status.get('source') == ['gms_requirements'] and not status.get('running'):
                          scan = status
                          break
                      if not status.get('running'):
                          break
                      time.sleep(3)
                  state = scan.get('state')
                  report('requirements_scan_state', state if state in ('completed', 'failed', 'partial', 'interrupted') else 'pending')
                  if scan and isinstance(scan.get('run_id'), int):
                      report('requirements_scan_run_id', scan['run_id'])
                      for item in scan.get('sources', []):
                          if item.get('source_key') != 'gms_requirements':
                              continue
                          error = str(item.get('error') or '').lower()
                          categories = (
                              ('source document redirected or missing article', 'unexpected_document'),
                              ('no records parsed', 'empty_parse'),
                              ('conflicting duplicate record key', 'duplicate_record_key'),
                              ('unique constraint failed', 'unique_constraint'),
                              ('not null constraint failed', 'not_null_constraint'),
                              ('no such table', 'missing_table'),
                              ('no such column', 'missing_column'),
                              ('database is locked', 'database_locked'),
                              ('has no attribute', 'attribute_error'),
                              ('unexpected keyword argument', 'signature_error'),
                              ('not enough values to unpack', 'unpack_error'),
                              ('too many values to unpack', 'unpack_error'),
                              ('list index out of range', 'index_error'),
                              ('invalid ipv6 url', 'invalid_link'),
                              ('maximum recursion depth', 'recursion_error'),
                              ('is not defined', 'name_error'),
                              ('conflicting', 'record_conflict'),
                              ('has no len()', 'type_error'),
                              ('not subscriptable', 'type_error'),
                              ('not iterable', 'type_error'),
                              ('cannot be serialized', 'serialization_error'),
                              ('is not json serializable', 'serialization_error'),
                              ('unsupported operand', 'type_error'),
                              ('foreign key constraint', 'foreign_key_constraint'),
                              ('check constraint failed', 'check_constraint'),
                              ('访问失败', 'authorization_or_http_error'),
                          )
                          category = next((label for marker, label in categories if marker in error),
                                          'other' if error else 'none')
                          report('requirements_failure_category', category)
                          for field in ('discovered', 'fetched', 'parsed'):
                              number = item.get(field)
                              report('requirements_scan_' + field, number if isinstance(number, int) else 'unknown')
                      evidence = get(prefix + '/scan/runs/' + str(scan['run_id']), {'limit': 50})['data']
                      for item in evidence.get('documents', []):
                          if item.get('source_key') == 'gms_requirements':
                              code = item.get('status_code')
                              report('requirements_document_http', code if isinstance(code, int) else 'unknown')
                  sources = get(prefix + '/sources')['data']
                  matches = [item for item in sources.get('scanned', []) if item.get('source_key') == 'gms_requirements']
                  report('requirements_source_configured', any(item.get('source_key') == 'gms_requirements' for item in sources.get('configured', [])))
                  report('requirements_scan_exists', bool(matches))
                  if matches:
                      code = matches[0].get('status_code')
                      report('requirements_last_http', code if isinstance(code, int) else 'unknown')
                  for label, route, params in (
                      ('requirements_sections', '/requirements/sections', {}),
                      ('requirements_table_rows', '/requirements/table-rows', {}),
                      ('android16_version_tags', '/requirements', {'android_version': 'Android 16'}),
                      ('android16_ram_candidates', '/requirements', {'android_version': 'Android 16', 'q': 'RAM'}),
                      ('android16_memory_candidates', '/requirements', {'android_version': 'Android 16', 'q': 'memory'}),
                      ('all_version_ram_sections', '/requirements/sections', {'q': 'RAM'}),
                  ):
                      payload = get(prefix + route, {**params, 'limit': 1})
                      total = payload.get('meta', {}).get('total')
                      report(label, total if isinstance(total, int) else 'unknown')
              return 0
          try:
              sys.exit(main())
          except Exception as exc:
              report('audit_error_type', type(exc).__name__)
              sys.exit(1)
          PY

      - name: Reproduce current parser and publication without modifying live index
        if: always()
        shell: bash
        env:
          GMS_PARTNER_ANDROID_AUTO_LOGIN: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import argparse
          import contextlib
          import io
          import tempfile
          import traceback
          from pathlib import Path

          def report(key, value):
              print(f'{key}={value}', flush=True)

          stage = 'imports'
          try:
              # Suppress library output; publish only counts and code coordinates.
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  from features.gms.fetching import BatchFetcher, build_session, canonical_url, fetch_source
                  from features.gms.parsers.requirements import parse_gms_requirements
                  from features.gms.repository import connect
                  from features.gms.scanner import begin_run
                  from features.gms.sources import SOURCES
                  from features.gms.update_records import sync_source
                  source = next(item for item in SOURCES if item.key == 'gms_requirements')
                  stage = 'fetch'
                  args = argparse.Namespace(browser='auto', cookie_file=None, cookie_header=None, verbose=False)
                  with build_session(args) as session:
                      fetcher = BatchFetcher(session, retries=0)
                      fetched = fetch_source(fetcher, source, 25)
                      if fetcher.documents[canonical_url(source.url)][2] != 'ready':
                          raise ValueError('unexpected document')
                  stage = 'parse'
                  parsed = parse_gms_requirements(fetched)
                  counts = (len(parsed.requirement_sections), len(parsed.requirement_clauses),
                            len(parsed.requirement_table_rows))
                  stage = 'scratch_publish'
                  with tempfile.TemporaryDirectory(prefix='gms-policy-audit-') as temp:
                      with contextlib.closing(connect(Path(temp) / 'audit.sqlite3')) as conn:
                          run_id = begin_run(conn, 'full', [source], 'audit')
                          with conn:
                              sync_source(conn, run_id, fetched, force=True,
                                          timestamp='2026-11-26T00:00:00Z', parsed=parsed)
                          from features.gms.requirement_lookup import lookup_requirement_sections
                          stage = 'scratch_lookup'
                          result = lookup_requirement_sections(conn, 'section:Low RAM')
                          matched = result.get('status') == 'matched'
                          rows = sum(len(item.get('table_rows', [])) for item in result.get('sections', []))
              report('scratch_sections', counts[0])
              report('scratch_clauses', counts[1])
              report('scratch_table_rows', counts[2])
              report('scratch_low_ram_matched', matched)
              report('scratch_low_ram_rows', rows)
              report('scratch_result', 'success' if matched and rows else 'missing_low_ram')
          except Exception as exc:
              report('scratch_stage', stage)
              report('scratch_exception_type', type(exc).__name__)
              for frame in traceback.extract_tb(exc.__traceback__):
                  path = Path(frame.filename)
                  if 'features/gms/' in path.as_posix():
                      report('scratch_code_location', f'{path.name}:{frame.lineno}:{frame.name}')
              report('scratch_result', 'failed')
              raise SystemExit(1) from None
          PY
