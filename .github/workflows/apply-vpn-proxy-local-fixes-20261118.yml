name: Fix local vpn-proxy regressions and verify

on:
  push:
    branches: [verify/vpn-proxy-master-0066c998-20261118]
    paths: [.github/workflows/apply-vpn-proxy-local-fixes-20261118.yml]

permissions:
  contents: read

concurrency:
  group: vpn-proxy-local-repair
  cancel-in-progress: false

jobs:
  apply-repair-on-local-host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: /home/hcq/vpn-proxy
        shell: bash
    steps:
      - name: Validate expected local checkout and identity
        run: |
          set -euo pipefail
          test -f /home/hcq/GMS_Remote_Test_Web/actions-runner/.runner
          test "$(hostname)" = ats-041055-64g
          test "$(git branch --show-current)" = master
          test "$(git rev-parse HEAD)" = 0066c998c856a0cef86ffa7184e2e46cf3fa83b7
          test -z "$(git status --porcelain)"
          echo "PASS: exclusive, clean, exact local master"

      - name: Apply targeted local-only source and test fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/home/hcq/vpn-proxy')
          path=root/'check-client.sh'
          text=path.read_text()
          start=text.index('proxy=', text.index('source_dir='))
          end=text.index('failed=0\n',start)
          replacement='''# Explicit positional/environment overrides retain their exact semantics.
          proxy=""
          if [[ $# -gt 0 ]]; then
              proxy=$1
          elif [[ -v RK_VPN_PROXY_URL && -n "$RK_VPN_PROXY_URL" ]]; then
              proxy=$RK_VPN_PROXY_URL
          fi
          if [[ -z "$proxy" ]]; then
              # The public listener is ACL-restricted; on the proxy host the
              # designated loopback health listener is the correct test path.
              read -r advertised_proxy local_proxy listen_host < <(
                  cd "$source_dir" &&
                  python3 -c 'from configuration import load_config, proxy_url; c=load_config(); print(proxy_url(c), "http://127.0.0.1:%d" % c["health_port"], c["listen_host"])'
              )
              proxy=$advertised_proxy
              if command -v ip >/dev/null 2>&1 &&
                 ip -4 route get "$listen_host" 2>/dev/null | grep '^local ' >/dev/null; then
                  proxy=$local_proxy
                  echo "INFO: local server detected; checking loopback health listener $proxy"
              fi
          fi
          retries=2
          if [[ -v RK_VPN_CHECK_RETRIES ]]; then
              case "$RK_VPN_CHECK_RETRIES" in
                  1|2|3) retries=$RK_VPN_CHECK_RETRIES ;;
                  *) echo "RK_VPN_CHECK_RETRIES must be 1, 2 or 3" >&2; exit 2 ;;
              esac
          fi
          '''
          text=text[:start]+replacement+text[end:]
          start=text.index('for url in https://www.google.com')
          end=text.index("printf 'Proxy exit IP:", start)
          replacement='''for url in https://www.google.com https://dl.google.com https://storage.googleapis.com https://android.googlesource.com https://github.com; do
              result=''
              curl_exit=0
              for (( attempt=1; attempt<=retries; attempt++ )); do
                  if result=$(curl --silent --show-error --noproxy '' --proxy "$proxy" \\
                      --connect-timeout 5 --max-time 30 --head --output /dev/null \\
                      --write-out '%{http_connect} %{http_code} %{ssl_verify_result}' "$url"); then
                      curl_exit=0
                      break
                  else
                      curl_exit=$?
                      if (( attempt < retries )); then
                          echo "WARN: $url transport error (curl=$curl_exit), retry $((attempt+1))/$retries" >&2
                          sleep 1
                      fi
                  fi
              done
              if (( curl_exit == 0 )); then
                  read -r connect code tls <<<"$result"
                  printf '%s CONNECT=%s HTTP=%s TLS_VERIFY=%s\\n' "$url" "$connect" "$code" "$tls"
                  if [[ "$connect" != 200 || "$tls" != 0 || ! "$code" =~ ^[1-5][0-9][0-9]$ ]]; then
                      failed=1
                  fi
              else
                  printf 'FAIL: %s - curl request failed (exit %s after %s attempts)\\n' "$url" "$curl_exit" "$retries" >&2
                  failed=1
              fi
          done
          '''
          text=text[:start]+replacement+text[end:]
          path.write_text(text)

          path=root/'scripts/firewall.sh'
          text=path.read_text()
          replacements={
            '| grep -qxF "$network"':'| grep -xF "$network" >/dev/null',
            '| grep -qF "to $network $uid_selector lookup main"':'| grep -F "to $network $uid_selector lookup main" >/dev/null',
            '| grep -qF \'unreachable default\'':'| grep -F \'unreachable default\' >/dev/null',
            '| grep -qF "dev $VPN_INTERFACE"':'| grep -F "dev $VPN_INTERFACE" >/dev/null',
          }
          for before,after in replacements.items():
              if before not in text:
                  raise AssertionError('Expected firewall construct missing: '+before)
              text=text.replace(before,after)
          path.write_text(text)

          path=root/'tests/test_client_stats.py'
          text=path.read_text()
          old='stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)'
          assert text.count(old)==1, 'expected subprocess Popen in dashboard test'
          text=text.replace(old,'stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, text=True)')
          path.write_text(text)

          path=root/'tests/test_client_checks.py'
          text=path.read_text()
          old='CURL_EXIT=curl_exit, IP_EXIT=ip_exit, REQUEST_LOG=str(root / "requests"))'
          assert text.count(old)==1
          text=text.replace(old,'CURL_EXIT=curl_exit, IP_EXIT=ip_exit, REQUEST_LOG=str(root / "requests"), RK_VPN_CHECK_RETRIES="1")')
          insert='''    def test_local_versus_remote_default_proxy_and_explicit_override(self):
              import json
              cases = [
                  ("server local", "local", None, "http://127.0.0.1:17897"),
                  ("remote client", "remote", None, "http://192.0.2.100:7897"),
                  ("explicit override", "local", "http://explicit.invalid:8888",
                   "http://explicit.invalid:8888"),
              ]
              for label, route, override, expected in cases:
                  with self.subTest(label=label), tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      config = json.loads((ROOT / "config.json").read_text())
                      config.update(listen_host="192.0.2.100",
                                    advertise_host="192.0.2.100", health_port=17897)
                      conf = root / "config.json"
                      conf.write_text(json.dumps(config))
                      ip = root / "ip"
                      ip.write_text("#!/bin/bash\\n"
                                    "if [[ \\"$ROUTE_KIND\\" == local ]]; then "
                                    "echo 'local 192.0.2.100 dev lo src 192.0.2.100'; "
                                    "else echo '192.0.2.100 via 192.0.2.1 dev eth0'; fi\\n")
                      ip.chmod(0o755)
                      curl = root / "curl"
                      curl.write_text("#!/bin/bash\\n"
                                      "printf '%s\\\\n' \\"$*\\" >> \\"$REQUEST_LOG\\"\\n"
                                      "if [[ \\"$*\\" == *api.ipify.org* ]]; then echo 198.51.100.42; "
                                      "else echo '200 200 0'; fi\\n")
                      curl.chmod(0o755)
                      env=dict(os.environ, PATH=f"{root}:{os.environ['PATH']}",
                               ROUTE_KIND=route, REQUEST_LOG=str(root / "requests"),
                               RK_VPN_PROXY_CONFIG=str(conf), RK_VPN_PROXY_URL="",
                               RK_VPN_CHECK_RETRIES="1")
                      args=["bash", str(ROOT / "check-client.sh")]
                      if override:
                          args.append(override)
                      result=subprocess.run(args,env=env,capture_output=True,text=True)
                      self.assertEqual(result.returncode,0,result.stdout+result.stderr)
                      self.assertEqual(len((root / "requests").read_text().splitlines()),6)
                      self.assertTrue(all(("--proxy "+expected) in line for line in
                                          (root / "requests").read_text().splitlines()))

          '''
          marker='\n\nif __name__ == "__main__":'
          assert text.count(marker)==1
          text=text.replace(marker,'\n'+insert+marker)
          path.write_text(text)

          path=root/'README.md'
          text=path.read_text()
          needle='bash tests/test_policy_routing_kernel.sh\n'
          assert needle in text
          text=text.replace(needle,needle,1)
          note='\n运行 `bash check-client.sh` 时会在代理服务器本机自动选择回环健康监听端口，避免把本机访问错误地当成外部白名单客户端；在其他电脑上仍使用对外代理端口。可显式传入代理 URL 覆盖自动选择。网络传输错误默认重试一次（可用 `RK_VPN_CHECK_RETRIES=1` 关闭重试），目标站点的有效 HTTP 400/403 不等于代理转发失败。\n'
          at='## 出口保护与限制'
          assert at in text
          text=text.replace(at,note+'\n'+at,1)
          path.write_text(text)
          print('Applied target fixes:', 'check-client.sh', 'scripts/firewall.sh',
                'tests/test_client_stats.py', 'tests/test_client_checks.py', 'README.md')
          PY
          bash -n check-client.sh
          bash -n scripts/firewall.sh
          git diff --stat

      - name: Run unit tests with ResourceWarning elevated
        run: |
          set -euo pipefail
          PYTHONWARNINGS=error::ResourceWarning python3 -B -m unittest discover -s tests -v

      - name: Validate stub and kernel policy routing
        run: |
          set -euo pipefail
          bash tests/test_policy_routing.sh
          bash tests/test_policy_routing_kernel.sh

      - name: Verify no unexpected files changed and commit only locally
        run: |
          set -euo pipefail
          git diff --check
          expected=$(printf '%s\n' README.md check-client.sh scripts/firewall.sh tests/test_client_checks.py tests/test_client_stats.py | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          git add -- README.md check-client.sh scripts/firewall.sh tests/test_client_checks.py tests/test_client_stats.py
          git -c user.name='Local VPN Proxy Verification' -c user.email='local-vpn-proxy-check@users.noreply.github.com' commit -m 'fix: robust on-host proxy checks and regression resource cleanup'
          git status -sb
          test -z "$(git status --porcelain)"

      - name: Check real local CONNECT TLS after source fix
        run: |
          set -euo pipefail
          bash check-client.sh
