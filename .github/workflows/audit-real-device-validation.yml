name: Audit one-shot Android real-device verification

on:
  push:
    branches:
      - audit/global-current-0acf952-20261117
    paths:
      - .github/workflows/audit-real-device-validation.yml
  workflow_dispatch:

permissions:
  contents: read

# The scheduled nightly soak uses the same lab devices.
concurrency:
  group: nightly-android-soak
  cancel-in-progress: false

jobs:
  audited-device-chain:
    runs-on: [self-hosted, linux, gms-android-lab]
    timeout-minutes: 90
    env:
      GMS_SOAK_BASE_URL: ${{ secrets.GMS_SOAK_BASE_URL }}
      GMS_SOAK_USERNAME: ${{ secrets.GMS_SOAK_USERNAME }}
      GMS_SOAK_PASSWORD: ${{ secrets.GMS_SOAK_PASSWORD }}
      GMS_SOAK_DEVICE_HOST: ${{ vars.GMS_SOAK_DEVICE_HOST }}
      GMS_SOAK_DEVICE_SERIAL: ${{ vars.GMS_SOAK_DEVICE_SERIAL }}
      GMS_SOAK_BUSIDS: ${{ vars.GMS_SOAK_BUSIDS }}
      GMS_SOAK_WORKER_ID: ${{ vars.GMS_SOAK_WORKER_ID }}
      GMS_SOAK_SUITE_KEY: ${{ vars.GMS_SOAK_SUITE_KEY }}
      GMS_SOAK_MODULE: ${{ vars.GMS_SOAK_MODULE }}
      GMS_SOAK_JOB_TIMEOUT: "3600"
    steps:
      - name: Verify this is the requested dedicated actions-runner
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/GMS_Remote_Test_Web/actions-runner/.runner" || {
            echo "::error::This host is not ~/GMS_Remote_Test_Web/actions-runner; refusing to use its devices."
            exit 1
          }
          echo "Verified dedicated actions-runner: ${RUNNER_NAME}"
      - name: Check out audited source commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - name: Install tests into runner Python
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify lab setup; never silently skip physical-device testing
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner name: ${RUNNER_NAME}"
          if [[ -d "$HOME/GMS_Remote_Test_Web/actions-runner" ]]; then
            echo "Expected actions-runner installation is present"
          else
            echo "Runner installation path differs from the requested home directory"
          fi
          test -n "$GMS_SOAK_BASE_URL"
          test -n "$GMS_SOAK_USERNAME"
          test -n "$GMS_SOAK_PASSWORD"
          test -n "$GMS_SOAK_DEVICE_HOST"
          test -n "$GMS_SOAK_BUSIDS"
          test -n "$GMS_SOAK_WORKER_ID"
      - name: Run focused repaired-code regression tests
        run: |
          python -m pytest -q \
            features/assistant/tests/test_response_envelopes.py \
            features/system/tests/test_audit_source_contracts.py \
            features/redmine/tests/test_evidence_freshness_contract.py
      - name: Verify concurrent sync exclusions across runner processes
        run: python -m pytest -q tests/test_process_sync_guard.py
      - name: Observe local ADB devices if this runner hosts ADB
        shell: bash
        run: |
          if command -v adb >/dev/null 2>&1; then
            adb devices -l
          else
            echo "No local adb; controller-to-worker test uses remote Worker ADB"
          fi
      - name: Controller to Worker to USB/IP to Tradefed to recovery
        run: python -m pytest tests/soak/test_device_chain_soak.py -q -s
