[package]
name = "gms-worker-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Proprietary"
publish = false

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["std"] }
libc = "0.2.169"
regex = "1.11.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
wait-timeout = "0.2.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "gms-process-inventory"
path = "src/bin/gms-process-inventory.rs"

[[bin]]
name = "gms-usbip-control"
path = "src/bin/gms-usbip-control.rs"
