# GMS Remote Test - Python 项目配置
# 统一代码质量工具配置

[tool.ruff]
# 目标 Python 版本
target-version = "py310"
# 最大行宽
line-length = 120
# 排除目录
exclude = [
    ".git",
    ".claude",
    "__pycache__",
    "tools",
    "vendor",
    "web/static/vendor",
    "data",
    "CI_AutoTest",
    "data.pre_identity_migration_backup",
    "remote-run-server",
    "rk-skills",
    "scripts_local",
    "skills",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
# 忽略的规则
ignore = [
    "E501",   # line too long (由 formatter 处理)
    "N801",   # class name (项目已有 PascalCase 规范)
    "N802",   # function name (项目允许 mixedCase for route handlers)
    "N803",   # argument name
    "N806",   # variable name
    "B008",   # function call in default argument (FastAPI Depends pattern)
    "B905",   # zip without strict
    "SIM108", # ternary operator (可读性优先)
    "SIM102", # collapsible if（保持分支结构清晰）
    "SIM103", # needless bool（保持返回值语义直观）
    "SIM105", # suppressible exception（保留显式异常处理）
    "RUF012", # mutable class defaults（兼容现有工具类定义）
    "RUF013", # implicit optional（兼容现有 Python API）
    "RUF001", # unicode characters in strings (中文字符串)
    "RUF002", # unicode characters in docstrings (中文文档)
    "RUF003", # unicode characters in comments (中文注释)
]

[tool.ruff.lint.isort]
# import 排序配置
known-first-party = [
    "bootstrap",
    "features",
    "foundation",
    "workflows",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
# 格式化配置
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests", "features", "worker_agent/tests"]
pythonpath = ["."]
norecursedirs = ["rk-skills", "skills", "tools", "data", ".worktrees"]
addopts = ["-p", "no:xonsh"]
