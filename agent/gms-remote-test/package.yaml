# GMS Agent Package declaration (10.txt §四) — the single version source.
#
# tools/release_agent.py --version X.Y.Z rewrites every generated version
# declaration (CLI GMS_RT_VERSION, MCP SERVER_VERSION, the three plugin
# manifests) from this file. plugins/gms-remote-test/ is a generated release
# payload produced by plugins/gms-remote-test/scripts/sync_package.sh and
# packaged for distribution by tools/build_agent_package.py.
name: gms-remote-test
version: 0.13.0
description: >-
  GMS Remote Test agent runtime: gms-rt CLI, MCP server and the operational
  Skill for device inventory, CTS/GTS/VTS/STS execution, durable jobs,
  reports, Redmine evidence, APK analysis and approval-gated firmware burn.

# Skill source of truth (relative to the repository root).
skill:
  path: skills/gms-remote-test

runtime:
  entrypoint: scripts/mcp_server.py
  launcher: scripts/mcp_launcher.sh
  cli: scripts/gms-remote-test.sh
  installer: scripts/install.sh
  agent_cli: scripts/gms-agent

clients:
  codex: true
  kimi: true
  kkagent: true

auth:
  # Agents authenticate exclusively with Agent Service Tokens
  # (GMS_AUTH_TOKEN_FILE, 0600) plus server-side one-shot approval tokens
  # for destructive actions. Platform passwords never enter agent context.
  mode: service_token

capabilities:
  - devices
  - tests
  - jobs
  - reports
  - apk
  - redmine
  - firmware
  - approvals
