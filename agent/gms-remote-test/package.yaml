# GMS Agent Package declaration (11.txt) — the single package source root.
#
# agent/gms-remote-test/ is the ONLY hand-edited tree:
#   runtime/    gms-rt CLI, MCP server, launcher, gms-agent, SDK
#   skill/      SKILL.md + references + agent metadata
#   manifests/  the three client plugin manifests (source form)
#   tests/      package tests (synced into the generated plugin payload)
#   docs/       README/AGENTS shipped with the generated plugin
#
# plugins/gms-remote-test/ is GENERATED by tools/sync_agent_package.py —
# never edit it directly. dist/ is produced by tools/build_agent_package.py.
#
# tools/release_agent.py --version X.Y.Z rewrites every generated version
# declaration (CLI GMS_RT_VERSION, MCP SERVER_VERSION, the three manifests)
# from this file.
name: gms-remote-test
version: 0.17.1
description: >-
  GMS Remote Test agent runtime: gms-rt CLI, MCP server and the operational
  Skill for device inventory, CTS/GTS/VTS/STS execution, durable jobs,
  reports, Redmine evidence, APK analysis and approval-gated firmware burn.

# Layout inside THIS package root (source form; the generated plugin and the
# distribution archive flatten runtime/ into scripts/, see sync_agent_package).
runtime:
  entrypoint: runtime/mcp_server.py
  launcher: runtime/mcp_launcher.py
  cli: runtime/gms-remote-test.sh
  agent_cli: runtime/gms-agent
  mcp_config: runtime/agent_mcp_config.py
  sdk: runtime/gms_agent/

skill:
  root: skill

clients:
  codex:
    manifest: manifests/codex.plugin.json
  kimi:
    manifest: manifests/kimi.plugin.json
  kkagent:
    manifest: manifests/kk.plugin.json

auth:
  # Agents authenticate exclusively with Agent Service Tokens
  # (GMS_AUTH_TOKEN_FILE, 0600) plus server-side one-shot approval tokens
  # for destructive actions. Platform passwords never enter agent context.
  mode: service_token
  approval_tokens: true

package:
  formats:
    - universal
    - codex
    - kimi
    - kkagent

capabilities:
  - devices
  - tests
  - jobs
  - reports
  - apk
  - redmine
  - firmware
  - approvals
